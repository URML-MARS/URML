# Gated PX4 SITL + ARM64-emulation workflow.
#
# Three jobs, gated to manual dispatch + weekly cron (never per-push:
# the PX4-Autopilot clone + submodule fetch + SITL build and the QEMU
# emulation are slow and the coverage doesn't justify the per-PR cost):
#
#   px4-smoke       — the light gate: install the real `pymavlink`
#   wheel, confirm PX4Adapter constructs against it (no SITL, no
#   connection) and that ConformanceRunner.adapter_factory accepts a
#   live factory, then re-run the mocked-pymavlink unit suite under the
#   real wheel. The PX4 analog of ros2-integration's `rclpy-smoke`.
#
#   px4-sitl-e2e    — the real end-to-end: the drone/flight_only_positive
#   conformance fixture run through ConformanceRunner with a live
#   PX4Adapter flying PX4 v1.17.0 SITL (SIH, PX4's built-in simulator)
#   over MAVLink, checked by a listen-only witness. Heavy, best-effort.
#   The PX4 analog of ros2-integration's gazebo-e2e job.
#
#   px4-arm64-build — the Jetson-relevant signal: under linux/arm64
#   QEMU emulation, pip-install the URML + [px4] stack and run the
#   hermetic unit suite. URML's adapters are pure Python + pymavlink
#   with zero CUDA/Jetson APIs, so emulation is a faithful proxy for
#   *our* code on a Jetson-class board. Real Jetson + real-robot HIL is
#   deferred until hardware exists; this is the honest pre-hardware
#   ARM64 gate, not a hardware-verification claim.
#
# HONESTY NOTE: CI has not run px4-sitl-e2e yet. The job's steps
# mirror the recipe that flew PX4
# v1.17.0 SITL locally in WSL2 (Ubuntu 24.04) on 2026-09-27, recorded in
# reference/px4-runtime/tests/integration/sitl-runs/: the same clone
# (v1.17.0, shallow, recursive, shallow submodules), PX4's Python
# requirements in a venv (Ubuntu 24.04 blocks system pip), the
# build-only `make px4_sitl_default` (on v1.17, `DONT_RUN=1 make px4_sitl
# sihsim_quadx` still starts the pxh shell and exits with an error), and
# `sleep infinity | HEADLESS=1 make px4_sitl sihsim_quadx` to boot (the
# pipe keeps the pxh shell's stdin open). The steps were rehearsed from
# scratch in WSL2 on 2026-09-27, from the clone to the stop, and the
# fixture flew (see the sitl-runs record with "heartbeat" in its name);
# only apt ran without sudo, and the GitHub-only env and upload steps did
# not run. A GitHub runner can still differ: every diagnostic (SITL log,
# pytest output, PX4 ULog) is uploaded on `always()`, so treat the first
# run as the calibration run, exactly as the ros2-integration gazebo-e2e
# job was treated.

name: px4-integration

on:
  workflow_dispatch:
  schedule:
    # Mondays 07:00 UTC (one hour after ros2-integration, to stagger).
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  px4-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv

      - name: Install URML packages + real pymavlink
        run: |
          # urml-px4-runtime depends on urml-ros2-runtime (it imports the
          # substrate-neutral Protocol from urml_ros2_runtime.substrate.base)
          # and urml-validator. Install all editable so pip never reaches
          # for an unpublished PyPI dist. pymavlink is the [px4] extra's
          # only dep; install the real wheel explicitly.
          python3 -m venv /tmp/ci-venv
          . /tmp/ci-venv/bin/activate
          pip install -U pip
          pip install \
            -e reference/validator \
            -e reference/ros2-runtime \
            -e reference/px4-runtime \
            -e conformance \
            pymavlink \
            "pytest>=8"

      - name: Live smoke (real pymavlink, no SITL)
        env:
          URML_PX4_INTEGRATION: "1"
        run: |
          . /tmp/ci-venv/bin/activate
          cd reference/px4-runtime
          python -m pytest tests/integration/test_px4_adapter_live.py -v

      - name: Re-run hermetic unit tests under real pymavlink
        run: |
          . /tmp/ci-venv/bin/activate
          cd reference/px4-runtime
          python -m pytest tests/test_px4_adapter.py tests/test_composite_adapter.py -v

  px4-sitl-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        # bash -eo pipefail: a failing command in a `| tee` pipe fails the step.
        shell: bash
    env:
      # PX4's `stable` branch pointed at v1.17.0 (d6f12ad) for the local
      # run that flew; the tag pins that commit.
      PX4_REF: v1.17.0
    steps:
      - uses: actions/checkout@v7

      - name: Paths
        run: |
          {
            echo "PX4_DIR=$HOME/PX4-Autopilot"
            echo "PX4_VENV=$HOME/px4-venv"
            echo "URML_VENV=$HOME/urml-venv"
            echo "LOGS=$HOME/e2e-logs"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/e2e-logs"

      - name: Install PX4 build toolchain
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake git ninja-build python3-dev python3-pip python3-venv \
            astyle lcov libxml2-utils rsync unzip zip

      - name: Clone PX4-Autopilot v1.17.0 (shallow, recursive, shallow submodules)
        run: |
          set -x
          git clone --branch "$PX4_REF" --depth 1 --recursive --shallow-submodules \
            https://github.com/PX4/PX4-Autopilot.git "$PX4_DIR"
          { git -C "$PX4_DIR" describe --tags --always; git -C "$PX4_DIR" rev-parse --short HEAD; } \
            | tee "$LOGS/px4-version.txt"

      - name: Install PX4's Python requirements in a venv
        run: |
          set -x
          # Ubuntu 24.04 blocks pip on the system Python (PEP 668), so PX4's
          # build requirements go in a venv that the build and boot steps
          # put first on PATH.
          python3 -m venv "$PX4_VENV"
          "$PX4_VENV/bin/pip" install -r "$PX4_DIR/Tools/setup/requirements.txt"

      - name: Build PX4 SITL (build only)
        run: |
          set -x
          export PATH="$PX4_VENV/bin:$PATH"
          cd "$PX4_DIR"
          # Build without running. On v1.17, `DONT_RUN=1 make px4_sitl
          # sihsim_quadx` still starts the pxh shell and ends in an error.
          make px4_sitl_default < /dev/null

      - name: Install URML packages
        run: |
          set -x
          # urml-px4-runtime imports the substrate-neutral Protocol from
          # urml-ros2-runtime; install every package editable so pip never
          # reaches for a published dist. pymavlink is the [px4] extra.
          python3 -m venv "$URML_VENV"
          "$URML_VENV/bin/pip" install \
            -e reference/validator \
            -e reference/ros2-runtime \
            -e reference/px4-runtime \
            -e conformance \
            pymavlink \
            "pytest>=8"

      - name: Boot PX4 SITL (SIH quadrotor, headless)
        run: |
          set -x
          export PATH="$PX4_VENV/bin:$PATH"
          cd "$PX4_DIR"
          # `sleep infinity |` keeps the pxh shell's stdin open, so SITL
          # keeps running in the background instead of exiting on EOF.
          nohup bash -c 'sleep infinity | HEADLESS=1 make px4_sitl sihsim_quadx' \
            > "$LOGS/sitl.log" 2>&1 &

      - name: Wait for a PX4 heartbeat on udp 14540
        run: |
          "$URML_VENV/bin/python" - <<'PY' | tee "$LOGS/heartbeat.log"
          import sys

          from pymavlink import mavutil

          conn = mavutil.mavlink_connection("udp:127.0.0.1:14540")
          heartbeat = conn.wait_heartbeat(timeout=300)
          conn.close()
          print("HEARTBEAT", heartbeat)
          sys.exit(0 if heartbeat is not None else 1)
          PY

      - name: Run the PX4 SITL end-to-end test (with the listen-only witness)
        env:
          URML_PX4_SITL: "1"
        run: |
          cd reference/px4-runtime
          "$URML_VENV/bin/python" -m pytest tests/integration/test_px4_sitl_e2e.py \
            -v -s -p no:cacheprovider | tee "$LOGS/pytest.log"

      - name: Stop PX4 SITL and collect its logs
        if: always()
        run: |
          # PX4 logs "Connection to ground station lost" 10 s after the
          # adapter's heartbeat stops; wait so the log shows it.
          sleep 15
          pkill -f "px4_sitl_default/bin/px4" || true
          pkill -f "sleep infinity" || true
          sleep 2
          if [ -f "$LOGS/sitl.log" ]; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOGS/sitl.log" > "$LOGS/sitl.clean.log"
          fi
          if [ -d "$PX4_DIR/build/px4_sitl_default/rootfs/log" ]; then
            cp -r "$PX4_DIR/build/px4_sitl_default/rootfs/log" "$LOGS/ulog"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: px4-sitl-e2e-diagnostics
          path: ~/e2e-logs
          retention-days: 14

  px4-arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Install URML + [px4] and run the hermetic suite under linux/arm64
        run: |
          set -eux
          # Stock arm64 Python image under QEMU. No custom Dockerfile and
          # no image push: this is a faithful proxy for *our* code on a
          # Jetson-class board (pure Python + pymavlink, zero CUDA/Jetson
          # APIs), not a hardware-verification claim. pymavlink publishes
          # aarch64 wheels; gcc/python3-dev are installed only as a
          # fallback in case pip has to build from sdist. A red first run
          # is a calibration signal (e.g. a missing build dep), exactly
          # as the px4-sitl-e2e and ros2-integration jobs are treated.
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            python:3.11-slim-bookworm \
            bash -c '
              set -eux
              apt-get update && apt-get install -y --no-install-recommends gcc python3-dev
              python -m pip install -U pip
              pip install \
                -e reference/validator \
                -e reference/ros2-runtime \
                -e reference/px4-runtime \
                -e conformance \
                pymavlink \
                "pytest>=8"
              python -c "import urml_px4_runtime, pymavlink, platform; print(\"urml_px4_runtime + pymavlink import OK on\", platform.machine())"
              cd reference/px4-runtime
              python -m pytest tests/test_px4_adapter.py tests/test_composite_adapter.py -q
            '
