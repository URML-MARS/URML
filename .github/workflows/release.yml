# Build + publish the five URML packages.
#
# DESIGN: publishing is irreversible and outward-facing, so this workflow
# is NEVER triggered by push/PR. It is manual-dispatch only, and the
# real-PyPI path is gated behind a protected GitHub Environment so it
# cannot fire without an explicit human approval recorded in the repo.
#
#   - target=testpypi (default): build + twine check + upload to TestPyPI.
#     This is the rehearsal; safe to run freely.
#   - target=pypi: the irreversible real publish. Runs in the `pypi-release`
#     environment — configure that Environment with a required reviewer in
#     repo Settings so a second pair of eyes (or a deliberate founder click)
#     is mandatory.
#
# PREREQUISITE (one-time, founder-side, cannot be done from this repo):
# configure a PyPI/TestPyPI Trusted Publisher for EACH of the five
# packages — on (test.)pypi.org: the project → Settings → Publishing →
# add publisher: owner `URML-MARS`, repo `URML`, workflow `release.yml`,
# environment `pypi-release` (for pypi) / leave blank (for testpypi).
# Until that exists, use the manual `twine upload` path in RELEASING.md.
#
# Publish order matters (a package must be on the index before its
# dependents resolve). The matrix `max-parallel: 1` + the ordered list
# enforces validator → bridge/ros2 → conformance/px4.

name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build all five
        run: |
          set -eux
          for p in reference/validator reference/llm-bridge \
                   reference/ros2-runtime reference/px4-runtime conformance; do
            python -m build --outdir dist "$p"
          done
      - name: Static metadata check (must all PASS)
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Real PyPI runs in a protected environment; TestPyPI does not.
    environment: ${{ inputs.target == 'pypi' && 'pypi-release' || 'testpypi-release' }}
    permissions:
      id-token: write   # OIDC for Trusted Publishing — no tokens in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/
      # NOTE: this uploads ALL of dist/ in one shot. That is correct for
      # re-releases (every dependency is already on the index, so
      # upload order is irrelevant). For the FIRST publish of a package
      # to a fresh index, dependency order matters — use the manual,
      # explicitly-ordered `twine upload` sequence in RELEASING.md
      # instead. This workflow is the steady-state path, not the
      # first-release path.
      - name: Publish all five (bulk; see note + RELEASING.md for first release)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          verbose: true
