name: Notify website of content change

# Fires when files the website renders are updated on main. Sends a
# repository_dispatch event to URML-MARS/urml-website so it can rebuild.
#
# Requires a repo secret `WEBSITE_DISPATCH_TOKEN` containing a fine-scoped
# Personal Access Token with `contents: write` on URML-MARS/urml-website.
# Until that secret is provisioned (and urml-website has a workflow that
# listens for the `core-content-changed` event), the notify step logs a
# skip message and exits green. The secret check lives in the shell because
# the `secrets` context is not available in `if:` expressions; using it
# there makes the whole workflow file invalid.

on:
  push:
    branches: [main]
    paths:
      - "docs/compatible-runtimes.md"
      - "docs/registry/SUBMISSION.md"
      - "TRADEMARK.md"
      - "docs/manufacturers/README.md"
      - "docs/manufacturers/directory.md"
      - "docs/manufacturers/SUBMISSION.md"
      - "docs/manufacturers/FEDERAL-VALIDATION-SELF-REPORT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to urml-website
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set; skipping dispatch."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/URML-MARS/urml-website/dispatches \
            -d '{"event_type":"core-content-changed"}'
