[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-legged-runtime"
version = "0.2.0"
description = "Legged/quadruped reference runtime for URML — Boston Dynamics Spot, ANYbotics ANYmal."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "quadruped", "legged", "boston-dynamics", "spot", "anybotics", "anymal", "urml", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.2.0",
  "urml-ros2-runtime>=0.2.0",
]

[project.optional-dependencies]
# Boston Dynamics' SDK is a normal set of PyPI wheels (gRPC stubs), unlike
# rclpy. Spot is therefore NOT ROS-coupled — installing `urml-legged-
# runtime[spot]` gives everything SpotAdapter needs. ANYmal speaks ROS 2,
# so AnymalAdapter composes RclpyAdapter (rclpy ships with the ROS 2
# distribution, no extra). Module import works on every host: bosdyn and
# rclpy are both imported lazily, only when an adapter is constructed.
spot = [
  "bosdyn-client>=4.0",
  "bosdyn-api>=4.0",
  "bosdyn-mission>=4.0",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_legged_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["urml_legged_runtime"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
