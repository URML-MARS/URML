[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-ardupilot-runtime"
version = "0.1.0"
description = "ArduPilot / MAVLink reference runtime for URML — Universal Robot Language."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "drone", "ardupilot", "arducopter", "pixhawk", "mavlink", "urml", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.4.0",
  "urml-ros2-runtime>=0.4.0",
  "urml-px4-runtime>=0.4.0",
]

[project.optional-dependencies]
# pymavlink is the MAVLink transport; pyserial is what pymavlink needs to
# open a USB or telemetry-radio serial port (a Pixhawk on COM5 or
# /dev/ttyACM0). The px4 extra omits pyserial because PX4 SITL is UDP;
# a physical ArduPilot board is almost always serial first.
ardupilot = [
  "pymavlink>=2.4,<3",
  "pyserial>=3.5,<4",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_ardupilot_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["urml_ardupilot_runtime"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
