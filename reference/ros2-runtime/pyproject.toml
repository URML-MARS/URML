[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-ros2-runtime"
version = "0.1.0a0"
description = "ROS 2 reference runtime for URML — Universal Robot Language."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "ros2", "urml", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.1.0a1",
]

[project.optional-dependencies]
# Real ROS 2 backing is opt-in. `rclpy` ships with a ROS 2 distribution
# and is not installed from PyPI in normal ROS 2 setups; the `[ros2]` extra
# is reserved for ROS-2-ecosystem packages that *are* pip-installable
# (vision_msgs Python bindings, geometry helpers, etc.) plus dependency
# pins. For now the mock substrate covers all tests on every OS.
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_ros2_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["urml_ros2_runtime"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
