[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-ros2-runtime"
version = "0.2.0"
description = "ROS 2 reference runtime for URML — Universal Robot Language."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "ros2", "urml", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.2.0",
]

[project.optional-dependencies]
# Real ROS 2 backing for `RclpyAdapter`. `rclpy` itself is NOT listed here
# because the rclpy wheel ships with a ROS 2 distribution (via apt/colcon),
# not from PyPI. Installing `urml-ros2-runtime[ros2]` on a Linux host with
# ROS 2 sourced (`source /opt/ros/<distro>/setup.bash`) gives you a working
# adapter. This extra is reserved for *additional* ROS-2-ecosystem packages
# that are pip-installable (vision_msgs Python bindings, geometry helpers,
# etc.) plus dependency pins as they're needed.
ros2 = []
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
# Spin the URML ExecuteURML ROS 2 action server (requires a sourced ROS 2
# environment + the urml_ros2_msgs action package built via colcon). The
# pure core, execute_request(), is importable and testable without rclpy.
urml-ros2-action-server = "urml_ros2_runtime.action_server:main"

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_ros2_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["urml_ros2_runtime"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
