# Fixture: Agility Robotics Digit — RFC-0384 whole-body manifest.
# Biped (RFC-0009) + two arms (RFC-0010) + a whole_body block (RFC-0384):
# kinematic chains (2 legs, 2 arms bound to manipulation.arms, torso) and a
# static-stability declaration (center_of_mass within support_polygon).
# can_carry_while_moving is true, so a carry-while-walking program validates.
# US origin (Agility, Oregon), compliant under the bundled default policy.

manifest_version: "0.1"
robot_id: digit_wholebody_1
description: Bipedal logistics humanoid, whole-body declaration (RFC-0384).

frames:
  - name: site
    parent: null
  - name: body
    parent: site

declared_locations:
  - name: staging_a
    pose: { x: 6.0, y: 0.0, z: 0.0 }
    frame: site
  - name: tote_shelf
    pose: { x: 6.0, y: 4.0, z: 0.0 }
    frame: site
  - name: dock
    pose: { x: 0.0, y: 0.0, z: 0.0 }
    frame: site

declared_events:
  - estop_engaged
  - aisle_clear

mobility:
  drive_type: biped
  max_velocity: 1.5
  station_keeping: true

manipulation:
  arm_count: 2
  grippers:
    - name: left_hand
      kind: compliant
      force_min_n: 1.0
      force_max_n: 80.0
      accepted_classes:
        - tote
    - name: right_hand
      kind: compliant
      force_min_n: 1.0
      force_max_n: 80.0
      accepted_classes:
        - tote
  arms:
    - name: left
      gripper_ref: left_hand
    - name: right
      gripper_ref: right_hand

whole_body:
  chains:
    - name: left_leg
      kind: leg
      dof: 6
    - name: right_leg
      kind: leg
      dof: 6
    - name: left_arm
      kind: arm
      dof: 7
      arm_ref: left
    - name: right_arm
      kind: arm
      dof: 7
      arm_ref: right
    - name: torso
      kind: torso
      dof: 1
  static_stable: true
  can_carry_while_moving: true
  max_incline_deg: 15.0
  max_tilt_deg: 10.0
  center_of_mass: { x: 0.0, y: 0.0, z: 0.9 }
  support_polygon:
    - { x: -0.20, y: -0.15 }
    - { x: 0.20, y: -0.15 }
    - { x: 0.20, y: 0.15 }
    - { x: -0.20, y: 0.15 }

perception:
  cameras:
    - name: head_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  object_vocabulary:
    - tote

docking_stations: []

outputs:
  named_endpoints:
    - wms_log

provenance:
  manifest_attestation: self_declared
  components:
    - id: digit_compute
      role: critical
      vendor: agility
      country_of_origin: US
      country_of_final_assembly: US
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/digit_compute.cdx.json
        sha256: "7777777777777777777777777777777777777777777777777777777777777777"
