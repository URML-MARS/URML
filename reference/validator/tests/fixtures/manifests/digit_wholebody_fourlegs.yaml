    pose: { x: 6.0, y: 0.0, z: 0.0 }
    frame: site

mobility:
  drive_type: biped
  max_velocity: 1.5

whole_body:
  chains:
    - name: leg_1
      kind: leg
      dof: 6
    - name: leg_2
      kind: leg
      dof: 6
    - name: leg_3
      kind: leg
      dof: 6
    - name: leg_4
      kind: leg
      dof: 6

