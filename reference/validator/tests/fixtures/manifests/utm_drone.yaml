# RFC-0287 fixture: an aerial robot. Vertical separation is by ALTITUDE.
manifest_version: "0.1"
robot_id: utm_drone
description: Multirotor with a UTM-style operational clearance (RFC-0287).

frames:
  - name: agl

declared_locations:
  - { name: alt_low,  pose: { x: 0.0, y: 0.0, z: 0.0 },  frame: agl }
  - { name: alt_high, pose: { x: 0.0, y: 0.0, z: 30.0 }, frame: agl }   # +30 m altitude
  - { name: alt_same, pose: { x: 0.0, y: 0.0, z: 30.0 }, frame: agl }   # same altitude as alt_high

mobility:
  drive_type: multirotor
  max_velocity: 10.0
  service_ceiling: 120.0
  clearance: { radius_m: 0.5, vertical_m: 5.0 }   # ±5 m vertical band

substrate:
  autopilot_class: px4

connectivity:
  links:
    - role: peer_link
