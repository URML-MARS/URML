# Fixture: a collaborative-arm cell, US provenance.
# Substrate = urml-cobot-runtime (UrRtdeAdapter / FrankaFciAdapter),
# zero ROS — the proof that the most-deployed cobots need no ROS, the
# ROS-free sibling of the industrial-arm-runtime (ROS 2 + MoveIt 2)
# Ur/Franka adapters. Existing v0.1 manifest schema (no new field): the
# pose mapping is deployment config in cobot_adapter.yaml. A compliant
# US provenance block makes the bundled US-federal default policy
# (RFC-0004) ACCEPT it (the manufacturer / federal-procurement wedge).

manifest_version: "0.1"
robot_id: doosan_cobot_cell_1
description: Doosan M0609 cobot via DRFL.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
    description: Source bin for unsorted widgets.
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
    description: Destination tray for red widgets.
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell
    description: Idle pose between cycles.

declared_events:
  - safety_door_closed
  - line_ready
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.25
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: electric_2_finger
      kind: servo_electric
      force_min_n: 1.0
      force_max_n: 140.0
      accepted_classes: [widget, widget_red, widget_blue, small_part]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 150.0
      units: N
  object_vocabulary:
    - widget
    - widget_red
    - widget_blue
    - small_part

docking_stations:
  - name: tool_change_station
    pose: { x: 0.2, y: 0.5, z: 0.20 }
    frame: cell
    services: [swap_tool, park]

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: self_declared
  components:
    - id: cobot_arm_controller
      role: critical
      vendor: doosan_robotics
      country_of_origin: KR
      country_of_final_assembly: KR
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/cobot_arm_controller.cdx.json
        sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
