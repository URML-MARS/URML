# Fixture: industrial cell with an OnRobot MG10 magnetic gripper.
# Vendor: onrobot (DK, allied; not on denylist). Magnetic is the gripper.kind
# enum value introduced for this part-class. Default policy ACCEPTS.

manifest_version: "0.1"
robot_id: onrobot_magnetic_cell_1
description: Pick-and-place cell with an OnRobot MG10 magnetic gripper for ferrous parts.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell

declared_events:
  - safety_door_closed
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: onrobot_mg10
      kind: magnetic
      force_min_n: 5.0
      force_max_n: 220.0
      accepted_classes: [steel_plate, ferrous_part, widget_red]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 50.0
      units: N
  object_vocabulary:
    - steel_plate
    - ferrous_part
    - widget_red

docking_stations: []

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: self_declared
  components:
    - id: onrobot_mg10_gripper
      role: critical
      vendor: onrobot
      country_of_origin: DK
      country_of_final_assembly: DK
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/onrobot_mg10.cdx.json
        sha256: "c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3"
