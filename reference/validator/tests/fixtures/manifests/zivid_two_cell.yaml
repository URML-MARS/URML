# Fixture: industrial cell with a compliant camera_3d from `zivid` (NO).
# Track I-C — allied origin, not on us_federal_default denylist. Default
# policy ACCEPTS.

manifest_version: "0.1"
robot_id: zivid_two_cell_1
description: Single-arm pick-and-place cell with a fixed Zivid 3D camera, a wrist-mounted RGB camera, and an industrial gripper.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
    description: Source bin for unsorted widgets.
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
    description: Destination tray for red widgets.
  - name: kitting_tray_blue
    pose: { x: -0.4, y: -0.2, z: 0.10 }
    frame: cell
    description: Destination tray for blue widgets.
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell
    description: Idle pose between cycles.

declared_events:
  - safety_door_closed
  - line_ready
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50      # arm tip linear velocity cap, m/s
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: pneumatic_2_finger
      kind: pneumatic
      force_min_n: 1.0
      force_max_n: 25.0
      accepted_classes: [widget, widget_red, widget_blue, small_part]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: zivid_two_cell_3d
      movable: false
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "5mp"
      # RFC-0682: the primary product is a 3D color point cloud, not a 2D image.
      point_cloud:
        channels: [xyz, rgba, snr, normals]
        organized: true
      rate_hz_max: 10.0
      time_sync_methods: [ptp]
      datasheet_ref: "zivid://datasheets/zivid-2"     # per-model trueness/precision/working distance; never a scalar here
      mount:
        kind: eye_to_hand
        frame: base_link                              # optical frame expressed in the declared base_link
        calibration_ref: "cell://calibration/zivid-hand-eye-2026-05"
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 50.0
      units: N
  object_vocabulary:
    - widget
    - widget_red
    - widget_blue
    - small_part

docking_stations:
  - name: tool_change_station
    pose: { x: 0.2, y: 0.5, z: 0.20 }
    frame: cell
    services: [swap_tool, park]   # swap_tool: RFC-0013 end-of-arm tool change

provenance:
  manifest_attestation: self_declared
  components:
    - id: zivid_two_3d_camera
      role: critical
      vendor: zivid
      country_of_origin: "NO"
      country_of_final_assembly: "NO"
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/zivid_two_3d_camera.cdx.json
        sha256: "2222222222222222222222222222222222222222222222222222222222222222"

outputs:
  named_endpoints:
    - line_controller   # PLC endpoint that the cell reports cycle completion to
