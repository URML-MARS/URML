# Fixture: industrial cell with a Soft Robotics mGrip compliant end-effector.
# Vendor: soft_robotics (US, compliant origin; not on denylist). Compliant is
# the gripper.kind enum value introduced for this part-class. Default policy
# ACCEPTS (US/US, third-party-audited attestation, hbom_ref present).

manifest_version: "0.1"
robot_id: soft_robotics_compliant_cell_1
description: Pick-and-place cell with a Soft Robotics mGrip compliant gripper for produce.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell

declared_events:
  - safety_door_closed
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: soft_robotics_mgrip
      kind: compliant
      force_min_n: 0.5
      force_max_n: 30.0
      accepted_classes: [produce_item, soft_object, widget_red]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 30.0
      units: N
  object_vocabulary:
    - produce_item
    - soft_object
    - widget_red

docking_stations: []

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: self_declared
  components:
    - id: soft_robotics_mgrip_eoat
      role: critical
      vendor: soft_robotics
      country_of_origin: US
      country_of_final_assembly: US
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/soft_robotics_mgrip.cdx.json
        sha256: "d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4d4"
