# Fixture: industrial cell with a Piab piCOMPACT vacuum end-effector.
# Vendor: piab (SE, allied; not on denylist). Vacuum is the gripper.kind
# enum value introduced for this part-class. Accepted classes match the
# vacuum-natural objects (flat boxes/sheets). Default policy ACCEPTS.

manifest_version: "0.1"
robot_id: piab_vacuum_cell_1
description: Pick-and-place cell with a Piab piCOMPACT vacuum end-effector for cardboard cartons.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell

declared_events:
  - safety_door_closed
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: piab_picompact
      kind: vacuum
      force_min_n: 5.0
      force_max_n: 80.0
      accepted_classes: [cardboard_box, flat_sheet, widget_red]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: vacuum_pressure
      measurement_type: pressure
      range_min: 0.0
      range_max: 100.0
      units: kPa
  object_vocabulary:
    - cardboard_box
    - flat_sheet
    - widget_red

docking_stations: []

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: third_party_audited
  components:
    - id: piab_picompact_eoat
      role: critical
      vendor: piab
      country_of_origin: SE
      country_of_final_assembly: SE
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/piab_picompact.cdx.json
        sha256: "b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2"
