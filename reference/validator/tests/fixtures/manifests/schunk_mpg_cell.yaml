# Fixture: industrial cell with a SCHUNK MPG-plus pneumatic 2-finger gripper.
# Track C "more compliant parts" — declared-part pattern mirrors
# clearpath_husky.yaml (Clearpath/Robotiq/RealSense). Vendor: schunk (DE,
# allied; not on us_federal_default vendor or country denylist). The bundled
# default policy (RFC-0004) ACCEPTS this manifest.

manifest_version: "0.1"
robot_id: schunk_mpg_cell_1
description: Pick-and-place cell built around a SCHUNK MPG-plus pneumatic 2-finger gripper.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell

declared_events:
  - safety_door_closed
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: schunk_mpg_plus
      kind: pneumatic
      force_min_n: 5.0
      force_max_n: 140.0
      accepted_classes: [widget, widget_red, widget_blue, small_part]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 50.0
      units: N
  object_vocabulary:
    - widget
    - widget_red
    - widget_blue
    - small_part

docking_stations: []

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: self_declared
  components:
    - id: schunk_mpg_plus_gripper
      role: critical
      vendor: schunk
      country_of_origin: DE
      country_of_final_assembly: DE
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/schunk_mpg_plus.cdx.json
        sha256: "a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1"
