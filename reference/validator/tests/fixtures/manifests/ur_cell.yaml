# Fixture: Universal Robots cell (e-Series, UR5e / UR10e class).
# Vendor: universal_robots (DK; Teradyne-US parent). Allied; not on
# us_federal_default denylist. Default policy ACCEPTS.
#
# This is the brand-named manifest for the UNIQUE-ON-UR dual-adapter
# substrate-neutrality proof (RFC-0024):
#   - urml-industrial-arm-runtime UrAdapter   (ROS 2 + MoveIt 2 + ur_robot_driver)
#   - urml-cobot-runtime          UrRtdeAdapter (ZERO ROS via rtde_control + rtde_receive)
# Same URML program, same manifest, same conformance fixture, same audit trace.

manifest_version: "0.1"
robot_id: ur_cell_1
description: Universal Robots e-Series cobot cell (UR5e/UR10e class) — driven by either the ROS 2 ur_robot_driver path or the zero-ROS RTDE Python path (RFC-0024).

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell

declared_events:
  - safety_door_closed
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: robotiq_2f85
      kind: servo_electric
      force_min_n: 1.0
      force_max_n: 235.0
      accepted_classes: [widget, widget_red, widget_blue, small_part]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 50.0
      units: N
  object_vocabulary:
    - widget
    - widget_red
    - widget_blue
    - small_part

docking_stations: []

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: third_party_audited
  components:
    - id: ur_controller
      role: critical
      vendor: universal_robots
      country_of_origin: DK
      country_of_final_assembly: DK
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/ur_controller.cdx.json
        sha256: "2424242424242424242424242424242424242424242424242424242424242424"
