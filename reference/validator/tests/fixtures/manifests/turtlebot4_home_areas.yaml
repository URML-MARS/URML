# Fixture: the turtlebot4_home manifest plus two RFC-0615 declared areas.
# An area is a named region; `move_to: { location: <area> }` lets the runtime
# stop anywhere inside it, so the validator checks every vertex against the
# envelope's geofences. living_room lies inside the home_with_geofence fence;
# garden reaches x 9, outside it. Used by the envelope-coverage conformance
# fixtures.

manifest_version: "0.1"
robot_id: turtlebot4_demo_areas
description: TurtleBot 4 home robot that also knows two named areas.

frames:
  - name: map
    parent: null
  - name: base_link
    parent: map

declared_locations:
  - name: kitchen
    pose: { x: 3.2, y: 1.0 }
    frame: map
    description: Kitchen entry pose.
  - name: user
    pose: { x: 0.5, y: 0.5 }
    frame: map
    description: User pickup location.
  - name: charging_dock
    pose: { x: 0.0, y: 0.0 }
    frame: map

# RFC-0615: named regions the robot can be "in".
declared_areas:
  - name: living_room
    frame: map
    polygon:
      - { x: 0.0, y: -1.0 }
      - { x: 3.0, y: -1.0 }
      - { x: 3.0, y: 2.0 }
      - { x: 0.0, y: 2.0 }
  - name: garden
    frame: map
    polygon:
      - { x: 4.0, y: -2.0 }
      - { x: 9.0, y: -2.0 }
      - { x: 9.0, y: 3.0 }
      - { x: 4.0, y: 3.0 }

declared_events:
  - user_present
  - emergency_stop

mobility:
  drive_type: differential
  max_velocity: 0.46
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: claw_demo
      kind: servo_electric
      force_min_n: 0.5
      force_max_n: 5.0
      accepted_classes: [mug, cup, small_object]
      movable: true
  reachable_workspace_m: 0.35

perception:
  cameras:
    - name: oakd_rgb
      movable: false
      supports_photo: true
      supports_video: true
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: mic_array
      measurement_type: speech
      units: text
  object_vocabulary:
    - mug
    - cup
    - person

docking_stations:
  - name: charging_dock
    pose: { x: 0.0, y: 0.0 }
    frame: map
    services: [park, charge]

outputs:
  named_endpoints: [speech]
