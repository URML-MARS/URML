# Fixture: industrial cell with an ATI Axia80 six-axis force-torque sensor.
# Vendor: ati_industrial_automation (US, compliant origin; not on denylist).
# Exercises perception.sensors with measurement_type: pressure. Default
# policy ACCEPTS.

manifest_version: "0.1"
robot_id: ati_ft_cell_1
description: Pick-and-place cell with an ATI Axia80 wrist-mounted six-axis force-torque sensor.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell

declared_events:
  - safety_door_closed
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.25
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: pneumatic_2_finger
      kind: pneumatic
      force_min_n: 1.0
      force_max_n: 25.0
      accepted_classes: [widget, widget_red, small_part]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: ati_axia80_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 500.0
      units: N
  object_vocabulary:
    - widget
    - widget_red
    - small_part

docking_stations: []

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: third_party_audited
  components:
    - id: ati_axia80_ft_sensor
      role: critical
      vendor: ati_industrial_automation
      country_of_origin: US
      country_of_final_assembly: US
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/ati_axia80.cdx.json
        sha256: "e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5"
