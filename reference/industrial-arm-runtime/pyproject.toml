[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-industrial-arm-runtime"
version = "0.1.0"
description = "ROS-Industrial / MoveIt 2 reference runtime for URML — ABB, FANUC, KUKA, YASKAWA arms."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "industrial", "moveit", "ros-industrial", "abb", "fanuc", "kuka", "yaskawa", "urml", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.1.0",
  "urml-ros2-runtime>=0.1.0",
]

[project.optional-dependencies]
# rclpy is NOT a PyPI package — it ships with a ROS 2 distribution, same
# as urml-ros2-runtime. There is therefore no installable extra: a
# constructed adapter needs a sourced ROS 2 environment (ROS-Industrial
# driver + MoveIt 2) just like RclpyAdapter. Module import works on every
# host (rclpy is imported lazily, inside RclpyAdapter).
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_industrial_arm_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["urml_industrial_arm_runtime"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
