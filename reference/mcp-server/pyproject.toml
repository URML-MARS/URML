[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-mcp-server"
version = "0.3.0"
description = "Model Context Protocol server for URML: validate-before-actuate robot intent as agent tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "robot-intent", "mcp", "validation", "safety", "urml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  # Pin below 2.0: server.py uses the bundled FastMCP 1.x
  # (`mcp.server.fastmcp.FastMCP`), which mcp 2.0 removed.
  "mcp>=1.10,<2",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.3.0",
  "urml-llm-bridge>=0.3.0",
  "urml-ros2-runtime>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
urml-mcp = "urml_mcp.server:main"

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_mcp"]
