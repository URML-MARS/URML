[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-px4-runtime"
version = "0.1.1"
description = "PX4 / MAVLink reference runtime for URML — Universal Robot Language."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "drone", "px4", "mavlink", "urml", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.1.0",
  "urml-ros2-runtime>=0.1.0",
]

[project.optional-dependencies]
# pymavlink is a normal PyPI package (unlike rclpy, which ships with a ROS 2
# distribution). Installing `urml-px4-runtime[px4]` gives you everything needed
# to construct PX4Adapter against a real PX4 autopilot or PX4 SITL simulator.
px4 = [
  "pymavlink>=2.4,<3",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_px4_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["urml_px4_runtime"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
