[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urml-edu-runtime"
version = "0.2.0"
description = "Educational-platform reference runtime for URML — VEX V5, LEGO Mindstorms/SPIKE, Thymio, Robotical Marty, Petoi Bittle / Nybble, zero ROS."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "URML Maintainers" }]
keywords = ["robotics", "education", "vex", "lego", "mindstorms", "spike", "thymio", "marty", "robotical", "petoi", "bittle", "nybble", "opencat", "urml", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "urml-validator>=0.2.0",
  "urml-ros2-runtime>=0.2.0",
]

[project.optional-dependencies]
# Each educational platform has its own native host-side Python SDK:
# VEX V5 (the `vex` module / pyvex community wrappers), LEGO Pybricks
# (the `pybricksdev` BLE host-side client), and Thymio (the Aseba
# `tdmclient` Thymio Device Manager Python client). All zero-ROS, all
# imported lazily by their respective adapter so this module loads on
# every host without any extra. Serves RFC-0011 educational (the
# adoption flywheel for the classroom/maker community).
vex = [
  "pyvex>=0.5",
]
lego = [
  "pybricksdev>=1.0",
]
thymio = [
  "tdmclient>=0.1.4",
]
# Robotical Marty (Edinburgh, UK) via the host-side martypy SDK. v3.6.6
# is the last published release at time of writing per robotical/martypy
# (Apache-2.0). Maintainer engagement on robotical/martypy#52 (2026-05-25)
# confirmed v2 default transport is USB-serial, v1 is socket; BLE is not
# supported by martypy and is out of scope for this adapter.
marty = [
  "martypy>=3.6",
]
# Petoi Bittle X / Bittle / Nybble Q (Shenzhen, CN) via the OpenCat
# skill-library command surface. The canonical Python package was
# confirmed by the OpenCat maintainer Dr. Rongzhong Li on
# PetoiCamp/OpenCat-Quadruped-Robot#113 (2026-07-15): Petoi unified the
# Mind+ and desktop-app libraries into PetoiRobot
# (https://github.com/PetoiCamp/DesktopAppRelease/tree/main/pyUI/PetoiRobot,
# pip name 'petoi-robot'). Its command surface is functional
# (sendCmdStr / sendSkillStr) and its raw sensor reads are readAnalogValue /
# readDigitalValue / readUltrasonicDistance; the adapter is wrapper-agnostic,
# so a URML-side unified wrapper over those is also fine (maintainer-blessed).
petoi = [
  "petoi-robot",
]
# Adafruit CircuitPython (New York, US) via a host-side comms bridge. Per
# @dhalbert on adafruit/circuitpython#11035 (engaged 2026-05-28): the
# device-side helper library's home is the Adafruit CircuitPython
# Community Bundle (not core), and the integration is a host-side comms
# program over serial / REPL (not USB-MSC drag-drop, which is not
# universal). 'circuitpython_host' is a placeholder for that host-side
# wrapper, pending hardware validation; pyserial is the realistic serial
# transport. The adapter only requires *some* Python object exposing
# CircuitPython skill methods or a generic send_command(token, *args).
circuitpython = [
  "pyserial>=3.5",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/URML-MARS/URML"
Repository = "https://github.com/URML-MARS/URML"
Issues = "https://github.com/URML-MARS/URML/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/urml_edu_runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["urml_edu_runtime"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
