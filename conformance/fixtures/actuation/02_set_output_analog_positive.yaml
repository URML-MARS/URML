name: actuation/set_output_analog_positive
description: >
  RFC-0017 analog happy path: drive the analog spray-rate line to 60% — within
  the declared range [0, 100]. The value is range-checked at Pass 2 before
  anything actuates, then dispatched to a single set_output_line call.

manifest: cobot_cell_outputs
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - set_output: { output: spray_rate, value: 60.0 }

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 1
  audit_methods:
    - set_output_line
