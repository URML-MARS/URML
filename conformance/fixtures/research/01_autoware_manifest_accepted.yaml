name: research/autoware_manifest_accepted
description: >
  Track G manifest+spec-only — Autoware research-grade AV. The
  substrate exceeds the frozen v0.1 Protocol (autonomous-vehicle
  plan-then-follow is not move_to-to-a-named-pose), so this fixture
  follows the no-SDK-humanoid precedent (Optimus/Figure/Apollo/NEO/
  Ghost): validator acceptance only, NO expected_execution. RFC-0020
  (Draft) proposes the av profile + plan_path/follow_trajectory
  primitives + hd_map/odd/mrm manifest blocks; until those ratify,
  the manifest uses only the frozen v0.1 schema and the program is a
  single report (which the frozen Protocol fully expresses).

manifest: autoware_av_research
profiles: [research]

program:
  profile: research
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - report:
          to: research_log
          facts: { event: vehicle_ready, scope: autoware_av_research }
          status: success

expected_validation:
  accepted: true
