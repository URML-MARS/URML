# RFC-0291, AIR: two drones at the same (x,y) but 30 m apart in altitude. Their
# vertical bands (±5 m) are disjoint -> strategically deconflicted -> ACCEPT.
#
# RFC-0702 (Draft): the bundled FAA rulebook applies to drone programs by
# default and allows one aircraft airborne at a time per remote pilot in
# command (14 CFR 107.35). Both drones fly at once, so without a deployment
# rulebook the program is refused with rule.concurrency_exceeded. RFC-0702
# names two ways to keep this fixture accepted: declare two remote pilots in
# command, or set `default_rulebooks: false`. This fixture declares the
# pilots, plus the Remote ID method a deployment rulebook must declare.
name: fleet/08_air_vertical_separation_accepted
description: >
  Two drones vertically separated by altitude; no conflict. The deployment
  declares two remote pilots in command, so the FAA one-aircraft-per-pilot
  rule allows both in the air.
roster:
  - { name: a, manifest: utm_drone }
  - { name: b, manifest: utm_drone }
shared_frames: [agl]
policy: none
profiles: [drone]
rulebooks: [deployment_two_pilots]
program:
  profile: drone
  behavior:
    type: parallel
    branches:
      - { type: "on", member: a, body: { move_to: { location: alt_low } } }
      - { type: "on", member: b, body: { move_to: { location: alt_high } } }
expected_validation:
  accepted: true
