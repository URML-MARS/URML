# RFC-0288 — CROSS-FRAME: the SAME drone+rover, but the drone is at 30 m altitude.
# Resolved into world, their vertical bands are disjoint -> deconflicted -> ACCEPT.
name: fleet/17_cross_frame_drone_high_above_rover_accepted
description: A high drone over a rover; altitude separation holds in world.
world_frame: world
roster:
  - { name: drone, manifest: utm_drone, anchor: { frame: agl,  transform: {} } }
  - { name: rover, manifest: utm_ground, anchor: { frame: site, transform: {} } }
policy: none
profiles: [drone]
program:
  profile: drone
  behavior:
    type: parallel
    branches:
      - { type: "on", member: drone, body: { move_to: { location: alt_high } } }
      - { type: "on", member: rover, body: { move_to: { location: spot_a } } }
expected_validation:
  accepted: true
