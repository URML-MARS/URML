# RFC-0291 — AIR: two drones at the same (x,y) AND the same altitude -> conflict.
name: fleet/09_air_same_altitude_rejected
description: Two drones at the same point and altitude; vertical bands overlap.
roster:
  - { name: a, manifest: utm_drone }
  - { name: b, manifest: utm_drone }
shared_frames: [agl]
policy: none
profiles: [drone]
program:
  profile: drone
  behavior:
    type: parallel
    branches:
      - { type: "on", member: a, body: { move_to: { location: alt_high } } }
      - { type: "on", member: b, body: { move_to: { location: alt_same } } }
expected_validation:
  accepted: false
  error_codes: [fleet.concurrent_shared_workspace]
