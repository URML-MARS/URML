name: translation/open_llm_primary_accepted
description: >
  RFC-0304. A permissive open LLM (Qwen, Apache-2.0) as the primary translation
  engine: no commercial-use gate to satisfy, so a commercial deployment
  validates directly under the default policy.
manifest: translation_open_llm_primary
profiles: [home]
program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }
expected_validation:
  accepted: true
