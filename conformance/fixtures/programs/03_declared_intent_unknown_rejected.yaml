name: programs/declared_intent_unknown_rejected
description: >
  RFC-0616 negative: an opaque program declares intent to use `teleport`, which
  is not a URML primitive. Pass 2 rejects with
  capability.declared_intent_primitive_unknown. Proves the declaration is
  checked against the actual primitive vocabulary, so a typo or an invented
  capability is caught rather than silently trusted.

manifest: declared_intent_unknown
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - call_program:
          name: vendor_blob

expected_validation:
  accepted: false
  error_codes:
    - capability.declared_intent_primitive_unknown
