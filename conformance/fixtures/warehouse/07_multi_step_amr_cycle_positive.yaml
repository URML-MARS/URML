name: warehouse/multi_step_amr_cycle_positive
description: >
  A longer warehouse cycle: pick a tote from shelf A3, transport down the
  aisle, place on conveyor, then dock at the charge station and report.
  Exercises mobility, manipulation, perception, docking, reporting in a
  single composed sequence. All existing primitives.

manifest: warehouse_cell
envelope: warehouse_default
profiles: [warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - pick_from:
          source: shelf_a3
          object: tote
          force: gentle
          store_as: shelf_tote
      - move_to:
          location: aisle_3_waypoint
          carrying: $shelf_tote
      - place_at:
          target: conveyor_a
          held: $shelf_tote
          mode: place
      - dock:
          at: charge_dock_1
          service: park
      - report:
          to: fleet_manager
          facts: { cycle: shelf_to_conveyor_dock, result: ok }
          status: success

adapter_overrides:
  detection:
    success: true
    payload:
      class: tote
      pose: { x: 6.0, y: -2.0, z: 0.50 }
      frame: site
      attributes: {}
      confidence: 0.91

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 5
  audit_methods:
    - send_navigation_goal      # pick_from: navigate to shelf
    - query_detection
    - send_manipulation_goal    # pick_from: grasp
    - send_navigation_goal      # move_to aisle waypoint (carrying)
    - send_navigation_goal      # place_at: navigate to conveyor
    - send_manipulation_goal    # place_at: release
    - send_docking_goal
    - emit_report
  bindings_contains:
    shelf_tote:
      class: tote
