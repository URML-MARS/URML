name: warehouse/envelope_speed_violation_rejected
description: >
  Negative: a move_to declares speed = 2.0 m/s against an envelope whose
  max_velocity is 1.2 m/s (and manifest's mobility.max_velocity is 1.5 m/s).
  Pass 3 rejects with envelope.velocity_exceeded.
  Validator-only; no execution is expected.

manifest: warehouse_cell
envelope: warehouse_default
profiles: [warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to:
          location: shelf_a3
          speed: 2.0

expected_validation:
  accepted: false
  error_codes:
    - envelope.velocity_exceeded
