name: warehouse/pick_from_shelf_place_on_conveyor_positive
description: >
  Canonical warehouse cycle. Mobile manipulator picks a tote from a shelf
  in aisle A3, transports it down the aisle, places it on the outbound
  conveyor station, reports to fleet_manager. All existing primitives; the
  warehouse profile adds no new ones.

manifest: warehouse_cell
envelope: warehouse_default
profiles: [warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - pick_from:
          source: shelf_a3
          object: tote
          force: gentle
          store_as: pickup_tote
      - place_at:
          target: conveyor_a
          held: $pickup_tote
          mode: place
      - report:
          to: fleet_manager
          facts: { cycle: shelf_to_conveyor, result: ok }
          status: success

adapter_overrides:
  detection:
    success: true
    payload:
      class: tote
      pose: { x: 6.0, y: -2.0, z: 0.50 }
      frame: site
      attributes: {}
      confidence: 0.91

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 3
  audit_methods:
    - send_navigation_goal      # pick_from: navigate to shelf
    - query_detection           # pick_from: detect tote
    - send_manipulation_goal    # pick_from: grasp
    - send_navigation_goal      # place_at: navigate to conveyor (carrying)
    - send_manipulation_goal    # place_at: release
    - emit_report
  bindings_contains:
    pickup_tote:
      class: tote
