name: warehouse/dock_undeclared_station_rejected
description: >
  dock.at must name a declared docking station
  (spec/layer-2-primitives/v0.1.0.md §2.2). `charge_dock_9` is not declared,
  so the station could not be checked against the operational area. Pass 2
  rejects with capability.missing_docking_station.

manifest: warehouse_cell
envelope: warehouse_aisles_a
profiles: [warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - dock:
          at: charge_dock_9
          service: dock

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_docking_station
