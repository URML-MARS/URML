name: warehouse/dock_above_reach_cap_rejected
description: >
  The docking station must be within the operational area
  (spec/layer-2-primitives/v0.1.0.md §2.2), which the envelope's altitude cap
  bounds. In low-reach mode no target may sit above 0.35 m; the conveyor_a
  station is declared at 0.40 m. Pass 3 rejects with
  envelope.altitude_exceeded attributed to `dock`.

manifest: warehouse_cell
envelope: warehouse_low_reach
profiles: [warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - dock:
          at: conveyor_a
          service: dock

expected_validation:
  accepted: false
  error_codes:
    - envelope.altitude_exceeded
