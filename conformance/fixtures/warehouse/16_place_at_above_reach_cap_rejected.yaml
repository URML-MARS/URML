name: warehouse/place_at_above_reach_cap_rejected
description: >
  place_at inherits the move_to altitude check
  (spec/layer-2-primitives/v0.1.0.md §2.1 and §3.7). The pick at
  handoff_in_1 (0.30 m) is within the 0.35 m low-reach cap; the place on
  conveyor_a (0.40 m) is above it. Pass 3 rejects with
  envelope.altitude_exceeded attributed to `place_at`.

manifest: warehouse_cell
envelope: warehouse_low_reach
profiles: [warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - pick_from:
          source: handoff_in_1
          object: tote
          force: gentle
          store_as: tote_1
      - place_at:
          target: conveyor_a
          held: $tote_1
          mode: place

expected_validation:
  accepted: false
  error_codes:
    - envelope.altitude_exceeded
