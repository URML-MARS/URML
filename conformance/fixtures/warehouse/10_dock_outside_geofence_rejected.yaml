name: warehouse/dock_outside_geofence_rejected
description: >
  The docking station must be within the declared operational area
  (spec/layer-2-primitives/v0.1.0.md §2.2). This shift fences the AMR to
  aisles A1 to A3 (x -3..7, y -3..5); the charge_dock_1 station at (-4, 0)
  lies outside. Pass 3 rejects with envelope.geofence_violation attributed to
  `dock`.

manifest: warehouse_cell
envelope: warehouse_aisles_a
profiles: [warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - dock:
          at: charge_dock_1
          service: dock

expected_validation:
  accepted: false
  error_codes:
    - envelope.geofence_violation
