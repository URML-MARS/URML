name: mobile/clearpath_patrol_positive
description: >
  Navigation-only patrol on a Clearpath Husky manifest that declares
  compliant parts (Robotiq gripper, Intel RealSense camera, Clearpath
  base — none on the FCC Covered List). Proves the AMR path validates
  and executes, and that a richly-parted compliant manifest is
  accepted. Nav-only, so it runs hermetically against MockROSAdapter
  and adapter-agnostically against HuskyAdapter / JackalAdapter.

manifest: clearpath_husky
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: waypoint_a }
      - move_to: { location: waypoint_b }
      - move_to: { location: charge_point }

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 3
  audit_methods:
    - send_navigation_goal
    - send_navigation_goal
    - send_navigation_goal
