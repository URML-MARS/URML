name: compliance/hbom_vendor_of_vendor_rejected
description: >
  RFC-0005, motivation #2 (vendor-of-vendor). The HBOM's top-level part is a
  US integrator's board, but its CycloneDX pedigree names a CN-supplied
  ancestor die. The country deny-list walks the pedigree and catches the
  covered part at depth 1, even though the integrator owns the top-level part
  number (NDAA §889 chain).

manifest: provenance_hbom_vendor_of_vendor
policy: hbom_no_cn_components
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }

expected_validation:
  accepted: false
  error_codes: [policy.hbom_component_country_denied]
