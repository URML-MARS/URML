name: compliance/evidence_required_rejected
description: >
  RFC-0631. The same mixed-evidence manifest as 04, but under an opt-in evidence
  policy that requires every sensor claim be `derived` or `verified`. The
  smoke-verified lidar passes; the hand-declared bumper is below the bar and is
  refused with policy.evidence_insufficient. A deployment turning advisory
  evidence into a gate for safety-relevant claims, without any language change.

manifest: evidence_mixed
policy: require_evidence_derived
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }

expected_validation:
  accepted: false
  error_codes: [policy.evidence_insufficient]
