name: language/whisper_stt_positive
description: >
  RFC-0260. A home robot declaring a Whisper STT engine validates (the
  language block is well-formed; whisper is a permissive, non-gated engine).
manifest: language_whisper
profiles: [home]
program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }
expected_validation:
  accepted: true
