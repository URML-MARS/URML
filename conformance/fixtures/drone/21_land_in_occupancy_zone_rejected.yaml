name: drone/land_in_occupancy_zone_rejected
description: >
  Declared people-occupancy zones must not intersect the landing approach
  (spec/layer-2-primitives/v0.1.0.md §3.4). The spectator zone covers (-3,-3)
  to (3,3) in `agl`, and `home` (0, 0) lies inside it. The flight to
  roof_north is clear; the landing at home is not. Pass 3 rejects with
  envelope.occupancy_zone_intrusion attributed to `land`.

manifest: drone_civilian
envelope: drone_with_occupancy_zone
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off: { altitude: 30.0 }
      - move_to: { location: roof_north }
      - land: { at: home }

expected_validation:
  accepted: false
  error_codes:
    - envelope.occupancy_zone_intrusion
