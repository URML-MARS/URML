name: drone/autopilot_class_custom_no_note_rejected
description: >
  A drone manifest declaring substrate.autopilot_class: custom must also
  provide a non-empty autopilot_class_note. The escape-hatch enum value
  requires a free-text description so downstream tooling can audit which
  custom autopilot the deployment composes against. Per RFC-0250.

manifest: drone_autopilot_custom_no_note
envelope: drone_default
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off:
          altitude: 30.0
      - land: {}

expected_validation:
  accepted: false
  error_codes:
    - capability.autopilot_class_note_required
