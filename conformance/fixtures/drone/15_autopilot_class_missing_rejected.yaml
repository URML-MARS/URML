name: drone/autopilot_class_missing_rejected
description: >
  A drone-class manifest (drive_type: multirotor) without
  substrate.autopilot_class is rejected at validation time. Per RFC-0250:
  drone deployments must declare which autopilot stack composes the
  substrate (PX4 / ArduPilot / Pixhawk-class / custom).

manifest: drone_no_autopilot_class
envelope: drone_default
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off:
          altitude: 30.0
      - land: {}

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_autopilot_class
