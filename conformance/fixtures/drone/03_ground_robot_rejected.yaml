name: drone/ground_robot_rejected
description: >
  A drone primitive against a ground-robot manifest (differential drive)
  is rejected with capability.drive_type_not_aerial. Uses the home
  TurtleBot fixture as the non-drone manifest.

manifest: turtlebot4_home
envelope: home_default
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off:
          altitude: 10.0

expected_validation:
  accepted: false
  error_codes:
    - capability.drive_type_not_aerial
    - capability.missing_service_ceiling
