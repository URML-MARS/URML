name: drone/link_role_undeclared_rejected
description: >
  RFC-0006 Pass 2. The envelope declares a command-link-loss policy, but
  the manifest (drone_civilian) declares no `connectivity` block at all.
  The validator must reject with `capability.missing_link_role`: a robot
  that does not model connectivity cannot honor a link-loss policy.

manifest: drone_civilian
envelope: link_loss_rth
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - wait: { duration: 5s }

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_link_role
