name: drone/scan_altitude_exceeded_rejected
description: >
  For an aerial scan the altitude must be within the service ceiling and the
  active cap (spec/layer-2-primitives/v0.1.0.md §2.9). The program surveys at
  40 m under an envelope that caps altitude at 25 m. Pass 3 rejects with
  envelope.altitude_exceeded attributed to `scan`.

manifest: drone_civilian
envelope: drone_low_ceiling
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off: { altitude: 20.0 }
      - scan:
          area:
            bounding_box: { min_x: 0.0, max_x: 20.0, min_y: 0.0, max_y: 10.0 }
          altitude: 40.0
          sensor: downward
          store_as: survey
      - land: {}

expected_validation:
  accepted: false
  error_codes:
    - envelope.altitude_exceeded
