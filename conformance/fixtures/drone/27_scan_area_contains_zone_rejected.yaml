name: drone/scan_area_contains_zone_rejected
description: >
  No scan sample point may overlap a declared people-occupancy zone
  (spec/layer-2-primitives/v0.1.0.md §2.9). The scan area (-10,-10) to
  (10,10) holds the whole spectator zone (-3,-3) to (3,3), yet none of its
  four corners lies inside the zone, so a corner-only test passed it. The
  check is now an overlap test. Pass 3 rejects with
  envelope.occupancy_zone_intrusion attributed to `scan`.

manifest: drone_civilian
envelope: drone_with_occupancy_zone
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off: { altitude: 30.0 }
      - scan:
          area:
            bounding_box: { min_x: -10.0, max_x: 10.0, min_y: -10.0, max_y: 10.0 }
          altitude: 30.0
          sensor: downward
          store_as: survey
      - land: {}

expected_validation:
  accepted: false
  error_codes:
    - envelope.occupancy_zone_intrusion
