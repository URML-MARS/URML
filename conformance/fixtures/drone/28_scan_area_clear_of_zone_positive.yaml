name: drone/scan_area_clear_of_zone_positive
description: >
  Positive twin of scan_area_contains_zone_rejected. The scan area (5,5) to
  (20,10) shares no point with the spectator zone (-3,-3) to (3,3), so the
  overlap test passes it. Accepted and executed.

manifest: drone_civilian
envelope: drone_with_occupancy_zone
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - scan:
          area:
            bounding_box: { min_x: 5.0, max_x: 20.0, min_y: 5.0, max_y: 10.0 }
          altitude: 30.0
          sensor: downward
          store_as: survey

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 1
  audit_methods:
    - run_scan
