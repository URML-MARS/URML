name: drone/inspect_roof_positive
description: >
  Canonical drone-profile happy path: take_off, move to a declared roof
  inspection pose, capture a photo, return to home, land. Per the
  citizen-inspector scenario in MANIFESTO.md §Motivating Scenarios.

manifest: drone_civilian
envelope: drone_default
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off:
          altitude: 30.0
      - move_to:
          location: roof_north
      - capture:
          media: photo
          store_as: photo
      - return_to_home: {}
      - land: {}

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 5
  audit_methods:
    - send_takeoff_goal
    - send_navigation_goal
    - capture_media
    - send_return_to_home_goal
    - send_land_goal
