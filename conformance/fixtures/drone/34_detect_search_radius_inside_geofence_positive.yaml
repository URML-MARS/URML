name: drone/detect_search_radius_inside_geofence_positive
description: >
  Positive twin of detect_search_radius_outside_geofence_rejected. A 3 m
  search radius around roof_north (10, 5) stays inside the (-5,-5) to
  (15,15) geofence. Accepted and executed.

manifest: drone_civilian
envelope: drone_with_geofence
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off: { altitude: 30.0 }
      - detect:
          object: vehicle
          where: { near: roof_north, within: 3.0 }
          store_as: car
      - land: {}

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 3
  audit_methods:
    - send_takeoff_goal
    - query_detection
    - send_land_goal
