name: drone/link_loss_rth_positive
description: >
  RFC-0006 happy path. An aerial manifest declares a command_link and a
  `home` location; the envelope's command-link-loss action is
  `return_to_home`. Every connectivity check passes and the program is
  accepted. Validator-only (the runtime contract for honoring the policy
  on a real link drop is not executed in v0.1).

manifest: drone_civilian_connectivity
envelope: link_loss_rth
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - wait: { duration: 5s }

expected_validation:
  accepted: true
