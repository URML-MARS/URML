name: drone/hover_undeclared_location_rejected
description: >
  hover.over names either a binding ($target) or a place
  (spec/layer-2-primitives/v0.1.0.md §2.3). A place name must resolve against
  the manifest; `helipad_9` is not declared, so the hover location could not be
  checked against the operational area. Pass 2 rejects with
  capability.missing_location.

manifest: drone_civilian
envelope: drone_default
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off: { altitude: 30.0 }
      - hover: { over: helipad_9, duration: 5s }
      - land: {}

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_location
