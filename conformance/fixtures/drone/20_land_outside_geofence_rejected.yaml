name: drone/land_outside_geofence_rejected
description: >
  The landing location must be within the geofence
  (spec/layer-2-primitives/v0.1.0.md §3.4). The geofence covers (-5,-5) to
  (15,15) in `agl`; the program lands at `dropoff` (40, 20), outside it.
  Pass 3 rejects with envelope.geofence_violation attributed to `land`.

manifest: drone_civilian
envelope: drone_with_geofence
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off: { altitude: 30.0 }
      - land: { at: dropoff }

expected_validation:
  accepted: false
  error_codes:
    - envelope.geofence_violation
