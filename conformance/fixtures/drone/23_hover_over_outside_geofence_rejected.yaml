name: drone/hover_over_outside_geofence_rejected
description: >
  The hover location must be within the declared operational area
  (spec/layer-2-primitives/v0.1.0.md §2.3). The program hovers over `dropoff`
  (40, 20), outside the (-5,-5) to (15,15) geofence. Pass 3 rejects with
  envelope.geofence_violation attributed to `hover`.

manifest: drone_civilian
envelope: drone_with_geofence
profiles: [drone]

program:
  profile: drone
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - take_off: { altitude: 30.0 }
      - hover: { over: dropoff, duration: 10s }
      - land: {}

expected_validation:
  accepted: false
  error_codes:
    - envelope.geofence_violation
