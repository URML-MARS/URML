name: licensing/restrictiveness_cap_rejected
description: >
  RFC-0262. The manifest caps restrictiveness at lgpl_3_0 but declares a
  gpl_3_0 component; under the bundled default policy the component is refused
  for exceeding the declared cap.
manifest: licensing_cap_exceeded
profiles: [home]
program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }
expected_validation:
  accepted: false
  error_codes: [policy.license_too_restrictive]
