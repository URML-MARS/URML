name: industrial/opcua_cell_positive
description: >
  OPC UA Robotics cell, zero ROS (RFC-0014 substrate proof). The same
  RFC-0013 happy path as 04_pick_from_positive — wait for the safety
  door, `pick_from` a red widget, `place_at` the red tray, report —
  but on the `opcua_cell` manifest (US provenance, accepted under the
  bundled US-federal default policy: the manufacturer / federal
  procurement wedge). Validates + executes hermetically against
  MockROSAdapter and adapter-agnostically against the opcua runtime's
  OpcUaAdapter. No new substrate Protocol method is used; `pick_from`/
  `place_at` compose existing calls exactly as in the ROS path.

manifest: opcua_cell
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - wait_for:
          condition: { event: safety_door_closed }
      - pick_from:
          source: pick_bin
          object: widget_red
          attributes: { color: red }
          force: firm
          store_as: red_widget
      - place_at:
          target: kitting_tray_red
          held: $red_widget
          mode: place
      - report:
          to: line_controller
          facts: { cycle: pick_red_to_tray, result: ok }
          status: success

adapter_overrides:
  detection:
    success: true
    payload:
      class: widget_red
      pose: { x: 0.4, y: -0.3, z: 0.10 }
      frame: cell
      attributes: { color: red }
      confidence: 0.93

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 4
  audit_methods:
    - wait_for_condition
    - send_navigation_goal
    - query_detection
    - send_manipulation_goal
    - send_navigation_goal
    - send_manipulation_goal
    - emit_report
  bindings_contains:
    red_widget:
      class: widget_red
