name: industrial/pick_from_undeclared_source_rejected
description: >
  pick_from.source must resolve against the declared places
  (spec/layer-2-primitives/v0.1.0.md §3.6). `scrap_bin` is not declared in
  the cell, so no envelope check could run on it. Pass 2 rejects with
  capability.missing_location.

manifest: industrial_cell
envelope: industrial_cell_guarded
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - pick_from:
          source: scrap_bin
          object: widget
          force: gentle
          store_as: part

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_location
