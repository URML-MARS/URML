name: industrial/pick_from_force_within_envelope_positive
description: >
  Positive twin of pick_from_force_over_envelope_rejected. The same cell and
  hand-loading envelope; the program asks for 10 N, under the 15 N cap, and
  places on the red tray, which lies outside the operator's zone. Accepted and
  executed.

manifest: industrial_cell
envelope: industrial_cell_guarded
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - pick_from:
          source: pick_bin
          object: widget
          force: 10.0
          store_as: part
      - place_at:
          target: kitting_tray_red
          held: $part
          mode: place

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 2
  audit_methods:
    - send_navigation_goal      # pick_from: navigate to source
    - query_detection           # pick_from: detect
    - send_manipulation_goal    # pick_from: grasp
    - send_navigation_goal      # place_at: navigate to target (carrying)
    - send_manipulation_goal    # place_at: release
