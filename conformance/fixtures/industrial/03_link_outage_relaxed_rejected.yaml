name: industrial/link_outage_relaxed_rejected
description: >
  RFC-0006 Pass 3. The action (`halt_and_report`) is coherent, but the
  rule allows a 30 s command-link outage while the manifest declares the
  link tolerates only 5 s. An envelope may only tighten, never relax, a
  declared tolerance; the validator must reject with
  `envelope.link_outage_exceeds_declared`.

manifest: industrial_cell_connectivity
envelope: link_loss_outage_relaxed
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - wait: { duration: 5s }

expected_validation:
  accepted: false
  error_codes:
    - envelope.link_outage_exceeds_declared
