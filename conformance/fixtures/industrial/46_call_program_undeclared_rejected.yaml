name: industrial/call_program_undeclared_rejected
description: >
  RFC-0015 negative: `call_program` names `nonexistent_program`, which the
  manifest does not declare in its `programs:` block. Pass 2 (capability) must
  reject with `capability.missing_program` before any actuator moves — the
  manifest-declaration gate is the validate-before-actuate guarantee for an
  otherwise-opaque primitive. Validator-only; no execution is expected.

manifest: industrial_cell
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - call_program:
          name: nonexistent_program

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_program
