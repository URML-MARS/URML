name: industrial/pick_red_positive
description: >
  Pick-and-place cycle: detect a red widget in the pick bin, grasp it,
  move it to the red kitting tray, place it, return home, report to the
  line controller. Exercises the industrial manifest fixture and the
  `release(mode: place, at: ...)` constraint.
manifest: industrial_cell
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: pick_bin }
      - detect:
          object: widget_red
          where: { near: pick_bin }
          store_as: red_widget
      - grasp: { target: $red_widget, force: firm }
      - move_to: { location: kitting_tray_red, carrying: $red_widget }
      - release: { mode: place, at: kitting_tray_red }
      - move_to: { location: home_pose }
      - report:
          to: line_controller
          facts: { cycle: pick_red_to_tray, result: ok }
          status: success

adapter_overrides:
  detection:
    success: true
    payload:
      class: widget_red
      pose: { x: 0.4, y: -0.3, z: 0.10 }
      frame: cell
      attributes: {}
      confidence: 0.92

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 7
  audit_methods:
    - send_navigation_goal
    - query_detection
    - send_manipulation_goal
    - send_navigation_goal
    - send_manipulation_goal
    - send_navigation_goal
    - emit_report
  bindings_contains:
    red_widget:
      class: widget_red
