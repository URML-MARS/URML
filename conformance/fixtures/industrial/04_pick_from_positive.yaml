name: industrial/pick_from_positive
description: >
  RFC-0013 happy path: wait for the safety door, pick a red widget from
  the pick bin with `pick_from`, place it on the red kitting tray with
  `place_at`, report. Exercises the new industrial primitives end to end:
  `pick_from` composes navigate + detect + grasp and binds the picked
  object; `place_at` resolves that binding and composes navigate(carrying)
  + release. No new substrate Protocol method is used.

manifest: industrial_cell
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - wait_for:
          condition: { event: safety_door_closed }
      - pick_from:
          source: pick_bin
          object: widget_red
          attributes: { color: red }
          force: firm
          store_as: red_widget
      - place_at:
          target: kitting_tray_red
          held: $red_widget
          mode: place
      - report:
          to: line_controller
          facts: { cycle: pick_red_to_tray, result: ok }
          status: success

adapter_overrides:
  detection:
    success: true
    payload:
      class: widget_red
      pose: { x: 0.4, y: -0.3, z: 0.10 }
      frame: cell
      attributes: { color: red }
      confidence: 0.93

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 4
  audit_methods:
    - wait_for_condition
    - send_navigation_goal      # pick_from: navigate to source
    - query_detection           # pick_from: detect
    - send_manipulation_goal    # pick_from: grasp
    - send_navigation_goal      # place_at: navigate to target (carrying)
    - send_manipulation_goal    # place_at: release
    - emit_report
  bindings_contains:
    red_widget:
      class: widget_red
