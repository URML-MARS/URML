name: industrial/swap_tool_undeclared_service_rejected
description: >
  RFC-0013 negative: `swap_tool` targets `pick_bin`, which is a declared
  location but not a docking station (and therefore declares no
  `swap_tool` service). Pass 2 (capability) must reject with
  `capability.missing_docking_station` before any actuator moves.
  Validator-only; no execution is expected.

manifest: industrial_cell
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - swap_tool:
          at: pick_bin
          to: gripper_wide

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_docking_station
