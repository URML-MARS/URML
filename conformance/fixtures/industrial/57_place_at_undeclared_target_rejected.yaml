name: industrial/place_at_undeclared_target_rejected
description: >
  place_at.target must resolve against the declared places
  (spec/layer-2-primitives/v0.1.0.md §3.7). `scrap_bin` is not declared in
  the cell, so no envelope check could run on it. Pass 2 rejects with
  capability.missing_location.

manifest: industrial_cell
envelope: industrial_cell_guarded
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - pick_from:
          source: pick_bin
          object: widget
          force: gentle
          store_as: part
      - place_at:
          target: scrap_bin
          held: $part
          mode: place

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_location
