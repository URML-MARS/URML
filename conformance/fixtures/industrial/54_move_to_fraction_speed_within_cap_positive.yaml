name: industrial/move_to_fraction_speed_within_cap_positive
description: >
  Positive twin of move_to_fraction_speed_over_cap_rejected. 0.4 of the cell's
  0.5 m/s tip speed is 0.2 m/s, under the hand-loading envelope's 0.25 m/s cap.
  Accepted and executed.

manifest: industrial_cell
envelope: industrial_cell_guarded
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to:
          location: home_pose
          speed: { value: 0.4, units: fraction }

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 1
  audit_methods:
    - send_navigation_goal
