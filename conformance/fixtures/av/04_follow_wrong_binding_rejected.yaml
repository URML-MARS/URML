name: av/follow_wrong_binding_rejected
description: >
  RFC-0020 negative: follow_trajectory consuming a binding that is not a
  trajectory. Here it references a detect-bound object; the binding pass rejects
  it with binding.type_mismatch, proving follow_trajectory only accepts a
  plan_path-produced trajectory (the detect -> object -> grasp precedent).

manifest: autoware_av
profiles: [av]

program:
  profile: av
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - detect: { object: cone, store_as: c }
      - follow_trajectory: { trajectory: $c }

expected_validation:
  accepted: false
  error_codes:
    - binding.type_mismatch
