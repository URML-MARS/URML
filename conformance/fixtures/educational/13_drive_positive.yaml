name: educational/drive_positive
description: >
  RFC-0630 positive: a frameless educational buggy drives a signed distance and
  turns in place. `drive`/`turn` are the relative-motion primitives for
  dead-reckoning robots that have no map frame; they are gated to the educational
  profile and require `mobility.supports_relative_motion`. Both distances are
  within `max_relative_distance`.

manifest: educational_buggy
profiles: [educational]

program:
  profile: educational
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - drive: { distance: 0.3 }
      - turn: { angle: 90 }
      - drive: { distance: 0.3 }

expected_validation:
  accepted: true
