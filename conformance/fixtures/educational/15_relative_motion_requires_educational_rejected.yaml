name: educational/relative_motion_requires_educational_rejected
description: >
  RFC-0630 negative: `drive`/`turn` are gated to the educational profile. The same
  buggy program under the `home` profile is rejected with
  capability.relative_motion_requires_educational, so relative motion cannot leak
  into a profile that does not own it.

manifest: educational_buggy
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - turn: { angle: 45 }
      - drive: { distance: 0.2 }

expected_validation:
  accepted: false
  error_codes:
    - capability.relative_motion_requires_educational
