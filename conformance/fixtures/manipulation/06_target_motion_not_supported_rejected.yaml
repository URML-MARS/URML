name: manipulation/target_motion_not_supported_rejected
description: >
  RFC-0671 negative: a grasp requests target_motion `ballistic` on the leap_hand
  cell, whose dexterous hand declares no `interception` block at all. A hand that
  never declared it can intercept cannot be asked to catch, so Pass 2 rejects the
  program with capability.target_motion_not_supported before anything moves.

manifest: leap_hand_cell
profiles: [industrial]

program:
  profile: industrial
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - detect: { object: peg, store_as: the_peg }
      - grasp:
          target: $the_peg
          force: gentle
          grasp_type: precision
          target_motion: ballistic

expected_validation:
  accepted: false
  error_codes:
    - capability.target_motion_not_supported
