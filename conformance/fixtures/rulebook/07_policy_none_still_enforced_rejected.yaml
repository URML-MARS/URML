name: rulebook/policy_none_still_enforced_rejected
description: >
  policy: none switches off the compliance policy and never a rulebook. The
  Example Logistics rulebook (fictional) caps speed at 1.5 m/s, below the
  robot's own 2.0 m/s. A move_to at 2.0 m/s is refused with
  rule.cap_exceeded.

manifest: warehouse_areas
policy: none
profiles: [warehouse]
rulebooks: [example_warehouse]

program:
  profile: warehouse
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: dock_a, speed: 2.0 }

expected_validation:
  accepted: false
  error_codes:
    - rule.cap_exceeded
