name: home/link_loss_halt_positive
description: >
  RFC-0006 happy path for a home robot. A declared command_link with a
  coherent `halt_and_report` link-loss action (the manifest declares
  mobility, the v0.1 coherence bar for that action). The program is
  accepted. Validator-only.

manifest: turtlebot4_home_connectivity
envelope: link_loss_halt
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - wait: { duration: 5s }

expected_validation:
  accepted: true
