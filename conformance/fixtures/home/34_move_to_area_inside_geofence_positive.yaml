name: home/move_to_area_inside_geofence_positive
description: >
  Positive twin of move_to_area_outside_geofence_rejected. The living_room
  area (x 0..3, y -1..2) lies inside the apartment fence, so a move_to that
  names it is accepted and executed.

manifest: turtlebot4_home_areas
envelope: home_with_geofence
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: living_room }

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 1
  audit_methods:
    - send_navigation_goal
