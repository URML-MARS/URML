name: home/policy_country_denied
description: >
  A manifest with a critical component whose declared country_of_origin is
  in the bundled US-federal default policy's denylist. The validator's
  Pass 5 rejects the program with policy.country_denied. RFC-0004.

manifest: turtlebot4_home_cn_critical
envelope: home_default
# No `policy:` field — the runner loads the bundled US-federal default.
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }

expected_validation:
  accepted: false
  error_codes: [policy.country_denied]

# No `expected_execution`: validation rejects, so the runtime never runs.
