name: home/link_loss_hover_no_station_keeping_rejected
description: >
  RFC-0006 Pass 3. The envelope's command-link-loss action is `hover`,
  but the manifest is a differential ground robot with
  `station_keeping: false`. Hover is physically unsatisfiable; the
  validator must reject with `envelope.link_loss_incoherent`.

manifest: ground_connectivity_no_station_keeping
envelope: link_loss_hover
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - wait: { duration: 5s }

expected_validation:
  accepted: false
  error_codes:
    - envelope.link_loss_incoherent
