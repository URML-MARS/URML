name: home/substrate_ipc_custom_no_note_rejected
description: >
  RFC-0385 negative: a custom IPC sub-substrate with no generation_note. A custom generation must carry a free-text description; rejected at Pass 2.

manifest: substrate_ipc_custom_no_note
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: home }

expected_validation:
  accepted: false
  error_codes:
    - capability.ipc_generation_note_required
