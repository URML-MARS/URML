name: home/realtime_watchdog_short_rejected
description: >
  RFC-0016 negative: a realtime block whose watchdog (5 ms) is shorter than
  one control cycle (10 ms). The watchdog would fault before a single cycle
  completes, so the manifest is rejected at Pass 2 with
  capability.watchdog_shorter_than_cycle. This is internal-coherence checking,
  not real-time enforcement.

manifest: substrate_realtime_watchdog_short
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: home }

expected_validation:
  accepted: false
  error_codes:
    - capability.watchdog_shorter_than_cycle
