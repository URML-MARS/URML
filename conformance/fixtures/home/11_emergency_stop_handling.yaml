name: home/emergency_stop_handling
description: >
  A program that exercises `wait_for(condition.event: emergency_stop)` —
  the canonical safety-event wait the home profile names as required
  handling (spec/profiles/home/README.md §Mandatory invariants). In v0.1
  the validator accepts; future tightening rejects programs that omit
  emergency_stop handling entirely.

manifest: turtlebot4_home
envelope: home_default
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to:
          location: kitchen
      - wait_for:
          condition:
            event: emergency_stop
          timeout: 60s
          on_timeout: continue
      - move_to:
          location: user

expected_validation:
  accepted: true
