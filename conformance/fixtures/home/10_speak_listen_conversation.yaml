name: home/speak_listen_conversation
description: >
  Multi-step conversational program using the home-profile additions
  `speak` and `listen` (RFC-0002 §Profile-extensibility; specified in
  spec/profiles/home/README.md). Validator accepts AND MockROSAdapter
  executes all seven steps via its speech bindings.

manifest: turtlebot4_home
envelope: home_default
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - speak:
          utterance: "Which mug should I bring you?"
          style: conversational
      - listen:
          expected: choice
          choices: [red, blue, any]
          store_as: choice
      - detect:
          object: mug
          where:
            near: kitchen
          store_as: target_mug
      - grasp:
          target: $target_mug
          force: gentle
      - move_to:
          location: user
          carrying: $target_mug
      - release:
          mode: hand_to_user
      - speak:
          utterance: "Here you go."

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 7
  audit_methods:
    - emit_speech
    - acquire_speech
    - query_detection
    - send_manipulation_goal
    - send_navigation_goal
    - send_manipulation_goal
    - emit_speech
