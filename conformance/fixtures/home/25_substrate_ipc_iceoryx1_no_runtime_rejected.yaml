name: home/substrate_ipc_iceoryx1_no_runtime_rejected
description: >
  RFC-0385 negative: an iceoryx1 IPC sub-substrate that omits runtime_name. iceoryx1 is RouDi-daemon based and must name the broker to register against; rejected at Pass 2.

manifest: substrate_ipc_iceoryx1_no_runtime
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: home }

expected_validation:
  accepted: false
  error_codes:
    - capability.ipc_runtime_name_required
