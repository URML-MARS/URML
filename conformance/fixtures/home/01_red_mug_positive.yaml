name: home/red_mug_positive
description: >
  Canonical red-mug fetch from MANIFESTO.md. Every step succeeds; the
  validator accepts the program and the runtime executes all 5 steps.
manifest: turtlebot4_home
envelope: home_default
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }
      - detect:
          object: mug
          attributes: { color: red }
          store_as: target_mug
      - grasp: { target: $target_mug, force: gentle }
      - move_to: { location: user, carrying: $target_mug }
      - release: { mode: hand_to_user }

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 5
  audit_methods:
    - send_navigation_goal
    - query_detection
    - send_manipulation_goal
    - send_navigation_goal
    - send_manipulation_goal
  bindings_contains:
    target_mug:
      class: mug
