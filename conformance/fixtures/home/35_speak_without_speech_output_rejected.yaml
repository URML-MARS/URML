name: home/speak_without_speech_output_rejected
description: >
  Capability negative: `speak` needs a declared `speech` output endpoint. A cell
  that declares no speech output cannot be asked to talk, so Pass 2 rejects with
  capability.missing_speech_output before anything is emitted.

manifest: industrial_cell
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - speak: { utterance: "Hello." }

expected_validation:
  accepted: false
  error_codes:
    - capability.missing_speech_output
