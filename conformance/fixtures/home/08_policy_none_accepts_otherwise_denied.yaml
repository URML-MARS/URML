name: home/policy_none_accepts_otherwise_denied
description: >
  Same manifest as fixture 07 (critical component with denied
  country_of_origin), but the fixture sets `policy: none` to demonstrate
  the --no-policy escape hatch. With Pass 5 disabled, validation accepts.

manifest: turtlebot4_home_cn_critical
envelope: home_default
policy: none
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: kitchen }

expected_validation:
  accepted: true
