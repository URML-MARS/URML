name: quadruped/patrol_positive
description: >
  RFC-0009 end-to-end: a navigation-only patrol on a `quadruped`
  manifest (mobility.drive_type: quadruped). Proves the new enum value
  validates and executes. Exercises ONLY navigation — no perception,
  manipulation, speech, or docking-action — so it runs hermetically
  against MockROSAdapter and adapter-agnostically against the legged
  runtime's SpotAdapter / AnymalAdapter. `dock` is referenced as a
  declared *location* (it has a pose), not a docking action.

manifest: spot_quadruped
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: patrol_waypoint_a }
      - move_to: { location: patrol_waypoint_b }
      - move_to: { location: dock }

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 3
  audit_methods:
    - send_navigation_goal
    - send_navigation_goal
    - send_navigation_goal
