name: biped/apollo_manifest_accepted
description: >
  RFC-0009 follow-up, manifest + spec only. Apptronik Apollo has no
  public SDK; covered by validator acceptance, not execution. The
  biped manifest + a minimal program must be accepted (drive_type:
  biped, US origin compliant). No expected_execution by design.

manifest: apollo_biped
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: waypoint_a }

expected_validation:
  accepted: true
