name: biped/bimanual_force_over_envelope_rejected
description: >
  Each side of a bimanual step is checked like its single-arm grasp
  (spec/layer-2-primitives/v0.1.0.md §3.10). The program asks each hand for
  30 N. Each hand covers 1 to 80 N, but the fragile-goods envelope caps grip
  force at 10 N per hand. Pass 3 rejects with envelope.force_exceeded, once per
  side.

manifest: digit_bimanual
envelope: biped_gentle_grip
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - detect: { object: tote, store_as: the_tote }
      - bimanual:
          mode: together
          left: { target: $the_tote, force: 30.0 }
          right: { target: $the_tote, force: 30.0 }

expected_validation:
  accepted: false
  error_codes:
    - envelope.force_exceeded
