name: biped/wholebody_cannot_carry_rejected
description: >
  RFC-0384 negative: a move_to that carries a payload on a legged platform
  whose whole_body declares can_carry_while_moving false. The request is
  rejected at Pass 2 with capability.cannot_carry_while_moving. Proves the
  carry gate keys on the declared whole-body limit, not just on the presence
  of a payload.

manifest: digit_wholebody_no_carry
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - detect: { object: tote, store_as: the_tote }
      - move_to: { location: staging_a, carrying: $the_tote }

expected_validation:
  accepted: false
  error_codes:
    - capability.cannot_carry_while_moving
