name: biped/unitree_g1_unstable_retarget_rejected
description: >
  RFC-0384 whole-body, negative — "the filter". The same Unitree G1 humanoid, but
  the retarget places its declared center_of_mass outside the support_polygon. The
  static-stability declaration is inconsistent, so the program is rejected at Pass 2
  with capability.whole_body_unstable_com, before any actuator moves. This is what
  URML catches statically for a retargeted trajectory: an out-of-envelope,
  statically-unstable configuration. Software validation of a declaration, not a
  runtime controller model and not hardware proof.

manifest: unitree_g1_wholebody_unstable
profiles: [home]

program:
  profile: home
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - move_to: { location: staging }

expected_validation:
  accepted: false
  error_codes:
    - capability.whole_body_unstable_com
