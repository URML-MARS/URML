name: social/expression_within_envelope_positive
description: >
  Positive twin of the social envelope rejections. Under the same office
  envelope the robot glances to yaw 10 and nods `yes` (1.2 s, allowed).
  Accepted and executed.

manifest: reachy_mini
envelope: social_tight
profiles: [social]

program:
  profile: social
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - look_at:
          target: direction
          direction: { yaw: 10, pitch: 5 }
          duration: 1s
      - gesture:
          name: "yes"

expected_validation:
  accepted: true

expected_execution:
  success: true
  steps_executed: 2
  audit_methods:
    - orient_gaze
    - perform_gesture
