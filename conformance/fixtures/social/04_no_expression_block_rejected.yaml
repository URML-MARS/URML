name: social/no_expression_block_rejected
description: >
  RFC-0698 negative: a look_at on a robot whose manifest declares no `expression`
  block (a plain TurtleBot 4). Like `speak` on a robot with no speech endpoint,
  the primitive is rejected with capability.expression_not_declared: URML has
  nothing to check without the declaration.

manifest: turtlebot4_home
profiles: [social]

program:
  profile: social
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - look_at:
          target: face

expected_validation:
  accepted: false
  error_codes:
    - capability.expression_not_declared
