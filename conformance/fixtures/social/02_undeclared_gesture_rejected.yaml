name: social/undeclared_gesture_rejected
description: >
  RFC-0698 negative: the program asks for a `wave` gesture, which the Reachy
  Mini manifest does not declare in its expression.gestures vocabulary. The
  program is rejected at Pass 2 with capability.gesture_not_declared before
  anything moves. This is the refusal an LLM harness hears back and corrects on.

manifest: reachy_mini
profiles: [social]

program:
  profile: social
  behavior:
    type: sequence
    on_error: abort_and_report
    steps:
      - gesture:
          name: wave

expected_validation:
  accepted: false
  error_codes:
    - capability.gesture_not_declared
