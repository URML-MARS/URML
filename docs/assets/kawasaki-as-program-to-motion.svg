<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 979 445" width="979" height="445" role="img" aria-label="One English sentence becomes a validated URML program whose steps invoke named Kawasaki AS-language programs, executed on a hermetic mock (no robot).">
<style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;white-space:pre}.ln{opacity:0;animation-duration:15.0s;animation-timing-function:linear;animation-iteration-count:infinite}.caret{fill:#cc6b1f;animation:blink 1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes r0{0%,0.0%{opacity:0}0.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r1{0%,3.3320000000000003%{opacity:0}3.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r2{0%,6.6659999999999995%{opacity:0}6.667%,95.0%{opacity:1}100%{opacity:0}}@keyframes r3{0%,9.999%{opacity:0}10.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r4{0%,13.332%{opacity:0}13.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r5{0%,16.666%{opacity:0}16.667%,95.0%{opacity:1}100%{opacity:0}}@keyframes r6{0%,19.999%{opacity:0}20.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r7{0%,23.331999999999997%{opacity:0}23.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r8{0%,26.666%{opacity:0}26.667%,95.0%{opacity:1}100%{opacity:0}}@keyframes r9{0%,29.999%{opacity:0}30.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r10{0%,33.332%{opacity:0}33.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r11{0%,36.666000000000004%{opacity:0}36.667%,95.0%{opacity:1}100%{opacity:0}}@keyframes r12{0%,39.999%{opacity:0}40.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r13{0%,43.332%{opacity:0}43.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r14{0%,46.666000000000004%{opacity:0}46.667%,95.0%{opacity:1}100%{opacity:0}}@keyframes r15{0%,49.999%{opacity:0}50.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r16{0%,53.332%{opacity:0}53.333%,95.0%{opacity:1}100%{opacity:0}}</style>
<rect width="979" height="445" rx="10" fill="#181715"/>
<rect width="979" height="34" rx="10" fill="#26241f"/>
<rect y="24" width="979" height="10" fill="#26241f"/>
<circle cx="20" cy="17" r="6" fill="#e06c5a"/><circle cx="40" cy="17" r="6" fill="#e0b04a"/><circle cx="60" cy="17" r="6" fill="#7fae5f"/>
<text x="84" y="22" style="fill:#8a857a;font-size:12px">urml · sentence to AS-program · call_program · hermetic · no robot</text>
<text x="22" y="58" class="ln" style="fill:#cc6b1f;animation-name:r0">$ urml translate "After the safety door closes, run the cell's \</text><text x="22" y="79" class="ln" style="fill:#cc6b1f;animation-name:r1">      pick-and-place job, then home all axes." \</text><text x="22" y="100" class="ln" style="fill:#cc6b1f;animation-name:r2">      --provider echo --echo-response-file kawasaki-as-program.echo-response.json</text><text x="22" y="121" class="ln" style="fill:#7fae5f;animation-name:r3">Translation accepted after 0 revision(s); profile(s)=industrial</text><text x="22" y="163" class="ln" style="fill:#cc6b1f;animation-name:r5">$ urml validate kawasaki.generated.yaml --profile industrial --no-policy</text><text x="22" y="184" class="ln" style="fill:#7fae5f;animation-name:r6">Validation passed</text><text x="22" y="226" class="ln" style="fill:#cc6b1f;animation-name:r8">$ urml execute kawasaki.generated.yaml --profile industrial --no-policy</text><text x="22" y="247" class="ln" style="fill:#8a857a;animation-name:r9">URML execute: kawasaki.generated.yaml</text><text x="22" y="268" class="ln" style="fill:#e8e4da;animation-name:r10">  adapter:   mock</text><text x="22" y="289" class="ln" style="fill:#e8e4da;animation-name:r11">  trace (4 step(s) executed, 4 adapter call(s)):</text><text x="22" y="310" class="ln" style="fill:#e8e4da;animation-name:r12">   1. wait_for_condition  kind=event name=safety_door_closed</text><text x="22" y="331" class="ln" style="fill:#e8e4da;animation-name:r13">   2. call_named_program  name=pick_place_cycle</text><text x="22" y="352" class="ln" style="fill:#e8e4da;animation-name:r14">   3. call_named_program  name=home_all</text><text x="22" y="373" class="ln" style="fill:#e8e4da;animation-name:r15">   4. emit_report  to=line_controller facts={'cycle': 'run_commissioned_job', 'result': 'ok'} status=success severity=info</text><text x="22" y="394" class="ln" style="fill:#7fae5f;animation-name:r16">  RESULT: SUCCESS (4 step(s) executed)</text>
<rect class="caret" x="22" y="380" width="7" height="15"/>
<text x="22" y="433" style="fill:#8a857a;font-size:12px">hermetic mock — `call_program` invokes commissioned Kawasaki AS programs by name. no actuator moved.</text>
</svg>
