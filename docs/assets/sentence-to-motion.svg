<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 592" width="1085" height="592" role="img" aria-label="One English sentence is translated to a validated URML program and rehearsed in simulation: the gate first blocks an envelope violation, then a declared motion profile passes and the program executes on a hermetic mock (no robot).">
<style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;white-space:pre}.ln{opacity:0;animation-duration:20.0s;animation-timing-function:linear;animation-iteration-count:infinite}.caret{fill:#cc6b1f;animation:blink 1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes r0{0%,0.0%{opacity:0}0.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r1{0%,2.499%{opacity:0}2.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r2{0%,4.999%{opacity:0}5.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r3{0%,7.499%{opacity:0}7.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r4{0%,9.999%{opacity:0}10.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r5{0%,12.499%{opacity:0}12.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r6{0%,14.999%{opacity:0}15.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r7{0%,17.499%{opacity:0}17.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r8{0%,19.999%{opacity:0}20.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r9{0%,22.499%{opacity:0}22.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r10{0%,24.999%{opacity:0}25.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r11{0%,27.499%{opacity:0}27.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r12{0%,29.999%{opacity:0}30.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r13{0%,32.499%{opacity:0}32.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r14{0%,34.999%{opacity:0}35.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r15{0%,37.499%{opacity:0}37.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r16{0%,39.999%{opacity:0}40.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r17{0%,42.499%{opacity:0}42.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r18{0%,44.999%{opacity:0}45.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r19{0%,47.499%{opacity:0}47.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r20{0%,49.999%{opacity:0}50.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r21{0%,52.499%{opacity:0}52.5%,95.0%{opacity:1}100%{opacity:0}}@keyframes r22{0%,54.999%{opacity:0}55.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r23{0%,57.499%{opacity:0}57.5%,95.0%{opacity:1}100%{opacity:0}}</style>
<rect width="1085" height="592" rx="10" fill="#181715"/>
<rect width="1085" height="34" rx="10" fill="#26241f"/>
<rect y="24" width="1085" height="10" fill="#26241f"/>
<circle cx="20" cy="17" r="6" fill="#e06c5a"/><circle cx="40" cy="17" r="6" fill="#e0b04a"/><circle cx="60" cy="17" r="6" fill="#7fae5f"/>
<text x="84" y="22" style="fill:#8a857a;font-size:12px">urml · rehearse, then motion · hermetic · no API key · no robot</text>
<text x="22" y="58" class="ln" style="fill:#cc6b1f;animation-name:r0">$ urml run "Bring me the red mug from the kitchen." --rehearse kinematic \</text><text x="22" y="79" class="ln" style="fill:#cc6b1f;animation-name:r1">      --manifest red-mug.manifest.yaml --envelope red-mug.envelope.yaml</text><text x="22" y="100" class="ln" style="fill:#7fae5f;animation-name:r2">Translation accepted after 0 revision(s).</text><text x="22" y="121" class="ln" style="fill:#e8e4da;animation-name:r3">URML rehearsal: backend=kinematic</text><text x="22" y="142" class="ln" style="fill:#8a857a;animation-name:r4">  model: SYNTHETIC KINEMATIC PROFILE. No physics: the trace renders declared</text><text x="22" y="163" class="ln" style="fill:#8a857a;animation-name:r5">  assumptions (cruise speed, climb rate), not simulated dynamics.</text><text x="22" y="184" class="ln" style="fill:#e8e4da;animation-name:r6">  5 step(s) simulated, 16 sample(s) recorded, 2 properties checked</text><text x="22" y="205" class="ln" style="fill:#e06c5a;animation-name:r7">  CRITICAL: envelope.max_velocity violated at t=0.5s (always (speed &lt;= 0.4))</text><text x="22" y="226" class="ln" style="fill:#e06c5a;animation-name:r8">  gate: FAILED. Execution blocked; the real robot receives nothing (RFC-0668).</text><text x="22" y="268" class="ln" style="fill:#8a857a;animation-name:r10"># declare the deployment's real cruise speed (0.35 m/s), rehearse again</text><text x="22" y="289" class="ln" style="fill:#cc6b1f;animation-name:r11">$ urml run "Bring me the red mug from the kitchen." --rehearse kinematic \</text><text x="22" y="310" class="ln" style="fill:#cc6b1f;animation-name:r12">      --rehearse-config red-mug.rehearse.yaml</text><text x="22" y="331" class="ln" style="fill:#7fae5f;animation-name:r13">  gate: PASSED</text><text x="22" y="352" class="ln" style="fill:#8a857a;animation-name:r14">URML execute: &lt;run: 'Bring me the red mug from the kitchen.'&gt;</text><text x="22" y="373" class="ln" style="fill:#e8e4da;animation-name:r15">  adapter:   mock</text><text x="22" y="394" class="ln" style="fill:#e8e4da;animation-name:r16">  re-validation: passed (executed only after the validator accepted it)</text><text x="22" y="415" class="ln" style="fill:#e8e4da;animation-name:r17">  trace (5 step(s) executed, 5 adapter call(s)):</text><text x="22" y="436" class="ln" style="fill:#e8e4da;animation-name:r18">   1. send_navigation_goal  location=kitchen</text><text x="22" y="457" class="ln" style="fill:#e8e4da;animation-name:r19">   2. query_detection  object_class=mug attributes={'color': 'red'}</text><text x="22" y="478" class="ln" style="fill:#e8e4da;animation-name:r20">   3. send_manipulation_goal  action=grasp target={'class': 'mug', 'pose': {'x': 1.0, 'y': 1.0, 'z': 0.0}, ... force_n=1.5 approach=auto</text><text x="22" y="499" class="ln" style="fill:#e8e4da;animation-name:r21">   4. send_navigation_goal  location=user carrying={'class': 'mug', 'pose': {'x': 1.0, 'y': 1.0, 'z': 0.0}, ...</text><text x="22" y="520" class="ln" style="fill:#e8e4da;animation-name:r22">   5. send_manipulation_goal  action=release approach=auto release_mode=hand_to_user</text><text x="22" y="541" class="ln" style="fill:#7fae5f;animation-name:r23">  RESULT: SUCCESS (5 step(s) executed)</text>
<rect class="caret" x="22" y="527" width="7" height="15"/>
<text x="22" y="580" style="fill:#8a857a;font-size:12px">hermetic: synthetic kinematic rehearsal + mock executor. the gate blocks the bad assumption; the declared profile passes. no actuator moved.</text>
</svg>
