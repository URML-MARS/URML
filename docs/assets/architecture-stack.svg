<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 456" width="1085" height="456" role="img" aria-label="URML architecture: five-layer stack. Layer 4 natural language interface, Layer 3 behavior composition, Layer 2 intent primitives, Layer 1 hardware abstraction, Layer 0 substrate (not part of URML). A validator runs five passes across layers 4 through 1 before any actuator moves. Domain profiles extend layers 3 and 2.">
<style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre}.titletext{font-size:12px}.lid{font-size:15px;font-weight:600}.ltitle{font-size:15px;font-weight:600}.lbody{font-size:12px}.rlabel{font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:middle;letter-spacing:1px}.ptitle{font-size:11px;font-weight:600;letter-spacing:1px}.pname{font-size:13px}.caption{font-size:12px}.rail{animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:0.55}50%{opacity:1}}</style>
<rect width="1085" height="456" rx="10" fill="#181715"/>
<rect width="1085" height="34" rx="10" fill="#26241f"/>
<rect y="24" width="1085" height="10" fill="#26241f"/>
<text x="22" y="22" class="titletext" style="fill:#8a857a">urml · architecture · spec covers L4..L1 · L0 substrate is not part of URML</text>
<rect class="rail" x="22" y="52" width="38" height="288" rx="6" fill="#181715" stroke="#cc6b1f" stroke-width="1"/><text class="rlabel" x="41" y="196" transform="rotate(-90 41 196)" style="fill:#cc6b1f">VALIDATOR · 5 PASSES</text><line x1="60" y1="84" x2="72" y2="84" stroke="#cc6b1f" stroke-width="1"/><line x1="60" y1="156" x2="72" y2="156" stroke="#cc6b1f" stroke-width="1"/><line x1="60" y1="228" x2="72" y2="228" stroke="#cc6b1f" stroke-width="1"/><line x1="60" y1="300" x2="72" y2="300" stroke="#cc6b1f" stroke-width="1"/>
<rect x="72" y="52" width="781" height="64" rx="6" fill="#181715" stroke="#8a857a" stroke-width="1"/><text x="88" y="80" class="lid" style="fill:#cc6b1f">L4</text><text x="148" y="80" class="ltitle" style="fill:#e8e4da">Natural Language Interface</text><text x="148" y="102" class="lbody" style="fill:#8a857a">Documented prompt contract, grammar, examples for LLMs</text><rect x="72" y="124" width="781" height="64" rx="6" fill="#181715" stroke="#8a857a" stroke-width="1"/><text x="88" y="152" class="lid" style="fill:#cc6b1f">L3</text><text x="148" y="152" class="ltitle" style="fill:#e8e4da">Behavior Composition</text><text x="148" y="174" class="lbody" style="fill:#8a857a">Sequence, branch, parallel, retry, error handling</text><rect x="72" y="196" width="781" height="64" rx="6" fill="#181715" stroke="#8a857a" stroke-width="1"/><text x="88" y="224" class="lid" style="fill:#cc6b1f">L2</text><text x="148" y="224" class="ltitle" style="fill:#e8e4da">Intent Primitives</text><text x="148" y="246" class="lbody" style="fill:#8a857a">move_to, grasp, hover, scan, detect, dock, ...</text><rect x="72" y="268" width="781" height="64" rx="6" fill="#181715" stroke="#8a857a" stroke-width="1"/><text x="88" y="296" class="lid" style="fill:#cc6b1f">L1</text><text x="148" y="296" class="ltitle" style="fill:#e8e4da">Hardware Abstraction</text><text x="148" y="318" class="lbody" style="fill:#8a857a">Capabilities, joints, frames, sensors, limits</text><rect x="72" y="340" width="781" height="64" rx="6" fill="#181715" stroke="#8a857a" stroke-width="1" stroke-dasharray="4 4"/><text x="88" y="368" class="lid" style="fill:#8a857a">L0</text><text x="148" y="368" class="ltitle" style="fill:#8a857a">Substrate (existing OSes, not part of URML)</text><text x="148" y="390" class="lbody" style="fill:#8a857a">ROS 2 · PX4 / MAVLink · OPC UA · Autoware · ...</text>
<rect x="867" y="148" width="196" height="96" rx="10" fill="#181715" stroke="#cc6b1f" stroke-width="1"/><text x="881" y="172" class="ptitle" style="fill:#cc6b1f">PROFILES</text><text x="881" y="196" class="pname" style="fill:#e8e4da">home</text><text x="881" y="216" class="pname" style="fill:#e8e4da">drone</text><text x="881" y="236" class="pname" style="fill:#e8e4da">industrial</text><text x="881" y="256" class="pname" style="fill:#e8e4da">...</text><line x1="853" y1="156" x2="867" y2="156" stroke="#cc6b1f" stroke-width="1"/><line x1="853" y1="228" x2="867" y2="228" stroke="#cc6b1f" stroke-width="1"/>
<text x="22" y="440" class="caption" style="fill:#8a857a">every program checked against capability manifest and safety envelope before any actuator moves</text>
</svg>
