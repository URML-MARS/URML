<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 652 571" width="652" height="571" role="img" aria-label="One English sentence becomes a validated URML program becomes an executed trace on a Petoi Bittle X via OpenCat, hermetic mock (no robot).">
<style>text{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;white-space:pre}.ln{opacity:0;animation-duration:18.0s;animation-timing-function:linear;animation-iteration-count:infinite}.caret{fill:#cc6b1f;animation:blink 1s steps(1) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes r0{0%,0.0%{opacity:0}0.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r1{0%,2.777%{opacity:0}2.778%,95.0%{opacity:1}100%{opacity:0}}@keyframes r2{0%,5.555%{opacity:0}5.556%,95.0%{opacity:1}100%{opacity:0}}@keyframes r3{0%,8.332%{opacity:0}8.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r4{0%,11.110000000000001%{opacity:0}11.111%,95.0%{opacity:1}100%{opacity:0}}@keyframes r5{0%,13.888%{opacity:0}13.889%,95.0%{opacity:1}100%{opacity:0}}@keyframes r6{0%,16.666%{opacity:0}16.667%,95.0%{opacity:1}100%{opacity:0}}@keyframes r7{0%,19.442999999999998%{opacity:0}19.444%,95.0%{opacity:1}100%{opacity:0}}@keyframes r8{0%,22.221%{opacity:0}22.222%,95.0%{opacity:1}100%{opacity:0}}@keyframes r9{0%,24.999%{opacity:0}25.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r10{0%,27.776999999999997%{opacity:0}27.778%,95.0%{opacity:1}100%{opacity:0}}@keyframes r11{0%,30.555%{opacity:0}30.556%,95.0%{opacity:1}100%{opacity:0}}@keyframes r12{0%,33.332%{opacity:0}33.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r13{0%,36.11%{opacity:0}36.111%,95.0%{opacity:1}100%{opacity:0}}@keyframes r14{0%,38.888000000000005%{opacity:0}38.889%,95.0%{opacity:1}100%{opacity:0}}@keyframes r15{0%,41.666000000000004%{opacity:0}41.667%,95.0%{opacity:1}100%{opacity:0}}@keyframes r16{0%,44.443000000000005%{opacity:0}44.444%,95.0%{opacity:1}100%{opacity:0}}@keyframes r17{0%,47.221000000000004%{opacity:0}47.222%,95.0%{opacity:1}100%{opacity:0}}@keyframes r18{0%,49.999%{opacity:0}50.0%,95.0%{opacity:1}100%{opacity:0}}@keyframes r19{0%,52.777%{opacity:0}52.778%,95.0%{opacity:1}100%{opacity:0}}@keyframes r20{0%,55.555%{opacity:0}55.556%,95.0%{opacity:1}100%{opacity:0}}@keyframes r21{0%,58.332%{opacity:0}58.333%,95.0%{opacity:1}100%{opacity:0}}@keyframes r22{0%,61.11%{opacity:0}61.111%,95.0%{opacity:1}100%{opacity:0}}</style>
<rect width="652" height="571" rx="10" fill="#181715"/>
<rect width="652" height="34" rx="10" fill="#26241f"/>
<rect y="24" width="652" height="10" fill="#26241f"/>
<circle cx="20" cy="17" r="6" fill="#e06c5a"/><circle cx="40" cy="17" r="6" fill="#e0b04a"/><circle cx="60" cy="17" r="6" fill="#7fae5f"/>
<text x="84" y="22" style="fill:#8a857a;font-size:12px">urml · bittle x · sentence to motion · hermetic · no robot</text>
<text x="22" y="58" class="ln" style="fill:#cc6b1f;animation-name:r0">$ urml translate "Walk forward to the waypoint, then sit on the rest mat." \</text><text x="22" y="79" class="ln" style="fill:#cc6b1f;animation-name:r1">      --provider echo --echo-response-file bittle-sentence.echo-response.json \</text><text x="22" y="100" class="ln" style="fill:#cc6b1f;animation-name:r2">      -m bittle-sentence.manifest.yaml --profile educational --no-policy</text><text x="22" y="121" class="ln" style="fill:#7fae5f;animation-name:r3">Translation accepted after 0 revision(s); profile(s)=educational</text><text x="22" y="163" class="ln" style="fill:#cc6b1f;animation-name:r5">$ urml validate bittle.generated.yaml \</text><text x="22" y="184" class="ln" style="fill:#cc6b1f;animation-name:r6">      -m bittle-sentence.manifest.yaml --profile educational --no-policy</text><text x="22" y="205" class="ln" style="fill:#7fae5f;animation-name:r7">Validation passed</text><text x="22" y="247" class="ln" style="fill:#cc6b1f;animation-name:r9">$ urml execute bittle.generated.yaml --adapter mock \</text><text x="22" y="268" class="ln" style="fill:#cc6b1f;animation-name:r10">      -m bittle-sentence.manifest.yaml --profile educational --no-policy</text><text x="22" y="289" class="ln" style="fill:#8a857a;animation-name:r11">URML execute: bittle.generated.yaml</text><text x="22" y="310" class="ln" style="fill:#e8e4da;animation-name:r12">  adapter:   mock</text><text x="22" y="331" class="ln" style="fill:#e8e4da;animation-name:r13">  trace (3 step(s) executed, 3 adapter call(s)):</text><text x="22" y="352" class="ln" style="fill:#e8e4da;animation-name:r14">   1. send_navigation_goal  location=start_mat</text><text x="22" y="373" class="ln" style="fill:#e8e4da;animation-name:r15">   2. send_navigation_goal  location=waypoint_a</text><text x="22" y="394" class="ln" style="fill:#e8e4da;animation-name:r16">   3. send_navigation_goal  location=rest_mat</text><text x="22" y="415" class="ln" style="fill:#7fae5f;animation-name:r17">  RESULT: SUCCESS (3 step(s) executed)</text><text x="22" y="457" class="ln" style="fill:#8a857a;animation-name:r19"># On a real Bittle X via PetoiAdapter, those calls become OpenCat tokens:</text><text x="22" y="478" class="ln" style="fill:#8a857a;animation-name:r20">#   start_mat  -&gt; PetoiRobot.sendSkillStr('kbalance', 0)</text><text x="22" y="499" class="ln" style="fill:#8a857a;animation-name:r21">#   waypoint_a -&gt; PetoiRobot.sendCmdStr('kwkF 5', 0)   # walk forward 5 cycles</text><text x="22" y="520" class="ln" style="fill:#8a857a;animation-name:r22">#   rest_mat   -&gt; PetoiRobot.sendSkillStr('ksit', 0)</text>
<rect class="caret" x="22" y="506" width="7" height="15"/>
<text x="22" y="559" style="fill:#8a857a;font-size:12px">hermetic mock — language + validator + executor, end to end. no actuator moved.</text>
</svg>
