# URML v0.1 — Kinova Gen3 pick-and-place (ros2_kortex worked example)
#
# Source NL: "Go to the pick bin, find the red widget, grasp it firmly,
#             carry it to the red kitting tray, and place it."
#
# Validated against kinova-gen3.manifest.yaml (the kinova_cobot_cell
# capability manifest). Core manipulation vocabulary only, so it runs
# hermetically against the mock and maps cleanly onto the ros2_kortex
# ROS 2 surface (see urml_to_kortex.py + the README).
#
#   urml validate pick-place.urml.yaml -m kinova-gen3.manifest.yaml --profile home

profile: home
behavior:
  type: sequence
  on_error: abort_and_report
  steps:
    - move_to:
        location: pick_bin
    - detect:
        object: widget_red
        store_as: target
    - grasp:
        target: $target
        force: firm
    - move_to:
        location: kitting_tray_red
        carrying: $target
    - release:
        mode: place
        at: kitting_tray_red
    - move_to:
        location: home_pose
