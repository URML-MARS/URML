# Capability manifest for the hidden-cn-chip example (RFC-0005).
#
# Surface provenance is clean: the critical drive_controller declares
# country_of_origin: US. The honesty gap is one level down, in the HBOM the
# hbom_ref points at. Test/example fixture; values are illustrative.

manifest_version: "0.1"
robot_id: hidden_cn_chip_demo
description: A home robot whose US-declared drive controller hides a CN part in its HBOM.

frames:
  - name: map
    parent: null
  - name: base_link
    parent: map

declared_locations:
  - name: kitchen
    pose: { x: 3.2, y: 1.0 }
    frame: map

mobility:
  drive_type: differential
  max_velocity: 0.46
  station_keeping: true

provenance:
  manifest_attestation: self_declared
  components:
    - id: drive_controller
      role: critical
      vendor: example_us_integrator
      country_of_origin: US
      country_of_final_assembly: US
      hbom_ref:
        format: cyclonedx-1.5
        uri: ./hbom/drive_controller.cdx.json
        sha256: "95873e0edf7f58c310d7811304cb3deb1d2cd82d9213fb76a106ad2543112683"
