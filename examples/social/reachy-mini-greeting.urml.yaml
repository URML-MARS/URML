# URML v0.1, generated from natural language
#
# Scenario: social/reachy-mini-greeting
# Source NL: "Look at me, nod, and say hello. Then glance up and to the left."
#            (see reachy-mini-greeting.en.txt)
#
# Motivating example for RFC-0698: an expressive desk robot with a head, a body
# yaw, and a gesture vocabulary, and no wheels or gripper. Uses the social-profile
# primitives `look_at` and `gesture` beside the existing `speak`.
#
#   urml validate reachy-mini-greeting.urml.yaml \
#     -m reachy-mini-greeting.manifest.yaml --profile social --no-policy

profile: social
behavior:
  type: sequence
  on_error: abort_and_report
  steps:
    - look_at:
        target: face
        duration: 1s
        hold: 3s
    - gesture:
        name: "yes"
    - speak:
        utterance: "Hello! Nice to see you."
        style: conversational
    - look_at:
        target: direction
        direction: { yaw: 30, pitch: 20 }
        duration: 1s
