# URML v0.1 — generated from natural language
#
# Scenario: mobile/husky-patrol
# Source NL: "Drive the two waypoints, then return to the charge point."
#            (see husky-patrol.en.txt)
#
# Navigation-only patrol on a Clearpath Husky AMR manifest
# (mobility.drive_type: differential) that declares compliant parts
# (Robotiq gripper, Intel RealSense camera, Clearpath base — none on
# the FCC Covered List). Core vocabulary only, so it runs hermetically
# against the mock and adapter-agnostically against the mobile
# runtime's HuskyAdapter / JackalAdapter. Uses the `home` profile:
# wheeled AMR navigation needs no new profile (profiles over forks),
# matching the mobile conformance fixtures. Validatable end-to-end:
#
#   urml validate husky-patrol.urml.yaml \
#     -m husky-patrol.manifest.yaml --profile home
#
# `charge_point` is a declared *location* (it has a pose), not a
# docking action. Pass `--no-policy` to skip Pass 5.

profile: home
behavior:
  type: sequence
  on_error: abort_and_report
  steps:
    - move_to:
        location: waypoint_a
    - move_to:
        location: waypoint_b
    - move_to:
        location: charge_point
