# An OPC UA Robotics industrial cell, US provenance.
# Substrate = urml-opcua-runtime (OpcUaAdapter), zero ROS. The OPC UA node
# mapping is deployment config (opcua_adapter.yaml), not URML-declared, so
# this is the plain v0.1 manifest. Mirrors the validator fixture opcua_cell.

manifest_version: "0.1"
robot_id: opcua_cell_a1
description: OPC UA Robotics single-arm pick-and-place cell with a wrist RGB camera and an industrial gripper.

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
    description: Source bin for unsorted widgets.
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
    description: Destination tray for red widgets.
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell
    description: Idle pose between cycles.

declared_events:
  - safety_door_closed
  - line_ready
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: pneumatic_2_finger
      kind: pneumatic
      force_min_n: 1.0
      force_max_n: 25.0
      accepted_classes: [widget, widget_red, widget_blue, small_part]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 50.0
      units: N
  object_vocabulary:
    - widget
    - widget_red
    - widget_blue
    - small_part

docking_stations:
  - name: tool_change_station
    pose: { x: 0.2, y: 0.5, z: 0.20 }
    frame: cell
    services: [swap_tool, park]

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: self_declared
  components:
    - id: opcua_cell_controller
      role: critical
      vendor: generic_industrial
      country_of_origin: US
      country_of_final_assembly: US
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/opcua_cell_controller.cdx.json
        sha256: "8888888888888888888888888888888888888888888888888888888888888888"
