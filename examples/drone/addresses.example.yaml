# Input for tools/scripts/geocode_locations.py.
#
# One street address per location name. `home` is the launch point; every
# other entry becomes a WGS84 binding in the adapter config. The example
# adapter configs in this directory were produced from these addresses via
# Nominatim on 2026-08-29 (coordinates then pinned with `--fix` so the
# committed files regenerate without network). Times Square is the
# founder's chosen example; see docs/demos/sentence-to-pixhawk.md for why
# it is also a textbook case of a site you cannot legally fly without an
# NYPD permit and an FAA airspace authorization.
#
#   python tools/scripts/geocode_locations.py examples/drone/addresses.example.yaml #       --out examples/drone/site-photogrammetry.adapter.yaml #       --alt-agl 100 --orbit site --radius-m 40 --points 5 --look-at site

home: "Times Square, New York"
site: "One Times Square, New York"
dropoff: "Duffy Square, New York"
