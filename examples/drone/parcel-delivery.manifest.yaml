# Manifest for flight test 2: parcel delivery by winch or servo latch.
#
# The payload mechanisms are declared as output lines (RFC-0017), which is
# what they physically are on an ArduPilot airframe: a gripper / servo
# and a winch, each driven by one command. The drone profile keeps
# `manipulation` off aerial manifests, so `release` is not used; a
# follow-up RFC proposes an aerial-delivery extension.
#
# Local-metre poses relative to `home`; WGS84 bindings live in
# parcel-delivery.adapter.yaml. Illustrative coordinates.

manifest_version: "0.1"
robot_id: arducopter_delivery_quad
description: ArduCopter multirotor with a winch and a payload latch for parcel delivery.

frames:
  - name: wgs84
    parent: null
  - name: agl
    parent: wgs84

declared_locations:
  - name: home
    pose: { x: 0.0, y: 0.0, z: 0.0 }
    frame: agl
    description: Launch point.
  - name: dropoff
    pose: { x: 192.6, y: 66.7, z: 30.0 }
    frame: agl
    description: Drop-off station over Duffy Square (geocoded), at cruise height.
  - name: dropoff_low
    pose: { x: 192.6, y: 66.7, z: 3.0 }
    frame: agl
    description: Same point at three metres, for the latch-only variant.

declared_events:
  - emergency_stop
  - low_battery

mobility:
  drive_type: multirotor
  max_velocity: 10.0
  station_keeping: true
  service_ceiling: 120.0
  max_payload: 1.5

perception:
  sensors:
    - name: battery
      measurement_type: voltage
      range_min: 0.0
      range_max: 60.0
      units: V

outputs:
  named_endpoints: []
  lines:
    - name: payload_latch
      kind: digital
      safe_state: false
    - name: winch
      kind: digital
      safe_state: false

connectivity:
  links:
    - role: command_link
      required_for_operation: true
      autonomous_when_lost: false
      assurance_class: monitored
      description: Operator command-and-control link (USB on the bench, telemetry radio in the field).

substrate:
  autopilot_class: ardupilot
