# URML v0.1
#
# Scenario: drone/bench-battery
# Source NL: "Read the battery voltage and report it."
#            (see bench-battery.en.txt)
#
# The positive bench proof for a Pixhawk on USB: a read-only program that
# touches no motor. `measure` reads BATTERY_STATUS over MAVLink; `report`
# sends a STATUSTEXT back to the autopilot's log. Nothing arms, nothing
# changes flight mode.
#
#   urml execute bench-battery.urml.yaml -m pixhawk-ardupilot.manifest.yaml \
#     --profile drone --no-policy --adapter ardupilot \
#     --adapter-config pixhawk-ardupilot.adapter.yaml

profile: drone
behavior:
  type: sequence
  on_error: abort_and_report
  steps:
    - measure:
        what: voltage
        sensor: battery
        store_as: battery
    - report:
        to: log
        facts:
          check: bench_battery
        status: success
        severity: info
