# Safety envelope for flight test 1.
#
# A geofence around the site with a 110 m ceiling (the program flies at
# 100 m; the manifest's service ceiling is 120 m; the strictest wins), a
# wind limit, and a command-link-loss policy of return to home. The
# validator checks every `move_to` station against this footprint and
# band before anything flies.

envelope_version: "0.1"
deployment_id: site_photogrammetry_test
description: Orbit survey at 100 m AGL inside a fenced footprint.

max_velocity: 12.0
max_altitude: 110.0

geofences:
  - name: site_survey_box
    frame: agl
    vertices:
      - [-150.0, -110.0]
      - [30.0, -110.0]
      - [30.0, 20.0]
      - [-150.0, 20.0]
    min_altitude: 0.0
    max_altitude: 110.0

weather:
  max_wind_m_per_s: 8.0
  min_visibility_m: 3000.0
  allow_precipitation: false

link_loss_policy:
  - role: command_link
    action: return_to_home
