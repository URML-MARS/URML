# URML v0.1 — generated from natural language
#
# Scenario: drone/roof-inspection
# Source NL: "Inspect the north roof for damage and bring me photos."
#            (see roof-inspection.en.txt)
#
# The canonical drone-profile example, modeled on the "citizen inspector"
# scenario in MANIFESTO.md §Motivating Scenarios. Validatable end-to-end
# via the companion manifest `roof-inspection.manifest.yaml`:
#
#   urml validate roof-inspection.urml.yaml \
#     -m roof-inspection.manifest.yaml --profile drone
#
# The companion manifest declares US-compliant hardware provenance, so the
# bundled default policy (RFC-0004) accepts it. Pass `--no-policy` to skip
# Pass 5 if you're exercising the program against a manifest without a
# provenance block.

profile: drone
behavior:
  type: sequence
  on_error: abort_and_report
  steps:
    - take_off:
        altitude: 30.0
    - move_to:
        location: roof_north
    - capture:
        media: photo
        store_as: north_photo
    - return_to_home: {}
    - land: {}
