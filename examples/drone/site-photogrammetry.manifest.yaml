# Manifest for flight test 1: five-station orbit at 100 m AGL.
#
# One fixed, forward-looking still camera triggered by the autopilot
# (`movable: false`, so `capture` must not name a `target`; the aircraft
# yaws toward the site instead, via the adapter's `look_at` binding).
# The orbit stations are local-metre poses relative to `home`, generated
# by tools/scripts/geocode_locations.py from addresses.example.yaml; the
# WGS84 bindings live in site-photogrammetry.adapter.yaml.
#
# Illustrative coordinates. Re-run the geocode script for a real site.

manifest_version: "0.1"
robot_id: arducopter_survey_quad
description: ArduCopter multirotor with an autopilot-triggered still camera for site photogrammetry.

frames:
  - name: wgs84
    parent: null
  - name: agl
    parent: wgs84

declared_locations:
  - name: home
    pose: { x: 0.0, y: 0.0, z: 0.0 }
    frame: agl
    description: Launch point.
  - name: site
    pose: { x: 60.0, y: 0.0, z: 100.0 }
    frame: agl
    description: The geocoded address, sixty metres north of launch.
  - name: site_p1
    pose: { x: 100.0, y: 0.0, z: 100.0 }
    frame: agl
  - name: site_p2
    pose: { x: 72.4, y: 38.0, z: 100.0 }
    frame: agl
  - name: site_p3
    pose: { x: 27.6, y: 23.5, z: 100.0 }
    frame: agl
  - name: site_p4
    pose: { x: 27.6, y: -23.5, z: 100.0 }
    frame: agl
  - name: site_p5
    pose: { x: 72.4, y: -38.0, z: 100.0 }
    frame: agl

declared_events:
  - emergency_stop
  - low_battery

mobility:
  drive_type: multirotor
  max_velocity: 12.0
  station_keeping: true
  service_ceiling: 120.0
  max_payload: 0.5

perception:
  cameras:
    - name: site_cam
      movable: false
      supports_photo: true
      supports_video: false
      max_resolution: "20MP"
  sensors:
    - name: battery
      measurement_type: voltage
      range_min: 0.0
      range_max: 60.0
      units: V

outputs:
  named_endpoints: []

connectivity:
  links:
    - role: command_link
      required_for_operation: true
      autonomous_when_lost: false
      assurance_class: monitored
      description: Operator command-and-control link (USB on the bench, telemetry radio in the field).

substrate:
  autopilot_class: ardupilot
