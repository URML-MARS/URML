# Move #55: **the inspection-robotics wave** — lane B of the 2026-06-14 third
# candidate slate. A THIN lane: terrestrial pipe/bridge/construction-machine
# open source is mostly stale/academic, so the clean surface is aerial +
# underwater + off-road. 4 RFCs (0596-0599). DROPPED the MathWorks
# autonomous-excavator (BSD-3, on-altitude but pushed 2024-07 = ~23mo, past the
# 18-month freshness bar) and the ODM/WebODM photogrammetry pair (AGPL,
# data-processing not control = the geospatial wrong-audience profile that got
# PDAL hostile-closed as "automated-agent chum", RFC-0522). No padding.
# Framing (RFC-0020): URML declares the inspection goal + operating envelope,
# validates against the platform's capabilities, and CONSUMES the planned
# trajectory; for the trained-policy targets, RFC-0383 (a policy declares its
# envelope). Outreach = request-for-comment; no ask to adopt/host/maintain.
#
# Targets / framing:
#   - aerial-autonomy-stack (0596, anchor, IT/EU): PX4/ROS2 perception drone +
#     swarm -> mission intent + envelope, validate, consume trajectory; swarm =
#     fleet roster (RFC-0286). MIT.
#   - unav-sim (0597, DK/Aalborg): underwater pipe-following inspection sim
#     (BlueROV2 Heavy, NMPC + trained planner) -> validated inspection intent +
#     trained-planner envelope (RFC-0383). NON-STANDARD license: state, no ask.
#   - bluerov2-cn (0598, FR/Centrale Nantes): BlueROV2 ROS2 control/sim for
#     subsea inspection -> marine drive type, consume; DISTINCT from the touched
#     BlueRobotics BlueOS/ArduSub ecosystem (Move #32). Apache.
#   - roboterrain (0599, US): ROS2+Gazebo off-road RL framework w/ inspection/
#     construction-site envs -> validated-intent gate over a trained policy
#     (RFC-0383); off-road ODD. Apache. Completes the wave.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post posts-move55.md under idoco2003 (all
# GitHub Issues), set sent_at / posted_url / last_touch, add a posted comment,
# flip claude_directives to done, refresh outreach.db. No license-ask anywhere
# (MIT/Apache stated; UNav-Sim non-standard: stated, not asked). VIBE.md
# disclosure up front; per-target body variation. Funnel 585 -> 589 on posting.

