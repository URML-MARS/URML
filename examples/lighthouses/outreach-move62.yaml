# Move #62 outreach ledger. One row per target.
#
# Move #62: **Moltbook -- the agent-distribution venue, not a robotics target.**
# A deliberate shape break from Moves #1-#61. Every prior wave targeted a
# robotics consumer: a runtime URML executes on, a model that drives a robot,
# a component/protocol/sim in the actuation stack. Moltbook is none of those.
# It is a social network FOR AI agents (Reddit-style: submolts, posts, votes;
# agents verified via their human owner's X "claim" tweet; a developer API;
# "skills document" onboarding). Acquired by Meta 2026-03-10.
#
# Why it earns one row anyway (RFC-0640): URML's Layer-4 LLM bridge is
# provider-agnostic, and an AI agent that wants to move a robot is exactly the
# consumer that bridge serves. Moltbook is where that consumer population
# gathers, and (unlike human-maintained code forges) it is a venue where
# AI-authored content is native -- the recurring "is this AI-generated?"
# friction does not apply. The forcing function produced the durable asset:
# a venue-neutral agent-integration skill (docs/integrations/urml-for-ai-agents.md)
# the repo was missing anyway.
#
# HONESTY DISCIPLINE (carried, not buried):
#   - Most Moltbook agents are NOT wired to a physical robot; the realistic win
#     is awareness + skill adoption, not a robot-driving agent fleet.
#   - Moltbook counters (agents / upvotes / "verified" totals) are VANITY.
#     Do NOT derive any engagement or adoption claim from them (same rule as the
#     repo's "traffic reality" note). Some viral Moltbook activity is reported as
#     human-puppeted.
#   - Agent registration is SELF-SERVE (POST /agents/register; no waitlist),
#     verified 2026-06-28 against moltbook.com/skill.md. The "Apply for Early
#     Access" developer program is a SEPARATE thing (third-party app identity
#     verification) and is NOT needed to post. The one real gate on the agent
#     PRESENCE (Component 3) is the X CLAIM TWEET (founder identity). The
#     venue-neutral skill (Component 2) ships regardless.
#
# STATE: DRAFTED 2026-06-28, NOT YET POSTED. sent_at / posted_url EMPTY,
# response: none. Posting glue + draft bodies live under tools/moltbook/ for
# founder review; nothing goes live until developer-API access + the claim
# tweet are in place. Do NOT massage state to look engaged.
#
# No parity test on this ledger (Moltbook has no in-repo manifest; it is not a
# Move-1 LIGHTHOUSE). The schema-v2 conformance test (tier/country/sector/
# comments/claude_directives) still applies -- run the FULL suite before merge.

