# Move #36 outreach ledger. One row per target.
#
# Move #36: **the industrial / collaborative arm-driver wave.** Civilian / research scope.
# Official + community ROS 2 DRIVERS for real industrial and collaborative robot arms
# (the vendor's driver/bringup stack for an actual arm). The integrated-platform
# altitude for URML's manipulation primitives on factory/cobot hardware. Distinct
# from the ros2_control framework wave (Move #23) and the manipulation-algorithm
# wave (Move #27). Surfaces verified 2026-06-07 (stars / Issues+Discussions /
# license / not archived / activity / vendor domicile).
#
# Shapes, mapped to existing URML surfaces (no new spec):
#   - Official vendor ROS 2 drivers: UR (0431, anchor), Franka (0432), Yaskawa
#     motoros2 (0433), Doosan (0436, B), Techman (0437, B), igus ReBeL (0438, B).
#   - Community ROS 2 driver stacks: ABB/PickNik (0434), KUKA LBR iiwa lbr-stack
#     (0435), ROS-Industrial / kuka_experimental (0439, B, org-anchor).
#   - All map pick_from / place_at / grasp (industrial profile, RFC-0013) onto the
#     arm's ROS 2 action surface + ros2_control controllers (Move #23).
#
# Anchor-plus-fold: ROS-Industrial (kuka_experimental anchor, ref the consortium's
# other vendor support packages). Complements the prior ROS-Industrial contact (RFC-0038).
#
# DEFER-PRC (RFC-0003; PRC / PRC-adjacent hardware vendors — do NOT post this wave):
#   xArm-Developer/xarm_ros2 (UFACTORY, Shenzhen), elephantrobotics/mycobot_ros2
#   (Shenzhen), flexivrobotics/flexiv_ros2 (Shanghai HQ, PRC-adjacent),
#   AuboRobot/aubo_ros2_driver (Beijing), JakaCobot/jaka_ros2 (Shanghai),
#   Agile Robots/Diana (Munich+Beijing, no repo yet).
#
# EXCLUDED: ros-industrial/abb (ROS 1, superseded by PickNik), ros-industrial/
# motoman + fanuc (ROS 1; motoman superseded by Yaskawa motoros2; FANUC has no
# official ROS 2), staubli_experimental (dormant 2022), Mecademic (Python API, no
# ROS 2 driver), Kassow/Neura/Hanwha/Comau (no real first-party ROS 2 driver).
# Kinova ros2_kortex already engaged (Move #35).
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post the posts-move36.md body under idoco2003
# (Discussion or Issue per channel), set sent_at / posted_url / last_touch, add a
# posted comment, refresh outreach.db. No license-ask anywhere (state license;
# some repos carry no license file — do NOT add a clarification ask, just omit it).
# VIBE.md disclosure up front.

