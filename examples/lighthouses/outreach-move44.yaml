# Move #44 outreach ledger. One row per target.
#
# Move #44: **the open robot-platforms wave** — the highest-fit lane of the
# 2026-06-13 free-GitHub candidate search (the /goal: 50 new candidates). Open
# robot platforms and hardware SDKs where URML sits ABOVE the platform's own
# control stack as the validated NL -> typed-intent gate: an intent becomes a
# typed primitive, validated against the platform's declared capability manifest
# + a safety envelope, then dispatched to the platform's existing API / ROS 2
# stack (the decide-then-do split). Outreach = request-for-comment proposing a
# capability-manifest mapping + optional adapter; no ask to adopt.
#
# 10 RFCs (0491-0500) for 12 candidate platforms (Source Robotics's two arms,
# PAROL6 + Faze4, are folded into one org-anchor RFC per the no-carpet-bomb
# rule). DROPPED at draft time: ihmcrobotics/ihmc-open-robotics-software — no
# LICENSE file (unlicensed repo; its whole-body angle is covered by upkie /
# the-bimo / zeroth-bot here). Surfaces re-verified 2026-06-13 (none archived,
# all Issues enabled).
#
# Per-target URML hooks: openarm (anchor) + Source Robotics arms -> manipulation
# (RFC-0010 bimanual / RFC-0013 pick-place); upkie / BotBrain / the-bimo /
# zeroth-bot / quadruped / hexapod -> whole_body legged structure (RFC-0384) +
# legged drive_type; the-bimo / zeroth-bot also -> LearnedPolicy sim2real
# envelope (RFC-0383); linorobot2 / magician -> the move_to / pick-place NL
# front door above a ROS 2 stack; magician at the educational tier (RFC-0011).
#
# SOFT FLAG: upkie's lead maintainer's solver libs (pink/mink) were touched in
# Move #27; the upkie platform/org itself is net-new, so this is a distinct
# platform RFC (conscious call).
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post the posts-move44.md bodies under
# idoco2003 (all GitHub Issues), set sent_at / posted_url / last_touch, add a
# posted comment, flip claude_directives to done, refresh outreach.db. No
# license-ask anywhere (verify the LICENSE and state it if needed; never ask).
# VIBE.md disclosure up front. Funnel 480 -> 490 on posting.

