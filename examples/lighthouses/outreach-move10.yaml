# Move #10 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #2 (outreach-move2.yaml): AI/ML-layer targets (21 RFCs).
# Move #3 (outreach-move3.yaml): affordable / desktop / educational (4).
# Move #4 (outreach-move4.yaml): adjacent niches (6).
# Move #5 (outreach-move5.yaml): Tier 2 promotion + DEEP Robotics (9).
# Move #6 (outreach-move6.yaml): US-friendly university robotics labs (12).
# Move #7 (outreach-move7.yaml): agriculture robotics second wave (8).
# Move #8 (outreach-move8.yaml): home assistance robotics + parts (8).
# Move #9 (outreach-move9.yaml): NASA robotics; ROSA first (1 of 3 Tier A).
#
# Move #10 (this file): **perception vendors — cameras and sensors**.
# URML's largest single Move yet. Verified 2026-05-27 via three
# parallel research agents covering 50 candidate vendors across 15
# sensor sub-categories (RGB-D, industrial 3D vision, lidar, event
# cameras, ToF, thermal/IR, IMU/INS, GNSS/RTK, force/torque, radar,
# underwater/sonar, tactile, spectral/hyperspectral, environmental,
# encoder/position).
#
# Engageable set: 29 rows in this ledger (17 Tier A vendor-style +
# 12 Tier B research-collab / cross-citation with caveats). RFC
# numbers reserved 0109-0137 for these 29; each draft is a future
# session.
#
# Excluded set: 21 of the 50 verified candidates were Tier C
# (excluded with cause: archived upstreams, PRC-domiciled / NDAA
# Section 889 concerns, empty vendor orgs, no GitHub surface,
# ITAR-restricted defense vendors, etc.). These are recorded in
# `examples/lighthouses/perception-vendors-research-2026-05-27.md`
# as the full audit trail. They do NOT appear in this ledger
# because the ledger tracks engagement-attempt state, and URML
# does not attempt to engage targets with no surface to engage
# on or with provenance failures against the default policy.
#
# Like Moves #2-#9, this file is NOT under the Move #1 parity
# test. Move #10 RFCs are perception-vendor outreach proposals;
# the wave is research+ledger-stage only in this PR. RFC drafting
# (29 RFCs × ~1 session each) and Issue/Discussion posting are
# multi-week future work.
#
# Schema mirrors outreach-move9.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action,
# notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All 29 rows below carry
# `sent_at: ""` and `channel: deferred` until per-target RFCs
# are drafted and engagement is posted on the upstream surface.

# ============================================================
# Tier A (17) — vendor-direct, OSI license, active, adapter-grade
# ============================================================

