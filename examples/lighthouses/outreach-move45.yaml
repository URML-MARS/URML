# Move #45 outreach ledger. One row per target.
#
# Move #45: **the middleware / control / drivers wave** — lane 2 of the
# 2026-06-13 free-GitHub candidate search. Distinct from Move #44 (platforms,
# URML sits ABOVE a whole robot): these are targets URML *composes with* — a
# controller or planner it hands a validated goal to, a transport/fieldbus
# beneath Layer-1, or a Layer-3 interop peer. Outreach = request-for-comment
# describing the layering / a capability-manifest mapping; no ask to adopt.
#
# 9 RFCs (0501-0509). Per-target seam:
#   - RobotRaconteur (0501, anchor): a comms framework/transport URML dispatches
#     validated intent over (decide-then-do; URML validates, RR transports).
#   - mc_rtc (0502) + bipedal-locomotion-framework (0503): real-time whole-body /
#     locomotion controllers URML hands a validated whole_body goal to (RFC-0384/0010).
#   - hpp-core (0504): a motion planner — URML declares goal+constraints, validates,
#     consumes the trajectory (RFC-0020; Move #26 framing). LAAS-CNRS ecosystem
#     soft-overlap (Pinocchio touched Move #26); distinct org/repo.
#   - ros2_ros_bt_py (0505): Layer-3 BT interop peer (lower-to-tree OR leaf-dispatches
#     -a-validated-primitive; Move #41 framing).
#   - libcyphal (0506) + KickCAT (0507): low-level transport / EtherCAT fieldbus
#     BENEATH Layer-1 HAL (RFC-0319 seam, one layer lower). Protocol altitude — the
#     RFCs explicitly ask whether this is the right altitude vs the integrator level.
#   - husarion_ugv_ros (0508): a concrete UGV driver stack — move_to front door +
#     a HusarionAdapter (vendor-platform mapping).
#   - fcl (0509): the geometric collision/clearance query URML's safety envelope
#     declares against (RFC-0291); "URML declares clearances, fcl checks them."
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post posts-move45.md under idoco2003 (all
# GitHub Issues), set sent_at / posted_url / last_touch, add a posted comment,
# flip claude_directives to done, refresh outreach.db. No license-ask anywhere
# (state the license if relevant — KickCAT CeCILL-C — never ask). VIBE.md
# disclosure up front. Funnel 490 -> 499 on posting.

