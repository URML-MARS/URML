# Move #42 outreach ledger. One row per target.
#
# Move #42: **the teleoperation / imitation-learning data-collection wave.** Civilian
# / research scope. The rigs people use to teleoperate robots and collect
# demonstrations for training. Pairs with the VLA/learning waves (Moves #11, #38):
# teleop is HOW that training data is collected. URML fit (two non-competing seams):
# (a) a validated shared-autonomy / handoff layer the rig hands off to (operator
# commands a high-level intent -> URML validates capability + envelope -> dispatch;
# teleop is the correction path), and (b) a typed schema for the demonstrated intent
# recorded alongside the trajectory (a demo labelled with the URML primitive it
# realizes = structured, manifest-checkable supervision). Surfaces verified 2026-06-12.
#
# Shapes (no new spec):
#   - Leader-arm / input teleop: GELLO (0479, anchor), oculus_reader (0480, VR input).
#   - Hand retargeting: dex-retargeting (0481, AnyTeleop; ties LEAP/Shadow dexterous
#     manifest questions, Move #27).
#   - Immersive VR teleop: Open-TeleVision (0482; bimanual ties RFC-0010).
#   - Handheld / portable data collection: UMI (0483; typed labels + deploy-time
#     envelope), DexCap (0484, B, dormant).
#
# Same-org ack: UMI (real-stanford) shares a lab with the engaged diffusion_policy
# (Move #11) — the post acknowledges that so it does not read as a cold repeat.
#
# DEFER-PRC/HK: unitreerobotics/xr_teleoperate (Unitree, Hangzhou — mainland CN);
# Dingry/BunnyVisionPro (possible HKU co-authorship — verify domicile before any touch).
#
# EXCLUDED: ALOHA + Mobile-ALOHA (dormant 24-26mo, AI-close risk on dead repos),
# Interbotix toolboxes (engaged mobile-manip wave), robosuite/deoxys (ARISE-Initiative
# same-org as robomimic + wrong altitude), fairo (Meta agent platform, not teleop),
# frankx/franky (LGPL + Franka control libs, not teleop rigs), telemoma + droid-dataset/
# droid (NO license file -> not clearly open; droid also same-consortium as the engaged
# droid_policy_learning).
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the founder
# authorizes posting. Then post the posts-move42.md body under idoco2003 (all GitHub
# Issues this wave; none of these repos have Discussions), set sent_at / posted_url /
# last_touch, add a posted comment, refresh outreach.db. No license-ask anywhere
# (all permissive: MIT/Apache). VIBE.md disclosure up front.

