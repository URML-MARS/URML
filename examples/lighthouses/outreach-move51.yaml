# Move #51 outreach ledger. One row per target.
#
# Move #51: **the AV / ADAS / off-road wave** — lane D of the 2026-06-13 second
# candidate slate. A vehicle/AV vertical URML had not mined. 8 RFCs (0558-0565);
# f1tenth_system + f1tenth_gym folded into one (0560). Unifying framing
# (RFC-0020): URML declares the goal + constraints, validates admissibility
# against the vehicle's capabilities and a safety envelope (the operating
# design domain), and CONSUMES the planned trajectory. URML does not plan or
# drive; it declares and validates. opendbc is the exception/anchor: a vehicle
# actuation HAL (Layer-1 seam). Outreach = request-for-comment; no ask to
# adopt, host, or maintain anything.
#
# Targets / framing:
#   - opendbc (0558, anchor, US): vehicle CAN actuation -> Layer-1 HAL seam;
#     URML the validated-intent layer above the actuation HAL. LED here, not
#     openpilot (the openpilot tracker is hostile to non-code).
#   - sunnypilot (0559, US): openpilot fork ADAS (friendlier venue) -> safety
#     envelope = operational design domain (ODD) check before a maneuver.
#   - f1tenth (0560, US/UPenn, fold system+gym): 1/10 racing platform ->
#     declare goal+constraints, validate, consume trajectory; same intent on
#     car and gym; educational (RFC-0011).
#   - race_stack (0561, CH/ETH): full racing stack -> URML declares+validates,
#     race_stack plans+drives (Move #26 framing).
#   - nature-stack (0562, US): off-road autonomy -> typed off-road ODD;
#     consume the planned path.
#   - easynavigation (0563, ES): Nav2 ALTERNATIVE nav framework (explicitly
#     NOT Macenski) -> typed front door to navigation.
#   - agopengps (0564, US): ag guidance/auto-steer -> agriculture vertical;
#     NL field-operation front door + validate against implement.
#   - gemstack (0565, US/UIUC): educational full-stack AV -> typed intent+ODD
#     teaching companion. Completes the wave.
#
# POSTED 2026-06-14 under idoco2003 (all GitHub Issues). No license-ask
# anywhere (each repo's actual license stated, never asked). VIBE.md disclosure
# up front. opendbc/sunnypilot are comma.ai-lineage: moderate AI-close risk,
