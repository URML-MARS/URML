# URML self-distribution ledger. One row per publishing venue.
#
# This is NOT outreach. The outreach*.yaml ledgers track third-party robotics
# targets we pitch URML to. This file tracks the venues where WE publish URML's
# own agent-adoption artifacts: the Agent Skill and the MCP server. It is
# deliberately named `distribution.yaml` (not `outreach*.yaml`) so the
# schema-v2 conformance test does not treat it as an outreach ledger; the shape
# here is different (a publishing venue, not a request-for-comment to a vendor).
#
# HONESTY DISCIPLINE (same rule as the repo's "traffic reality" note):
#   - `response` stays `none` until there is a REAL adoption signal (a human
#     using it, an issue, a citation). Install counts / listing views are
#     VANITY and are NOT engagement. Do not massage them.
#   - `submitted_at` / `posted_url` stay empty until the venue is actually live.
#     Publishing is founder-action (needs maintainer PyPI / GitHub identity);
#     nothing here is live yet. See:
#       - Skill: .github/skills/SUBMISSIONS.md
#       - MCP:   reference/mcp-server/SUBMISSIONS.md + RELEASING.md
#
# Contact on every listing: greenvh@gmail.com.
#
# USABLE NOW, EVEN WHILE THE VENUES ARE UNPUBLISHED: the MCP server runs today
# straight from GitHub (a four-URL git+subdirectory pip install; see
# reference/mcp-server/README.md "Use it now, from GitHub"), and the Agent Skill
# is indexed from the repo. A documented, working install path is AVAILABILITY,
# not adoption. It does NOT move any row off `response: none` on its own; only a
# real user / issue / citation does. The mcp-skill-ci.yml gate keeps that install
# path and the Skill's commands from silently rotting.
#
# response enum: none | acked | engaged | declined  (mirrors the outreach enum).

