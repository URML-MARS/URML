# Move #4 outreach ledger — one row per adjacent-niche target.
#
# Move #1 (outreach.yaml) targeted robot OEMs and component vendors:
# 16 Tier-1 lighthouses, each with a manifest fixture and adapter or
# proposal in-repo. The parity test in
# conformance/tests/test_outreach_ledger.py locks that file's slug set
# to demo.py::LIGHTHOUSES.
#
# Move #2 (outreach-move2.yaml) targeted the AI/ML layer one stratum
# above the substrate vendors.
#
# Move #3 (outreach-move3.yaml) targeted the affordable / desktop /
# educational tier between Move #1 and Move #2.
#
# Move #4 targets adjacent niches that Moves #1, #2, and #3 did not
# touch: Korean-anchored education + research mobile + humanoid + servo
# backbone (ROBOTIS), research-grade mobile bases (AgileX), agricultural
# robotics (FarmBot), commercial mobile manipulation (PAL Robotics),
# frontier open hardware humanoid (Berkeley Humanoid Lite), modular
# research robotics (HEBI). The wave is anchored on the Move #3
# adjacent-niche research pass (founder approved 2026-05-24 to fire
# without waiting for Move #3 signal).
#
# Like Move #2 and Move #3, this file is NOT under the Move #1 parity
# test. Adapters referenced in the corresponding RFCs are proposal-only
# until the upstream maintainers weigh in.
#
# Schema mirrors outreach-move2.yaml and outreach-move3.yaml. Fields:
#   slug         — short identifier, kebab-case.
#   rfc          — integer RFC number (0065+).
#   sent_at      — ISO date the outreach was first sent.
#   posted_url   — the URL where the outreach was published (set after
#                  the founder posts).
#   channel      — how it was sent.
#   contact      — the public handle/address the message was sent to.
#   last_touch   — most recent maintainer action on this target (date).
#   response     — none | acked | engaged | declined | wontfix.
#   next_action  — the maintainer's next planned move; date if relevant.
#   notes        — free-form. Keep facts, not feelings.
#
# Phase 1 posture: the same as Moves #1, #2, #3. Do not massage
# `response` / `last_touch` to look more engaged than reality.

