# Move #17 outreach ledger. One row per target.
#
# Move #17 (this file): **government reps for foundation-home
# alignment** — standards bodies + open-source foundations
# (Class 1), US federal agencies (Class 2), allied / international
# governments (Class 3). Engages governance bodies, not substrate /
# vendor maintainers; the goal is to find a long-term home for
# URML's standard surface per CLAUDE.md's structural-separation
# clause.
#
# **Qualitatively different from Moves 1-16.** Prior moves engaged
# substrate / vendor / academic / OEM maintainers — single
# mechanic (`gh issue create`). Move-17 engages governance bodies
# across **three engagement-mechanic sub-waves**:
#
#   - Sub-wave A (5 targets, `channel: github_issue`):
#       gh-issue-postable. Same pipeline as Moves 10-16.
#       Assistant posts on founder authorization.
#   - Sub-wave B (13 targets, `channel: founder_action`):
#       email / membership / formal submission. URML RFC backs
#       10 of the 13; the other 3 are membership-only.
#       Assistant prepares verbatim drafts in
#       `founder-actions-move17.md`. Founder reviews and sends
#       each through its proper channel under his maintainer
#       identity (email account, ASTM membership portal, IIA
#       application, OECD submission form, etc.).
#   - Sub-wave C (4 targets, `channel: federal_docket_watch`):
#       no immediate action; track for next docket window. Ledger
#       row only.
#
# Plus 15 Tier B candidates recorded with cause (`channel:
# us_partner_gated` or `deferred_phase_2`) but not pursued in this
# wave.
#
# Verified 2026-05-29 via three parallel research agents (one per
# Class) cross-checked against all prior ledgers (Moves 1-16).
# Engageable set: 22 Tier A rows in this ledger (5 Sub-wave A +
# 13 Sub-wave B + 4 Sub-wave C). RFCs reserved 0212-0226 for the
# 15 RFC-eligible targets; 3 Sub-wave B membership-only targets
# do not need RFCs.
#
# Defense-export-controlled bodies (SIBAT, Hoshen, AUKUS, NATO STO,
# UK DSTL, AU DSTG, CA DRDC) are excluded; engagement would conflict
# with URML's Apache-2.0 + offline-execution + no-cloud posture.
# Full Tier C audit trail in
# `examples/lighthouses/move17-research-2026-05-29.md`.
#
# Like Moves #2-#16, this file is NOT under the Move #1 parity test.
# Move #17 RFCs / artifacts are foundation-home outreach proposals;
# the wave is research+ledger+skeleton-stage only in this PR. RFC
# drafting (15 RFCs likely 3 batches) and posting / sending are
# future work.
#
# Schema mirrors outreach-move16.yaml with extended `channel:`
# enum to capture mixed mechanics:
#
#   channel: github_issue            (Sub-wave A, existing)
#   channel: founder_action          (Sub-wave B)
#   channel: federal_docket_watch    (Sub-wave C)
#   channel: us_partner_gated        (Tier B, US-PI / co-member needed)
#   channel: deferred_phase_2        (Tier B, formal SDO Phase 2)
#   channel: deferred                (Tier B / other, default-deferred)
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All Tier A rows below carry
# `sent_at: ""` and the relevant `channel:` value until per-target
# artifacts are drafted and engagement is posted / sent.

