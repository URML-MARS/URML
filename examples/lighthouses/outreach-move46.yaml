# Move #46 outreach ledger. One row per target.
#
# Move #46: **the AI / robot-learning wave** — lane 3 of the 2026-06-13 free-
# GitHub candidate search. The RFC-0383 LearnedPolicy thesis: a trained policy
# (or the benchmark/eval it was measured in) declares the capability envelope
# it was trained/evaluated in, so URML validates that a deployment stays inside
# it; and URML wraps a learned policy in typed intent + a validated envelope
# (decide-then-do). One stratum below this lane is the general-purpose RL-
# framework wave (Move #43); above it the VLA/foundation-model waves (Moves
# #11/#38). Outreach = request-for-comment; no ask to adopt.
#
# 8 RFCs (0510-0517). Sub-types:
#   - Learning frameworks: RoboHive (0510, anchor), robo-gym (0514, real-hw envs).
#   - Eval / benchmarks: SimplerEnv (0511), CALVIN (0512, language-conditioned =
#     URML's headline seam), RoboEval (0513, bimanual ties RFC-0010),
#     openrlbenchmark (0517, RL metrics; one layer from deployment).
#   - Inference runtimes (perception/policy executes; URML gates above):
#     roboflow/inference (0515, edge CV), executorch (0516, on-device PyTorch).
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post posts-move46.md under idoco2003 (all
# GitHub Issues), set sent_at / posted_url / last_touch, add a posted comment,
# flip claude_directives to done, refresh outreach.db. No license-ask anywhere
# (roboflow core Apache-2.0; bundled model dirs carry own licenses, untouched).
# VIBE.md disclosure up front. Funnel 499 -> 507 on posting. NOTE: Meta repos
# avoided (over-contacted); Webots dropped (already touched RFC-0234).

