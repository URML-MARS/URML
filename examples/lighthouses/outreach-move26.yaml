# Move #26 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #26 (this file): **motion planning and navigation**. The planning /
# trajectory-generation / optimal-control layer that sits between URML's
# Layer-2 primitives and the control + SLAM layers already engaged
# (Move #16 substrate spine + Nav2, Move #23 ros2_control, Move #25
# SLAM/estimation). Completes the substrate-to-motion stack.
#
# Shared framing: URML's Layer-2 primitives describe INTENT plus a goal. A
# planner / trajectory-generator / optimal-control substrate computes the
# trajectory that REALIZES the intent under the robot's kinematics,
# dynamics, and constraints. URML does NOT plan: it declares the goal and
# the capability constraints (reachable_workspace_m, max_velocity,
# max_payload; limits via the safety envelope), statically validates the
# request is admissible BEFORE the planner runs, then consumes the
# trajectory. Stack: URML intent -> validated goal + constraints ->
# planner -> ros2_control (RFC-0319) executes -> SLAM/estimation (RFC-0332)
# supplies the world model. Cross-link RFC-0202 (MoveIt, uses OMPL),
# RFC-0010 (whole-body manip), RFC-0290 (frames).
#
# Already covered, NOT duplicated: MoveIt 2 (RFC-0202), MoveIt Task
# Constructor (RFC-0162), Nav2 (RFC-0201), Drake (RFC-0059), the
# ros2_control stack (Move #23), the SLAM/estimation layer (Move #25),
# BehaviorTree.CPP (RFC-0160), py-trees (RFC-0161).
#
# Mix note: 6 direct-fit planning/control targets (OMPL, ruckig, toppra,
# Crocoddyl, OCS2, teb_local_planner), 1 task-planner peer (PlanSys2, the
# closest target to URML's own intent/behavior layer), and 3 honest
# lowest-fit backends (Pinocchio, CasADi, acados) framed like the GTSAM /
# Ceres boundary checks in Move #25 (URML talks to the planner built ON
# them, not to them directly).
#
# Like Moves #2-#25, this file is NOT under the Move #1 parity test. It is
# covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Schema mirrors outreach-move25.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, tier, country,
# sector, comments, claude_directives, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is the
# truthful default. Tier-A rows are DRAFTED (sent_at / posted_url empty)
# until RFCs 0342-0351 land on main; then posted under idoco2003 and
# reconciled. Deferred rows are never posted (channel: deferred).

# ============================================================
# Tier A — live posts (drafted; post after RFCs land on main)
# ============================================================

