# Move #13 outreach ledger. One row per target.
#
# Move #13 (this file): **open-source actuators + embedded / maker substrate**
# (Theme C from the Move-11 backlog gap analysis). After Move #11 (net-new
# VLA / foundation-model wave, posted via PR #178), founder picked Theme C
# ahead of Theme B (mobile manipulators + humanoids, queued for Move #14).
#
# URML's substrate-neutral claim composes from the top of the stack (NL
# layer, Move-11 Gemini Robotics SDK / smolagents) down to the embedded
# edge — motor controllers, MCU substrates, maker platforms. Move-13
# engages Layer-0 of URML's substrate story: the actuator and embedded
# vocabularies URML's micro-class robot story (RFC-0018 `microbit_edu`
# pattern) depends on.
#
# Verified 2026-05-28 via two parallel research agents covering actuator/
# motor-controller and embedded/maker categories, cross-checked against
# all prior ledgers (Moves 1-12).
#
# Engageable set: 15 rows in this ledger (10 Tier A vendor-direct /
# foundation-direct + 5 Tier B research-collab / cross-citation with
# caveats). RFC numbers reserved 0169-0183 for these 15; each draft is a
# future session.
#
# Excluded set: 12 candidates were Tier C (excluded with cause: PRC-
# domiciled / NDAA Section 889 — T-Motor; Shanghai-HQ operator-decision
# flag — Espressif; stale > 6 mo — ODRI, Nordic, ARM Mbed, Tessel; no
# GitHub presence — MyActuator, TI InstaSPIN, ADI motor refs; wrong
# layer / theme — Franka, ROS 2 Controls, SparkFun). Full audit trail in
# `examples/lighthouses/move13-research-2026-05-28.md`.
#
# Like Moves #2-#12, this file is NOT under the Move #1 parity test.
# Move #13 RFCs are actuator/embedded outreach proposals; the wave
# is research+ledger-stage only in this PR. RFC drafting (15 RFCs ×
# ~1 session each) and Issue/Discussion posting are future work.
#
# Schema mirrors outreach-move11.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action,
# notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All 15 rows below carry
# `sent_at: ""` and `channel: deferred` until per-target RFCs
# are drafted and engagement is posted on the upstream surface.

