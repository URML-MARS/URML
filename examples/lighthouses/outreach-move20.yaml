# research is preserved without contradicting the default policy (same
# logic that excluded Roborock/Ecovacs in RFC-0100 and Beatbot/Aiper in
# RFC-0103).
# Split: 1 GitHub auto-post (Blue Frog) + 4 off-GitHub courtesy
# (OhmniLabs, Labrador, ElliQ, Andromeda) + 3 deferred PRC.
# Geographic spread: 2 US, 1 FR, 1 IL, 1 AU (clean) + 3 CN (deferred).
#
# Like Moves #2-#19, this file is NOT under the Move #1 parity test.
# It is covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Schema mirrors outreach-move8.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, tier, country,
# sector, comments, claude_directives, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none`
# is the truthful default. The three CN rows are deferred with cause
# (channel: deferred), never sent.

