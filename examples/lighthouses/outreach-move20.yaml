- slug: ohmnilabs-ohmni
  rfc: 292
  sent_at: "2026-06-01"
  posted_url: ""
  channel: email
  contact: "Founder emailed partnerships@ohmnilabs.com 2026-06-01 pointing at RFC-0292. Auto/templated reply from OhmniLabs Support same day. Backup channels on file: support@ohmnilabs.com, hello@ohmnilabs.com, contact form at ohmnilabs.com/about-us/contact-us/. Company is now a product line of Symbotic (acquired Dec 2024)."
  last_touch: 2026-06-01
  response: acked
  tier: A
  country: US
  sector: robot-platform
  comments:
    - date: "2026-05-31"
      text: "GitHub org dormant since 2018 (verified via gh repo view: ohmni-ros-demo last pushed 2018-09, ohmni-devkit-arduino 2018-12). Downgraded from GitHub auto-post to off-GitHub courtesy at draft time; live surface is the dev portal. Founder to send via ohmnilabs.com / docs.ohmnilabs.com contact."
    - date: "2026-06-01"
      text: "Founder sent the RFC-0292 outreach; received a templated OhmniLabs Support reply (acked, ticket-bot class per the Move-17 NIST precedent, not engaged). SUBSTANCE: the Ohmni Telepresence Robot is END-OF-LIFE as of 2026-01-01 — no ongoing technical support, troubleshooting, parts, or software updates (except active extended warranties). This undercuts RFC-0292's premise (a live Developer Edition / WebAPI / ROS-on-Docker adapter target). Currently supported lines are OhmniCare (telehealth, care-support@ohmnilabs.com) and OhmniClean (UV-C disinfection, clean-support@ohmnilabs.com) — neither is the home-assistance/telepresence target pitched. Base cloud app.ohmnilabs.com remains live (calling/basic functionality) with no retirement plan, but no new features. Conclusion: the OhmniAdapter premise is not viable for the telepresence robot."
  claude_directives: []
  next_action: "do not pursue the telepresence-robot adapter: the platform is EOL (2026-01-01). No further outreach unless URML develops a use case for a currently-supported Symbotic/Ohmni line (OhmniCare telehealth or OhmniClean UV-C), both of which are outside the home-assistance scope of Move #20. RFC-0292 carries a maintainer-response note recording the EOL outcome."
  notes: "Move #20 off-GitHub target. OhmniLabs Ohmni was a US-domiciled (Santa Clara, CA) telepresence + home-care robot with a documented Developer Edition (WebAPI, ROS-on-Docker, Arduino). 2026-06-01: outreach returned an EOL notice — the telepresence robot reached end-of-life 2026-01-01 (now a Symbotic product line; supported lines pivoted to OhmniCare + OhmniClean). The proposed OhmniAdapter target no longer exists as a supported platform. RFC-0102 (Bear) off-GitHub precedent. Verified 2026-05-31 (GitHub dormancy); EOL recorded 2026-06-01."

