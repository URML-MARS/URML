# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #8 (outreach-move8.yaml): URML's first dedicated home-assistance
# wave (RFCs 0100-0107): Roomba, Husqvarna Automower, Bear Robotics,
# Maytronics Dolphin, ROBOTIS Dynamixel, Luxonis OAK-D, Home Assistant,
# OpenVoiceOS.
#
# Move #20 (this file): **home-assistance robotics, round two**. A fresh
# candidate sweep (May 2026) that the Move #8 set did not touch, screened
# against US-federal default-policy alignment per RFC-0003.
