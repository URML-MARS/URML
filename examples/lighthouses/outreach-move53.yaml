# Move #53 outreach ledger. One row per target.
#
# Move #53: **the motor-control / RTOS substrate wave** — lane C of the
# 2026-06-13 second candidate slate, the LAST lane (exhausts the slate). 10
# RFCs (0576-0585). This lane is altitude-sensitive: URML sits well above an
# RTOS, so the RTOS targets are framed honestly and narrowly as the MCU
# substrate tier (RFC-0018 minimal_node), and the wave LEADS with integrator
# firmware (betaflight/inav/FluidNC) where the altitude is clean. Outreach =
# request-for-comment; no ask to adopt, host, or maintain anything.
#
# Per-target structural variation applied (founder's "human attitude" note,
# 2026-06-14): the posted bodies use different openings, question counts, and
# ordering rather than a single skeleton.
#
# Targets / framing:
#   - betaflight (0576, anchor): FC firmware -> declare flight intent + bounds,
#     validate, dispatch; clean altitude. GPL-3.0 cross-citation.
#   - inav (0577): nav-focused FC firmware -> declared mission intent
#     (waypoints/RTH/geofence-as-envelope). GPL-3.0 cross-citation.
#   - fluidnc (0578): ESP32 CNC firmware -> job intent + machine-limits
#     envelope. Non-standard license, no code reuse.
#   - tock (0579): capability-secure RTOS -> capability-model RESONANCE
#     (manifest <-> OS grants); strongest RTOS fit. Dual Apache/MIT (NOASSERTION).
#   - freertos (0580): canonical RTOS -> honest narrow seam, minimal_node
#     executor as an RTOS task (RFC-0018). MIT.
#   - nuttx (0581): POSIX RTOS -> minimal_node host; concrete PX4-on-NuttX path.
#     Apache-2.0.
#   - riot (0582): IoT RTOS -> networked actuator node + fleet roster
#     (RFC-0286). LGPL-2.1 cross-citation.
#   - contiki-ng (0583): low-power IoT OS -> MOST EXPLORATORY, honest thin seam
#     (sensing-centric); posted with that stated. BSD-3.
#   - embassy (0584): Rust async embedded -> minimal_node Rust executor;
#     type-system alignment. Apache/MIT.
#   - rtic (0585): real-time Rust -> RFC-0016 cyclic-timing RESONANCE (declared
#     timing <-> RTIC task set). Completes the wave + slate. Apache/MIT.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post posts-move53.md under idoco2003 (all
# GitHub Issues), set sent_at / posted_url / last_touch, add a posted comment,
# flip claude_directives to done, refresh outreach.db. No license-ask anywhere
# (state each repo's actual license, never ask; GPL/LGPL/non-standard -> no
# code reuse). VIBE.md disclosure up front. Funnel 566 -> 576 on posting.

