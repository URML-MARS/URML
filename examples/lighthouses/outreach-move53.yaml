      text: "Per Lindgren (RTIC lead, RT-systems academic; COLLABORATOR) gave a long, generous expert reply on #1188. On compile-time 'checkable': yes-and-no (SRP scheduling, single-unit resources, fixed priority; v1 does not capture deadlines/inter-arrival, but given those you get response-time + schedulability guarantees via established SRP analysis, needing WCET, which they get by symbolic execution of the binary; possible but extra tooling, not shipped). On run-time 'checkable': yes (watchdog on a periodic task; self-monitoring in the task postlude; overload detection via a watchdog cleared in idle at the hyper-period). Building RTIC eVo (https://github.com/zakimadaoui/rtic-mc-experiments), a modular framework to add periodic tasks + auto-generated run-time verification. Moves none -> engaged. Replied 2026-07-09 (issuecomment-4921054828): URML's RFC-0016 only DECLARES the requirement (no scheduling/WCET/schedulability; one static sanity check = watchdog >= cycle); his two 'checkable' readings map onto pairing that declaration with (a) his SRP analysis at compile time and (b) his watchdog patterns at run time; RTIC eVo is the natural lowering target (declared period -> periodic task, declared watchdog -> generated monitor); URML asks RTIC to adopt nothing. Offered a worked example (a URML RFC-0016 manifest mapped onto an RTIC task set, no RTIC dependency)."
