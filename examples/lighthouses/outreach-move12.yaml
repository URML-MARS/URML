# Move #12 outreach ledger. One row per target.
#
# Move #12 (this file): **speech / translation / robot-command-library**
# targets. Fills the gap left by Moves #1-#11: the projects that produce
# the inputs and substrates for URML's Layer-4 NL grammar (STT, TTS,
# translation) and the libraries URML's Layer-3 behavior composition
# would compile down to (behavior-tree / skill-catalog DSLs). Distinct
# from Move #11 (VLAs / robot foundation-models) which is upstream of
# language infrastructure.
#
# URML's Layer-4 NL grammar reserves multilingual slots for Hebrew,
# Spanish, Japanese, and Mandarin; Layer-2 has `listen` and `speak`
# primitives with `input: speech | text`. None of the prior eleven
# outreach waves engaged the projects on the other side of those
# interfaces. Move #12 is that engagement.
#
# Verified 2026-05-28 via two general-purpose research agents in
# parallel covering 4 buckets (STT/wake-word, TTS, translation/
# multilingual NL, robot command libraries / behavior-tree DSLs / skill
# catalogs). Each row passed through `gh repo view --json
# licenseInfo,stargazerCount,pushedAt,isArchived,hasIssuesEnabled,
# hasDiscussionsEnabled` and an origin/domicile audit per URML's
# US-federal default policy (NDAA Section 889 excludes PRC-domiciled).
#
# Engageable set: 16 rows in this ledger (12 Tier A vendor-style /
# research-lab-direct + 4 Tier B with explicit friction notes — archived
# repo, AGPL copyleft, GPL copyleft, or commercial-SDK posture). RFC
# numbers reserved 0153-0168 for these 16; each draft is a future session.
#
# Excluded set: 6 candidates were Tier C (excluded with cause:
# PRC-domiciled per NDAA Section 889 — k2-fsa/sherpa-onnx (Xiaomi),
# SWivid/F5-TTS (SJTU); Russia-domiciled under URML's parallel-exclude
# posture pending an explicit Russia rule — alphacep/vosk-api; dead
# upstream with no canonical successor — coqui-ai/STT, coqui-ai/TTS,
# festvox/festival). Full audit trail in
# `examples/lighthouses/move12-research-2026-05-28.md`.
#
# Like Moves #2-#11, this file is NOT under the Move #1 parity test.
# Move #12 RFCs are speech / translation / command-library outreach
# proposals; the wave is research+ledger-stage only in this PR. RFC
# drafting (16 RFCs × ~1 session each, batched ~5 per PR) and Issue/
# Discussion posting are future work.
#
# Schema mirrors outreach-move11.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action,
# notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All 16 rows below carry
# `sent_at: ""` and `channel: deferred` until per-target RFCs
# are drafted and engagement is posted on the upstream surface.

# ============================================================
# Tier A (12) — vendor-direct / research-lab-direct, OSI license,
# adapter-grade or strong-substrate-overlap candidates
# ============================================================

