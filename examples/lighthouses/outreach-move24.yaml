# Move #24 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #23 (outreach-move23.yaml): the ros2_control / actuation-control
# stack (URML's Layer-1 HAL seam).
#
# Move #24 (this file): **simulation and digital-twin**. The layer where
# an NL->validated-intent loop can run with zero hardware. URML's hermetic
# demo posture (validate -> execute against a mock/sim) makes simulators a
# natural substrate: validated English intent -> URML primitive -> a robot
# entity in a simulator -> motion, no real robot in the loop. The
# digital-twin half (Eclipse Ditto) treats URML's capability manifest as a
# robot's capability twin.
#
# Already covered, NOT duplicated: MuJoCo (RFC-0060), Drake (RFC-0059),
# Gazebo/OSRF (Move #1), NVIDIA Isaac Lab (RFC-0050), DeepMind
# mujoco_playground (RFC-0144), AI2-THOR (RFC-0147), Webots (RFC-0234),
# gz_ros2_control (Move #23 folded).
#
# Split: 10 live Tier-A posts (10 distinct orgs) + 13 folded/Tier-B/Tier-C
# rows (sibling repos folded under their anchor, plus research sims and
# closed/stale surfaces recorded with cause). Funnel-volume wave: it
# materially grows the top-of-funnel toward the ~1000-potential target.
#
# Like Moves #2-#23, this file is NOT under the Move #1 parity test. It is
# covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Schema mirrors outreach-move23.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, tier, country,
# sector, comments, claude_directives, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is the
# truthful default. Tier-A rows are DRAFTED (sent_at / posted_url empty)
# until RFCs 0322-0331 land on main; then posted under idoco2003 and
# reconciled. Folded / deferred rows are never posted (channel: deferred).

