# Move #48 outreach ledger. One row per target.
#
# Move #48: **the domain / standards / conceptual-peer wave** — lane 5 (final)
# of the 2026-06-13 free-GitHub candidate search. Domain verticals not deeply
# mined + standards bodies + conceptual language peers. 13 RFCs (0529-0541).
# Mixed framing per target (no single thesis): URML as the intent layer above a
# domain platform/fleet, a conceptual peer to another robot/planning language,
# or a complementary standard. Outreach = request-for-comment; no ask to adopt.
#
# Targets / framing:
#   - osgar (0529, anchor, CZ): underground/SubT heterogeneous fleet -> URML
#     fleet roster (RFC-0286) + deconfliction (RFC-0291).
#   - moos-ivp (0530, US): marine IvP-Helm behavior arbitration -> conceptual
#     PEER (URML intent above the helm).
#   - project11 (0531, US): ASV backseat-driver mission framework -> URML
#     mission spec above the mission manager.
#   - bsk_rl (0532, US): spacecraft RL planning/scheduling -> task intent +
#     LearnedPolicy envelope (RFC-0383). Space.
#   - PX4-Space-Systems (0533, SE): PX4 free-flyer fork -> reuses URML's PX4
#     substrate mapping. Space.
#   - feldfreund (0534, DE): autonomous weeding -> NL field-task front door. Ag.
#   - OpenExo (0535, US): open exoskeleton (MCU substrate) -> envelope-bounded
#     assistance declaration; RESEARCH scope, no clinical claim.
#   - CleanIt (0536, NO): Rust vacuum autonomy -> service-robot NL front door.
#   - roomi (0537, US): cleaning + dual-arm -> mobile manipulation + bimanual
#     (RFC-0010).
#   - openamr (0538, CY/EU): SME intralogistics AMR (+ Open-RMF) -> warehouse
#     profile (RFC-0022) + fleet validation (RFC-0286/0291).
#   - unified-planning (0539, EU): AIPlan4EU planning library -> closest
#     conceptual LANGUAGE PEER (intent <-> planning problem).
#   - mtconnect/cppagent (0540, US): manufacturing-interop STANDARDS body ->
#     equipment-state fact a robot intent conditions on (complements OPC UA).
#   - auto-apms (0541, DE): BT/skill deliberation DSL -> Layer-3 interop peer
#     (Move #41 framing). Completes the wave + the candidate slate.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post posts-move48.md under idoco2003 (all
# GitHub Issues), set sent_at / posted_url / last_touch, add a posted comment,
# flip claude_directives to done, refresh outreach.db. No license-ask anywhere
# (moos-ivp / OpenExo: state the repo's actual license, never ask). VIBE.md
# disclosure up front. OpenExo framing is RESEARCH-scope, no clinical claim.
# Funnel 518 -> 531 on posting (exhausts the 54-candidate slate).

