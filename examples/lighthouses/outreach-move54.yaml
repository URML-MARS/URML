# Move #54 outreach ledger. One row per target.
#
# Move #54: **the lab-automation / scientific-robotics wave** — lane A of the
# 2026-06-14 third candidate slate, the richest lane (a coherent, almost
# entirely US/allied open vertical: Argonne, Brookhaven, LBNL, UW, MIT, UCSF,
# NIMS). 9 RFCs (0587-0595); AD-SDL WEI + MADSci folded into one org-anchor
# row (0588). Thesis: a lab protocol/workflow is goal+constraints validated
# against an instrument/workcell capability manifest before dispatch; URML's
# MODEL (typed intent + decide-then-do + capability manifest) transfers, the
# workcell/deck/labware being the manifest. Framed HONESTLY as a model-level
# fit and an open question, not "URML already does lab automation." Outreach =
# request-for-comment; no ask to adopt, host, or maintain anything.
#
# Two framing buckets:
#   - orchestration / declare-then-execute PEERS (URML = typed per-device/step
#     validation gate complementing the orchestrator): AD-SDL MADSci/WEI (0588),
#     bluesky (0590), alabos (0591), nimsos (0595).
#   - hardware-agnostic SDK / driver / instrument SUBSTRATE (URML dispatches a
#     validated step to it; config = the manifest): PyLabRobot (0587, anchor),
#     pyhamilton (0592), pycro-manager (0593); plus typed-IO protocol peer
#     aquarium (0589) and the teaching demo self-driving-lab-demo (0594).
#
# Targets / framing:
#   - pylabrobot (0587, anchor, US): hardware-agnostic liquid-handler SDK ->
#     deck/labware model IS the lab form of a capability manifest. Closest fit.
#   - ad-sdl (0588, US/Argonne, fold WEI+MADSci): workcell orchestration ->
#     per-node validated step + workcell-as-roster (RFC-0286).
#   - aquarium (0589, US/UW): typed-IO lab protocols -> typed-operation peer.
#   - bluesky (0590, US/Brookhaven): declarative experiment plans + run engine
#     -> two declare-then-execute loops; pre-dispatch validation pass.
#   - alabos (0591, US/LBNL): A-Lab task/device orchestration -> per-task
#     validated step + device-defs-toward-manifest.
#   - pyhamilton (0592, US/MIT): Hamilton liquid-handler driver -> concrete
#     substrate; deck config = manifest.
#   - pycro-manager (0593, US/UCSF-UW): microscope automation -> validated
#     acquisition instruction; scope config = manifest.
#   - self-driving-lab-demo (0594, US/Utah): SDL teaching framework -> make the
#     validated-intent step visible; NL on-ramp (RFC-0011).
#   - nimsos (0595, JP/NIMS): autonomous-experiment orchestration (file-exchange
#     to non-Python instruments) -> neutral typed action at that boundary.
#     NO license file: state that, no ask, no code reuse. Completes the wave.
#
# POSTED 2026-06-14 under idoco2003 (all GitHub Issues). No license-ask
# anywhere (MIT/BSD stated; nimsos no-license: stated, not asked). VIBE.md
# disclosure up front; per-target body variation. Funnel 576 -> 585. All rows
# response: none, awaiting maintainer reply.

