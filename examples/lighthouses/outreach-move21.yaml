# Move #21 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #8 (outreach-move8.yaml): home-assistance robotics, round one.
# Move #20 (outreach-move20.yaml): home-assistance robotics, round two.
#
# Move #21 (this file): **warehouse / intralogistics AMR vendors + the
# interoperability layer**. Puts real targets behind URML's warehouse
# machinery: the warehouse domain profile (RFC-0022), the Open-RMF
# bridge (RFC-0053), fleet addressing (RFC-0286), and frame-transform +
# geometric deconfliction (RFC-0290/0291).
#
# Research finding: the household AMR makers (Locus, Vecna, Seegrid, MiR,
# OTTO, Symbotic, 6 River, Geek+) almost all have CLOSED GitHub surfaces
# (Move #15 documented this). So this wave LEADS with the GitHub-live
# interoperability + open-fleet-control layer (VDA5050, InOrbit
# ros_amr_interop, openTCS), where URML's compose-above thesis is
# sharpest, and treats the closed-surface vendors as off-GitHub courtesy.
# Already covered, NOT duplicated: Clearpath (RFC-0072, engaged),
# Fetch/Zebra (RFC-0188), Open-RMF (RFC-0053), Starship (RFC-0193),
# AnyBotics (RFC-0049), AgileX (RFC-0066).
#
# Split: 3 GitHub interop (auto-post) + 4 off-GitHub vendor-direct +
# 1 MassRobotics (engaged via the InOrbit RFC) + 2 deferred PRC.
# Geographic spread: 4 US, 2 DE, 1 DK (clean) + 2 CN (deferred).
#
# Like Moves #2-#20, this file is NOT under the Move #1 parity test.
# It is covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Schema mirrors outreach-move20.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, tier, country,
# sector, comments, claude_directives, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none`
# is the truthful default. The two CN rows are deferred with cause
# (channel: deferred), never sent.

