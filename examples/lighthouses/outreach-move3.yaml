# Move #3 outreach ledger — one row per affordable / desktop / educational
# robotics target.
#
# Move #1 (outreach.yaml) targeted robot OEMs and component vendors: 16
# Tier-1 lighthouses, each with a manifest fixture, conformance fixture,
# and adapter or proposal in-repo. The parity test in
# conformance/tests/test_outreach_ledger.py locks that file's slug set to
# demo.py::LIGHTHOUSES.
#
# Move #2 (outreach-move2.yaml) targeted the AI/ML layer one stratum
# above the substrate vendors: open-source robot-learning libraries,
# robotics-AI specialist startups, frontier-lab robotics arms, and the
# open-data / open-model infrastructure projects that sit between them.
# Those targets do not ship a per-target manifest fixture or adapter in
# this repo, so the Move #1 parity test does not apply there.
#
# Move #3 targets the affordable / desktop / educational tier between
# Move #1 and Move #2. Programmable arms and quadrupeds in the $300 to
# $8k range that already expose Python and ROS 2 surfaces. Audience:
# educators, students, hobbyists, light-industrial deployments, and
# academic researchers buying their own hardware. Each target ships with
# its own GitHub org and SDK already; this file tracks the outreach
# state, not the adapter state.
#
# Like Move #2, this file is NOT under the Move #1 parity test. Adapters
# referenced in the corresponding RFCs are proposal-only until the
# upstream maintainers weigh in.
#
# Schema mirrors outreach.yaml and outreach-move2.yaml so the listening
# discipline stays uniform across moves. Fields:
#   slug         — short identifier, kebab-case.
#   rfc          — integer RFC number (0061+).
#   sent_at      — ISO date the outreach was first sent.
#   posted_url   — the URL where the outreach was published (set after
#                  the founder posts).
#   channel      — how it was sent (e.g. github_issue, github_discussion,
#                  email). Free-form; document in notes if the channel
#                  changed across touches.
#   contact      — the public handle/address the message was sent to.
#   last_touch   — most recent maintainer action on this target (date).
#   response     — none | acked | engaged | declined | wontfix
#                    none      — nothing back yet
#                    acked     — they noticed but said nothing substantive
#                    engaged   — substantive reply / discussion in progress
#                    declined  — polite no
#                    wontfix   — not interested / out of scope on their end
#   next_action  — the maintainer's next planned move; date if relevant.
#   notes        — free-form. Keep facts, not feelings.
#
# Phase 1 posture: the same as Move #1 and Move #2. Do not massage
# `response` / `last_touch` to look more engaged than reality. `none` is
# the truthful default until something concrete arrives.

