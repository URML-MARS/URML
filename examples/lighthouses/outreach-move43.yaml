# Move #43 outreach ledger. One row per target.
#
# Move #43: **the general-purpose reinforcement-learning / policy-training wave.**
# Civilian / research scope. The libraries people use to TRAIN policies, one
# stratum below the VLA / foundation-model layer (Moves #11, #38) and distinct
# from the legged-specific RL libraries (Move #29: rsl_rl / legged_gym / rl_games).
# These are general-purpose RL frameworks (PPO/SAC/DQN/...), not robot platforms.
#
# URML fit (the same thesis for all six, RFC-0383 LearnedPolicy + RFC-0002
# decide-then-do): a policy trained in framework X is deployed on a robot. URML
# carries the policy's training envelope (observation/action spaces + training-
# domain bounds) as a typed, validatable declaration, and sits between the policy
# and the hardware as the decide-then-do gate: each proposed action is checked
# against the robot's declared capabilities + the active safety envelope before
# dispatch. The policy decides; URML does. Two non-competing seams: (a) envelope
# EXPORT (a trained policy emits its obs/action spaces + domain bounds as a URML
# LearnedPolicy envelope) and (b) validated DEPLOYMENT (the gate). This is the
# same question the legged-RL maintainers were asked in Move #29, generalized.
#
# Targets (surfaces verified 2026-06-12; all MIT/Apache, none archived, none
# already touched, none deferred-country):
#   - stable-baselines3 (0485, anchor; the canonical RL lib; Issue)
#   - cleanrl (0486; single-file = ideal worked example; Discussion/Ideas)
#   - skrl (0487; Isaac Lab / sim2real focus, has a Sim2Real category; Discussion)
#   - torchrl / pytorch/rl (0488; primitive-first, TensorSpec; Discussion/Ideas)
#   - mushroom-rl (0489; clean MDPInfo; Issue)
#   - ray / RLlib (0490; narrow RLlib framing only, not Ray core; Issue)
#
# DEFERRED WITH CAUSE (logged, not silently dropped):
#   - facebookresearch/Pearl: clean + active + high fit, but Meta is already
#     over-contacted (lerobot, openpi, seamless_communication/NLLB all engaged).
#     Held to avoid org-fatigue; revisit if a Meta thread is warranted.
#   - alex-petrenko/sample-factory: single-author, cadence slowing (last push
#     2026-01); throughput-not-deployment focus. AI-close risk on a quiet repo.
#   - luchris429/purejaxrl: dormant since 2024-09, single-author research repo.
#   - google-deepmind/acme: not archived but maintenance-only internal mirror,
#     ~97 stale open issues; a cold Issue likely goes unread.
#   - google/dopamine: not archived but quarterly batched-sync only, ~110 stale
#     open issues; low-yield cold surface.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post the posts-move43.md body under idoco2003,
# set sent_at / posted_url / last_touch, add a posted comment, flip the
# claude_directives status to done, refresh outreach.db. No license-ask anywhere
# (all permissive: MIT / Apache-2.0). VIBE.md disclosure up front. For the three
# Discussion targets, query the discussion categories at post time and use Ideas
# (skrl's Sim2Real category is the natural alternative).

