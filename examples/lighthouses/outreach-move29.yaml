# Move #29 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #29 (this file): **open humanoid and legged robots, round 2**. The
# 2025-26 open-humanoid surge plus the open legged-locomotion control /
# RL stacks. Extends the earlier legged/humanoid touches (ANYmal RFC-0049,
# Berkeley Humanoid Lite RFC-0069, Stanford Pupper RFC-0075, ODRI Solo
# RFC-0076, iCub RFC-0192, 1X RFC-0187, Reachy RFC-0240, NAO/Pepper
# RFC-0237/0238, Poppy RFC-0239).
#
# THE GAP this wave surfaces: the richer whole-body (legs + arms, balance)
# capability shape a humanoid manifest needs. URML composes ABOVE a legged
# platform (intent + validated capability -> the platform's locomotion stack
# -> joints); the locomotion controller (learned policy or MPC/WBC) is the
# substrate.
#
# CORRECTION (2026-06-04): the original framing here and in the posts/RFCs
# claimed drive_type "has NO legged / bipedal / quadruped class." That is
# FALSE. `biped` and `quadruped` have existed since RFC-0009 (Implemented
# 2026-05-19); the error came from reading a drifted Layer-1 spec doc (fixed
# in the RFC-0010 build). The whole-body manipulation half of the queued work
# then shipped as RFC-0010 (Implemented 2026-06-04). The genuine open question
# (what a humanoid manifest should declare for whole-body kinematics and
# balance) stands. The 9 live issues get a correction comment; do not massage
# `response` state.
#
# Tiering reality: the category skews PRC-domiciled (Unitree, RobotEra) and
# research-heavy. The 9 live Tier-A are allied / active / open (US, ETH-CH,
# FR, ES, plus open-academic). PRC-domiciled hardware-vendor stacks are
# DEFERRED with cause under RFC-0003 (open-source code, but the exclusion is
# about hardware-vendor procurement alignment; recorded, not contacted).
# Per the 2026-06-03 guidance, NO RFC or post carries a license-ask.
#
# Already covered, NOT duplicated: Isaac Lab (RFC-0050), mujoco_playground
# (RFC-0144), OCS2 (RFC-0347), the prior legged/humanoid RFCs above.
#
# Like Moves #2-#28, this file is NOT under the Move #1 parity test. It is
# covered by the schema-v2 validator.
#
# Phase 1 posture: do not massage `response` / `last_touch`. Tier-A rows are
# DRAFTED (sent_at / posted_url empty) until RFCs 0372-0380 land on main;
# then posted under idoco2003 and reconciled. Deferred rows are never posted.

