# Move #57 outreach ledger. One row per target.
#
# Move #57: **the soft-robotics / assistive wave** — lane E of the 2026-06-14
# third candidate slate. 5 RFCs (0605-0609); gym-softrobot folded into
# PyElastica (0606). DROPPED two of the slate's "strong" picks for staleness
# (the 18-month freshness bar, consistent with the Move #55 excavator drop):
# StanfordASL/soft-robot-control (MIT, on-altitude, but pushed 2024-10 = ~20mo)
# and chai3d/chai3d (NOASSERTION, haptics-adjacent, pushed 2024-08 = ~22mo).
# No padding. Framing: URML declares the soft-robot/assistive subtask goal +
# operating envelope and CONSUMES the computed control / decoded intent; it does
# not model FEM, simulate, train, or decode EMG. Research-scope for assistive
# (no clinical claim). Outreach = request-for-comment; no ask to adopt/host/
# maintain.
#
# Targets / framing:
#   - softrobots (0605, anchor, FR/INRIA): SOFA soft-robot FEM + inverse control
#     -> declare goal + envelope, consume the computed actuation. LGPL cross-cite.
#   - pyelastica (0606, US/UIUC, fold gym-softrobot): Cosserat soft sim + RL env
#     -> declared control goal above sim/training; trained policy declares its
#     envelope (RFC-0383). MIT.
#   - libemg (0607, CA/UNB): myoelectric control library -> URML consumes a
#     DECODED EMG intent, validates the action vs the assistive device.
#     RESEARCH-scope, no clinical claim. MIT.
#   - bottango (0608, US): animatronics animation tool + REST API -> portable
#     typed-intent layer over per-effector control. BSD-3.
#   - o80 (0609, DE/MPI-IS): real-time PAM (pneumatic-muscle) control interface
#     -> declare goal + envelope, dispatch to the real-time loop. BSD-3.
#     Completes the wave.
#
# POSTED 2026-06-15 under idoco2003 (all GitHub Issues). No license-ask
# anywhere (MIT/BSD stated; SoftRobots LGPL cross-cite, no code reuse). VIBE.md
# disclosure up front; per-target body variation. Funnel 594 -> 599. All rows
# response: none, awaiting maintainer reply.

