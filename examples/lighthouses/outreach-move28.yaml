# Move #28 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #28 (this file): **safety and runtime verification**. The runtime
# monitors, temporal-logic / spatio-temporal property tools, scenario and
# falsification frameworks, and safe-control / safe-RL projects that sit at
# the COMPLEMENTARY point in the lifecycle to URML's static validation.
#
# Shared framing (the closest category to URML's own identity): URML
# performs STATIC validation of intent against a capability manifest + a
# safety envelope BEFORE any actuator moves. The runtime-verification /
# safety ecosystem (a) monitors temporal-logic / spatio-temporal properties
# DURING execution (RTAMT, Reelay, Copilot, Ogma, MoonLight), (b) provides
# spec / scenario / falsification machinery to TEST behavior (Scenic,
# VerifAI, esmini), or (c) enforces / benchmarks safety at the control and
# learning level (safe-control-gym, OmniSafe). URML composes WITH them, it
# does not replace them: URML's safety envelope is a set of declared
# properties; a runtime monitor enforces those at runtime while URML rejects
# inadmissible intent before it ever runs. Honest division: URML is static /
# pre-dispatch; these tools are runtime / test-time; together they cover the
# lifecycle. The queued Spec RFC across the wave: a monitorable-property /
# temporal-logic specification attached to the safety envelope.
#
# Discipline: safety/RV is research-heavy (AI-content-close risk per the
# Move #25/#27 lessons), so the live Tier-A favors active repos and the
# wave leans on careful, precise framing for a formal-methods audience.
# Stale (Breach, py-metric-temporal-logic) and folded (safety-gymnasium
# under OmniSafe) are recorded with cause. Per the 2026-06-03 guidance, NO
# RFC or post carries a license-clarification ask.
#
# Already covered, NOT duplicated: the compliance-policy mechanism (RFC-0004),
# connectivity/link-loss safety (RFC-0006), deconfliction volumes (RFC-0291).
#
# Like Moves #2-#27, this file is NOT under the Move #1 parity test. It is
# covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is the
# truthful default. Tier-A rows are DRAFTED (sent_at / posted_url empty)
# until RFCs 0362-0371 land on main; then posted under idoco2003 and
# reconciled. Deferred rows are never posted (channel: deferred).

# ============================================================
# Tier A — live posts (drafted; post after RFCs land on main)
# ============================================================

