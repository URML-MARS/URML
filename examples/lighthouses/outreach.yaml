# Move #1 outreach ledger — one row per Tier-1 lighthouse vendor.
#
# This file is the project's record of what was sent, to whom, when, and
# what (if anything) came back. It is intentionally committed so the
# repo's history reflects outreach state, not maintainer memory.
#
# Phase 0 posture: this is a private working document published in-repo.
# Do not massage `response`/`last_touch` to look more engaged than reality
# — `none` is the truthful default until something concrete arrives.
#
# Schema:
#   slug         — matches examples/lighthouses/demo.py::LIGHTHOUSES key;
#                  the parity test in conformance/tests/test_outreach_ledger.py
#                  enforces slug-set equality.
#   rfc          — integer RFC number (0023..0038).
#   sent_at      — ISO date the outreach was first sent.
#   channel      — how it was sent (e.g. github, email, discussion_comment,
#                  linkedin, in_person). Free-form; document in notes if
#                  the channel changed across touches.
#   contact      — the public handle/address the message was sent to.
#   last_touch   — most recent maintainer action on this vendor (date).
#   response     — none | acked | engaged | declined | wontfix
#                    none      — nothing back yet
#                    acked     — they noticed but said nothing substantive
#                    engaged   — substantive reply / discussion in progress
#                    declined  — polite no
#                    wontfix   — not interested / out of scope on their end
#   next_action  — the maintainer's next planned move; date if relevant.
#   notes        — free-form. Keep facts, not feelings.
#
# To update: edit the row in place; bump `last_touch`; set `response`
# from the enum above; write the next concrete step into `next_action`.

