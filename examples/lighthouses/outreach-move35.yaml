# Move #35 outreach ledger. One row per target.
#
# Move #35: **the mobile-manipulation / service-robot wave.** Civilian / research scope.
# INTEGRATED platform stacks (a whole robot's ROS packages) that combine mobile
# navigation AND manipulation — the cleanest exercise of URML's two core primitive
# families together ("go to the kitchen and pick up the mug" = move_to + grasp).
# Distinct from the manipulation-algorithm wave (Move #27) and the warehouse-AMR
# wave (Move #21). Surfaces verified 2026-06-07 (stars / Issues / license / not
# archived / activity).
#
# Shapes, mapped to existing URML surfaces (no new spec):
#   - Single-arm mobile manipulators: Stretch (0422, anchor), TIAGo (0423,
#     org-anchor; folds tiago_simulation), TurtleBot3+OpenMANIPULATOR (0425),
#     Interbotix LoCoBot (0426, B).
#   - Learned-policy mobile manipulators (wrap a policy in a validated envelope,
#     ties RFC-0417): TidyBot++ (0424), TidyBot ROS (0427, B).
#   - Assistive / service platforms: Care-O-bot (0428, B).
#   - Dual-arm mobile manipulator (ties RFC-0010 bimanual): PR2 (0429, B).
#   - Vendor arm of a mobile manipulator: Kinova ros2_kortex (0430, B).
#
# Anchor-plus-fold: PAL TIAGo (tiago_robot anchor, ref tiago_simulation).
#
# EXCLUDED: fetchrobotics/fetch_ros (CC-BY-NC NonCommercial + defunct), Toyota HSR
# (restricted/partner-only), TurtleBot4 (base-only, no arm), ros_kortex (ROS 1),
# Mobile ALOHA / ALOHA (dormant 24-26mo research reference code),
# b-it-bots/mas_domestic_robotics (GPL-3.0), huggingface/lerobot (ML library, not
# an integrated platform — VLA-wave altitude).
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post the posts-move35.md body under idoco2003
# (all GitHub Issues this wave; no Discussions enabled on these repos), set
# sent_at / posted_url / last_touch, add a posted comment, refresh outreach.db.
# No license-ask anywhere (state license). VIBE.md disclosure up front.

