# Move #23 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #16 (outreach-move16.yaml): the substrate spine (ROS 2 core, DDS,
# SLAM, autopilots).
#
# Move #23 (this file): **the ros2_control / actuation-control stack** —
# the hardware-interface + motion-control layer Move #16 deliberately
# skipped. This is where URML's Layer-1 Hardware Abstraction
# (spec/layer-1-hal/v0.1.0.md) actually lands on actuators: the seam
# between a controller and a real (or simulated) drive.
#
# Altitude discipline: the `ros-controls` GitHub org owns most of the
# relevant repos. Posting 4+ Issues into one org in a day is exactly the
# pattern that has drawn AI-content closes (OVOS / LibreTranslate / QGC /
# Sensirion). So this wave LEADS with one anchor Issue on ros2_control
# (RFC-0319) that names the whole framework family, FOLDS the sibling
# ros-controls repos and the underlying fieldbus libs into the anchor /
# their driver thread, and gives a separate live post only to genuinely
# DISTINCT orgs + mappings: the EtherCAT driver (ICube-Robotics, RFC-0320)
# and the CANopen driver (ros-industrial, RFC-0321).
#
# Already covered, NOT duplicated: ROS 2 core (RFC-0200), MoveIt 2
# (RFC-0202), MoveIt Task Constructor (RFC-0162), ODrive (0169), moteus
# (0170), SimpleFOC (0179), VESC (0180), Dynamixel (0104), ODRI (0076),
# Trinamic (0171). ros2_control composes ABOVE the motor controllers and
# BELOW MoveIt; that is the framing.
#
# Split: 3 live Tier-A posts (3 distinct orgs) + 5 folded/recorded Tier-B
# (ros-controls siblings + the fieldbus master libs) + 1 deferred Tier-C
# (ETG consortium, no GitHub).
#
# Like Moves #2-#22, this file is NOT under the Move #1 parity test. It is
# covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Schema mirrors outreach-move21.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, tier, country,
# sector, comments, claude_directives, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is the
# truthful default. The Tier-A rows are DRAFTED, not yet sent (sent_at and
# posted_url empty): posting waits until RFCs 0319-0321 land on `main`,
# then the founder / an authorized session posts under idoco2003 and
# reconciles sent_at / posted_url / a comment per row. Folded and deferred
# rows are never posted (channel: deferred).

