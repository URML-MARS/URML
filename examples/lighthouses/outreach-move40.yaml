# Move #40 outreach ledger. One row per target.
#
# Move #40: **the developer-tooling / observability wave.** Civilian / research scope.
# Robotics observability / visualization / logging tools. DISTINCT ALTITUDE: URML is
# not a substrate here, it is a DATA SOURCE — every URML dispatch is validated before
# it actuates and emits a structured audit record (intent -> validator verdict + pass
# -> substrate calls). The ask: would the tool ingest/visualize/record that
# validated-intent stream as a first-class source? (Same shape as the Open MCT
# telemetry engagement, RFC-0395.) Surfaces verified 2026-06-12.
#
# Shapes, mapped to existing URML surfaces (no new spec):
#   - Viz platforms (audit stream as a data-source/panel): Lichtblick (0463, anchor;
#     BMW open Foxglove fork), rerun (0464, multimodal timeline), rosboard (0467, B,
#     glanceable web dashboard).
#   - Time-series plotting (envelope-margin / verdict series): PlotJuggler (0465).
#   - On-disk logging format (record the audit trail): foxglove/mcap (0466; refs
#     foxglove-sdk for live streaming).
#   - In-RViz spatial markers (draw validated intent + envelope): rviz_visual_tools
#     (0468, B).
#
# Anchor-plus-fold: foxglove (mcap anchor, refs foxglove-sdk). PlotJuggler core
# (MPL-2.0), NOT the AGPL plotjuggler-ros-plugins.
#
# DEFERRED (likely inside the ROS-2-core footprint, RFC-0200 / Move #16 — avoid
# re-touch): ros2/rosbag2, ros2/rviz, ros-visualization/rqt, ros2/ros2cli,
# ros2/ros2_tracing. Re-check the core ledger before engaging any ros2-org repo.
#
# EXCLUDED: foxglove/studio (ARCHIVED 2024-07, superseded by closed app),
# cruise-automation/webviz (dead 2022), streetscape.gl (dead 2019), MichaelGrupp/evo
# (GPL-3.0 + SLAM, Move #25), plotjuggler-ros-plugins (AGPL; folds under PlotJuggler),
# multimaster_fkie (deprecated), introlab/rtabmap (SLAM, Move #25). DEFER-PRC: none.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the founder
# authorizes posting. Then post the posts-move40.md body under idoco2003 (Discussion
# or Issue per channel), set sent_at / posted_url / last_touch, add a posted comment,
# refresh outreach.db. No license-ask anywhere (all permissive: MPL/Apache/MIT/BSD).
# VIBE.md disclosure up front.

