# Move #16 outreach ledger. One row per target.
#
# Move #16 (this file): **substrate spine — drone autopilot + ROS 2 +
# DDS middleware + SLAM upstreams** (Theme A from the Move-11 backlog
# gap analysis). Last theme to engage from the original backlog.
#
# **URML's biggest wave so far.** Reflects the substrate-spine market
# reality: most substrate maintainers are open-source by definition
# (Linux Foundation Dronecode, Open Robotics Foundation, Eclipse
# Foundation, etc.).
#
# **Identity-load-bearing engagement.** URML's substrate-neutral claim
# has been implicit in prior moves; Move-16 makes it explicit by
# engaging the substrate maintainers themselves. Where Moves #10-15
# engaged sensor / VLA / actuator / vertical layers above the
# substrate, Move #16 engages the substrate-runtime spine URML
# composes above.
#
# Verified 2026-05-28 via two parallel research agents covering drone-
# autopilot + protocol (Agent 1) and ROS 2 + DDS + SLAM (Agent 2),
# cross-checked against all prior ledgers (Moves 1-15).
#
# Engageable set: 16 rows in this ledger (12 Tier A + 4 Tier B). RFC
# numbers reserved 0196-0211 for these 16; each draft is a future
# session (likely 3 batches given the wave size).
#
# Excluded set: 8 candidates were Tier C (most are already-engaged
# duplicates from prior Moves; one archived; one covered via parent
# governance). Full audit trail in
# `examples/lighthouses/move16-research-2026-05-28.md`.
#
# Like Moves #2-#15, this file is NOT under the Move #1 parity test.
# Move #16 RFCs are substrate-spine outreach proposals; the wave is
# research+ledger-stage only in this PR. RFC drafting (16 RFCs ×
# ~1 session each, 3 batches) and Issue posting are future work.
#
# Schema mirrors outreach-move15.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action,
# notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All 16 rows below carry
# `sent_at: ""` and `channel: deferred` until per-target RFCs
# are drafted and engagement is posted on the upstream surface.

