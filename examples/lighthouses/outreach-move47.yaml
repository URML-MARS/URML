# Move #47 outreach ledger. One row per target.
#
# Move #47: **the perception / SLAM / mapping / reconstruction wave** — lane 4
# of the 2026-06-13 free-GitHub candidate search. The fixed posture: URML
# CONSUMES a map or state estimate as input to its capability manifest and
# safety envelope; it does not produce one ("URML doesn't do SLAM, it consumes
# your estimate"). These projects produce the poses, reconstructions, point
# clouds, occupancy, and VIO estimates that a URML deployment resolves its
# frames (RFC-0290) and validates its geofence/occupancy constraints (RFC-0291)
# against. Outreach = request-for-comment describing the consumer relationship.
#
# 11 RFCs (0518-0528) for 12 candidates: nerfstudio + gsplat folded into ONE
# org-anchor RFC (nerfstudio-project, no carpet-bomb). Sub-types:
#   - Reconstruction: nerfstudio/gsplat (0518, anchor), colmap (0519).
#   - Point-cloud / volumetric libs: Open3D (0520), pcl (0521), PDAL (0522,B),
#     openvdb (0523).
#   - SLAM / state estimation: mola (0524, GPL dual), mrpt (0525), symforce
#     (0526, factor-graph engine), patchwork-plusplus (0527,B, ground-seg),
#     okvis2 (0528,B, VIO).
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post posts-move47.md under idoco2003 (all
# GitHub Issues), set sent_at / posted_url / last_touch, add a posted comment,
# flip claude_directives to done, refresh outreach.db. No license-ask anywhere
# (mola core GPL-3.0: state, never ask). VIBE.md disclosure up front. The
# library-altitude RFCs (symforce, patchwork) ask whether that is the right
# altitude. Funnel 507 -> 518 on posting.

