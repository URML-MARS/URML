# Move #14 outreach ledger. One row per target.
#
# Move #14 (this file): **mobile manipulators + commercial humanoids**
# (Theme B from the Move-11 backlog gap analysis). After Move #13 (Theme C
# actuators + embedded + maker, posted via PR #190), founder picked Theme B
# next.
#
# URML's existing humanoid manifest fixtures (apollo_biped, digit_biped,
# figure_biped, neo_biped, optimus_biped) cover the fixture layer per
# RFC-0009 mobility specialization. Move-14 is the corresponding outreach
# wave — but reveals an honest market fact: most commercial humanoid OEMs
# are closed-source (Apptronik, Sanctuary AI, Figure AI, Tesla Optimus —
# no humanoid robot code on GitHub; Agility primary surface archived; BD
# Atlas no separate repo). Only 1X Technologies has vendor-direct active
# public humanoid robot code. URML's mobile-manipulator coverage is
# healthier: Hello Robot, Franka, Kinova, plus 3 stale-but-engageable Tier
# B rows.
#
# Verified 2026-05-28 via two parallel research agents covering mobile-
# manipulator and commercial-humanoid categories, cross-checked against
# all prior ledgers (Moves 1-13).
#
# Engageable set: 7 rows in this ledger (4 Tier A vendor-direct + 3 Tier B
# research-collab / cross-citation with caveats). RFC numbers reserved
# 0184-0190 for these 7; each draft is a future session.
#
# **Smaller than prior moves intentionally.** Theme B's engageable surface
# is genuinely thinner because commercial humanoid OEMs are predominantly
# closed-source. URML's wave engages where the surface exists.
#
# Excluded set: 6 candidates were Tier C (excluded with cause: 0 public
# repos × 2 — Apptronik, Sanctuary AI; no humanoid robot code × 2 —
# Figure AI, Tesla Optimus; archived primary surface × 1 — Agility
# Robotics; already-engaged × 1 — Boston Dynamics Atlas via Spot RFC-0043).
# Full audit trail in
# `examples/lighthouses/move14-research-2026-05-28.md`.
#
# Like Moves #2-#13, this file is NOT under the Move #1 parity test.
# Move #14 RFCs are mobile-manipulator + humanoid outreach proposals; the
# wave is research+ledger-stage only in this PR. RFC drafting (7 RFCs ×
# ~1 session each, likely 1-2 batches) and Issue/Discussion posting are
# future work.
#
# Schema mirrors outreach-move13.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action,
# notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All 7 rows below carry
# `sent_at: ""` and `channel: deferred` until per-target RFCs
# are drafted and engagement is posted on the upstream surface.

