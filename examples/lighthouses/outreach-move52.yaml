# Move #52 outreach ledger. One row per target.
#
# Move #52: **the education / competition wave (round 2)** — lane B of the
# 2026-06-13 second candidate slate. Student/competition robotics: FRC/FTC
# SDKs + motion tools + a VPL peer + beginner edu robots. 10 RFCs (0566-0575).
# Framing: URML is the typed-intent + English front door for student robots
# (educational profile RFC-0011), and the consume-the-output layer for the
# motion/vision tools (RFC-0020 consume-the-trajectory; Move #25
# consume-the-estimate). URML does not plan, optimize, or do vision; it
# declares, validates, and consumes. Outreach = request-for-comment; no ask to
# adopt, host, or maintain anything.
#
# Targets / framing:
#   - ftc-robotcontroller (0566, anchor, US): FTC robot-control SDK -> typed
#     intent + English layer above an op-mode (RFC-0011).
#   - pathplanner (0567, US): FRC path planning -> declare/validate/consume the
#     path (RFC-0020).
#   - photonvision (0568, US): FRC/FTC vision -> consume the estimate (Move
#     #25); GPL-3.0 cross-citation only.
#   - choreo (0569, US): FRC trajectory optimizer -> consume the optimized
#     trajectory (RFC-0020).
#   - road-runner (0570, US): FTC motion planning -> declare/validate/consume
#     (RFC-0020).
#   - libwallaby (0571, US): KIPR/Botball control library -> typed intent +
#     English layer; GPL-3.0 cross-citation only.
#   - gopigo3 (0572, US): RPi beginner robot -> English-to-validated-intent
#     front door; non-standard license, no code reuse.
#   - blockly (0573, UK): RPi Foundation Blockly VPL -> language peer; could a
#     block palette emit URML; conceptual, no integration ask.
#   - tank-royale (0574, DK): Robocode successor programming game -> lighter
#     conceptual note on declarative intent as a teaching on-ramp.
#   - create3-docs (0575, US): iRobot Create 3 edu robot (ROS 2) -> English
#     front door over the ROS 2 action set. Completes the wave.
#
# POSTED 2026-06-14 under idoco2003 (all GitHub Issues). No license-ask
# anywhere (each repo's actual license stated, never asked; GPL/non-standard ->
# no code reuse). VIBE.md disclosure up front. Funnel 556 -> 566. All rows
# response: none, awaiting maintainer reply.

