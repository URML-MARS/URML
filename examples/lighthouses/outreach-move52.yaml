      text: "Posted the RFC-0569 body to https://github.com/SleipnirGroup/Choreo/issues/1493 under idoco2003. Consume the optimized trajectory (RFC-0020). Awaiting response."
    - date: "2026-06-14"
      text: "shueja (maintainer) replied substantively (thread OPEN, not closed), engaged-but-skeptical: (a) target TrajoptLib (the backend lib) not Choreo (the app); (b) TrajoptLib is an OFFLINE once-per-run optimizer, not real-time, and 'move from A through B,C to D' not a move_to; runtime regeneration would stall the robot; a robot not starting at A makes feedback violate the pregenerated constraints; concluded 'I don't really see TrajoptLib fitting well as something URML can query.' His objection is to a RUNTIME-QUERY model URML never proposed. Replied with the reframe: URML sits AROUND the offline run (consume-trajectory RFC-0020), not inside it; two offline seams = typed/validated declaration of goal+waypoints+kinodynamic limits (RFC-0518) feeding TrajoptLib's once-per-run params, and validation of the pregenerated trajectory vs the robot's manifest+envelope before execution. That output check directly targets his 'robot not at A' failure mode (catch the mismatch statically vs as runtime instability). Led with consume-trajectory, dropped move_to; agreed TrajoptLib is the right layer."
  claude_directives:
    - date: "2026-06-14"
      text: "DONE — posted as SleipnirGroup/Choreo#1493 on 2026-06-14 under idoco2003."
      status: done
  next_action: "Engaged (shueja, OPEN thread). Reframe reply posted 2026-06-14 (URML wraps the offline optimizer: type its inputs, validate its outputs vs the robot; NOT a runtime query). Await whether the reframe lands. If he bites, the concrete artifact is a worked example: a URML declaration -> TrajoptLib path params, + validate the returned trajectory vs an FRC robot manifest (RFC-0518 kinodynamic limits). Lesson reinforced: lead planners/optimizers with consume-trajectory + validate-admissibility, never move_to (it reads as runtime querying)."

