# Move #25 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #16 (outreach-move16.yaml): the substrate spine, including the first
# SLAM upstreams (Cartographer RFC-0205, ORB-SLAM3 RFC-0206, RTAB-Map
# RFC-0207, Stella VSLAM RFC-0211).
#
# Move #25 (this file): **SLAM and state estimation, round 2**. The
# localization / mapping / sensor-fusion substrate that produces the pose
# and map estimate URML's `frames` and `declared_locations` are expressed
# against. URML does NOT do SLAM; it CONSUMES the estimate and statically
# validates intent against the resulting world model BEFORE dispatch. The
# mapping is a frame / pose-source alignment (REP-105), with covariance /
# quality as a candidate safety-envelope input. Cross-link RFC-0290
# (frame-transform graph) and RFC-0006 (connectivity).
#
# Already covered, NOT duplicated: Cartographer (RFC-0205), ORB-SLAM3
# (RFC-0206), RTAB-Map (RFC-0207), Stella VSLAM (RFC-0211); perception
# sensor vendors (Move #10).
#
# Altitude / AI-close-risk discipline: SLAM is heavy on single-author
# academic repos, which are the kind that have closed outreach as
# AI-content elsewhere (OVOS / QGC / LibreTranslate). So the 10 Tier-A
# live posts FAVOR active, infrastructure-grade or responsive-lab repos
# (robot_localization, GTSAM, OctoMap, Ceres, fuse, OpenVINS, KISS-ICP,
# GLIM, DLIO, Kimera). The most famous but stale / single-author headliners
# (FAST-LIO, LIO-SAM, VINS-Fusion) are DEFERRED to Tier B with cause
# (15-24 months stale): cold-posting a dormant single-author research repo
# is low-yield and close-prone. Recorded, graduate on demand.
#
# Like Moves #2-#24, this file is NOT under the Move #1 parity test. It is
# covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Schema mirrors outreach-move24.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, tier, country,
# sector, comments, claude_directives, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is the
# truthful default. Tier-A rows are DRAFTED (sent_at / posted_url empty)
# until RFCs 0332-0341 land on main; then posted under idoco2003 and
# reconciled. Deferred rows are never posted (channel: deferred).

# ============================================================
# Tier A — live posts (drafted; post after RFCs land on main)
# ============================================================

