    - date: "2026-06-29"
      text: "macmacal (CONTRIBUTOR) gave a substantive, correct answer to both questions on #44. Q1: in ros2_control the limits/params live in the URDF and the hardware interface just exchanges I/O; if there is a need to interpret whether an object was grasped, an additional abstraction layer 'could indeed be useful within a larger system' (affirms URML's system-level layer). Q2: yes, the URDF capability manifest covers the params; serial / UR-tool-comm backends look the same from a higher layer, BUT the fake-hardware backend does not simulate force feedback (position only). Promoted to engaged. Replied under idoco2003 (#44 comment 4833621896): URML is additive (reads the same URDF numbers, refuses an out-of-envelope grasp pre-dispatch), the admissible-vs-succeeded distinction is his, the pre-dispatch check behaves identically across backends so the fake-hw feedback gap only affects the runtime interpretation layer; offered a small worked example (Hand-E manifest + a validated grasp + a refused over-force grasp)."
    - date: "2026-07-03"
      text: "BUILT the offered worked example: examples/robotiq-hande/ (PR #582, merged to main). Hand-E declared as a single-DoF servo_electric gripper, 20-185 N force envelope; validates a 60 N grasp (accepted) and refuses a 250 N grasp pre-dispatch on two grounds (capability.missing_gripper + envelope.force_exceeded). Hermetic, byte-asserted, no new primitives. Notified macmacal on #44 (comment 4878554213) with the link + the honest no-explicit-aperture-field note + the additive-to-ros2_control framing made concrete. Engagement -> build -> notify loop closed."
