# Move #60 outreach ledger. One row per target.
#
# Move #60: **robotic end-effectors at the grasp-envelope seam** -- a second
# fresh disciplined cold wave (after Move #59), a different lane: grippers and
# multi-fingered hands. Sourced 2026-06-21; the densest of three lanes searched
# (end-effectors / animatronics / camera-moco). The end-effector lane has the
# tightest URML fit in the whole corpus: a force/aperture envelope gating a
# grasp IS the safety-envelope seam, and it lands directly on RFC-0586 (the
# `dexterous` gripper kind + `grasp_type`) and the grasp primitive.
#
# 6 net-new, high-fit, non-PRC, licensed, active targets. Two groups:
#
#   Dexterous multi-fingered hands (map onto RFC-0586 dexterity declaration):
#   - aero-hand-open (0624, anchor, US TetherIA, Apache-2.0 SDK): tendon-driven
#     multi-DoF hand + Python SDK + ESP32 + ROS2. Strongest (756 stars). The
#     hardware/CAD is CC-BY-NC-SA; URML relates to the Apache-2.0 SDK.
#   - orca_core (0625, CH ETH Zurich SRL, MIT): 17-DoF tendon hand control core.
#   - BiDexHand (0626, US, MIT): 16-DoF cable-driven hand w/ fingertip FORCE
#     sensing -> static grasp-force envelope COMPLEMENTS runtime sensing (Move
#     #28 framing).
#
#   Parallel grippers (the base single-DoF gripper case, aperture + force):
#   - robotiq_hande_driver (0627, PL AGH Krakow, Apache-2.0): ros2_control driver
#     for the Robotiq Hand-E.
#   - onrobot-ros2 (0628, HU Obuda U., MIT): RG2/RG6 controller, Isaac Sim +
#     hardware -> one manifest validates sim and real (declare-once-validate-
#     everywhere).
#   - ros2_RobotiqGripper (0629, GB Cranfield, Apache-2.0): service-level Robotiq
#     2F interface on UR arms -> combined arm-plus-gripper manifest. Completes
#     the wave.
#
# No license-ask anywhere (every target has a LICENSE; permissive stated plainly).
# VIBE.md disclosure up front; per-target body variation; em-dash-free titles.
# DRAFTED 2026-06-21, NOT YET POSTED (sent_at / posted_url empty, all rows
# response: none). Funnel 609 -> 615 when posted.
#
# DROPPED for cause during sourcing (do not re-source): PickNikRobotics/
# ros2_robotiq_gripper (PickNik org already engaged 2x, RFC-0434/0468 -- one-org
# discipline); tonydle/OnRobot_ROS2_Driver (origin unconfirmed; ABC-iRobotics
# covers OnRobot); iotdesignshop/dexhand_gesture_controller (pushed 2024-05,
# ~25mo stale); NMMI/ROS-SoftHand (2021, dead); SAKErobotics/EZGripper (NO
# license file + 2022 stale); DH Robotics ecosystem (PRC); HEBI (engaged
# RFC-0070), Pollen/Reachy (RFC-0240), LEAP/Shadow/dexterous (Move #27, RFC-0586)
# all already touched. The OTHER two lanes searched are BANKED for a future wave:
# animatronics/expressive (Sesame Robot, Blossom/Cornell, InMoov_ROS2) +
# camera-moco (obs-ptz, storm32bgc) -- thin but real, ~5 durable targets.

