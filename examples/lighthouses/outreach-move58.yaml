# Move #58 outreach ledger. One row per target.
#
# Move #58: **the edge-AI / on-robot-inference wave** — lane C of the
# 2026-06-14 third candidate slate, the LAST lane (exhausts the slate). 5 RFCs
# (0610-0614); automatika emos folded into embodied-agents (0610). HELD BACK
# the big-org / robotics-incidental targets the slate surfaced (microsoft/
# onnxruntime 20.8k*, apache/tvm 13.5k*, sony/nnabla) -- general ML infra where
# robotics is incidental + giant maintainer teams = spam / wrong-audience risk
# (cf. the PDAL geospatial close). Founder can greenlight those big-name shots
# deliberately later. DROPPED bentoml (serving altitude generic). No padding.
# Framing: URML CONSUMES the inference output (it does not run inference) and
# GATES the action it informs (the five-pass validation seam between a model's
# proposed action and actuation); for deployed/trained models, RFC-0383 (the
# artifact/policy declares its envelope). Outreach = request-for-comment.
#
# Targets / framing:
#   - embodied-agents (0610, anchor, GB/EU, fold emos): ROS2 local LLM/VLM/VLA
#     -> ros2_control/MoveIt Servo -> URML the validated gate between proposed
#     action and actuation; a VLA could emit URML. STRONGEST fit. MIT.
#   - yolo_ros (0611, ES): maintained ROS2 YOLO -> consume detections (Move #25);
#     classes toward object vocabulary. GPL-3.0 cross-cite.
#   - kenning (0612, PL/Antmicro): edge-AI deploy/optimize w/ ROS2 CV nodes ->
#     gate the action; deployed artifact carries an envelope (RFC-0383). Apache.
#   - hailo_tappas_ros2 (0613, US/indiv): Hailo NPU on-edge inference -> consume
#     the estimate; clean separation matters on a fixed accelerator pipeline.
#     Apache.
#   - opencv_zoo (0614, US/intl): edge OpenCV-DNN model zoo -> consume a zoo
#     model's estimate (Move #25); robotics SUBSET only, not the whole project.
#     Apache. Completes the wave + the third candidate slate.
#
# POSTED 2026-06-15 under idoco2003 (all GitHub Issues). No license-ask
# anywhere (MIT/Apache stated; yolo_ros GPL cross-cite, no code reuse). VIBE.md
# disclosure up front; per-target body variation. Funnel 599 -> 604. All rows
# response: none, awaiting maintainer reply. Completes the third candidate slate.

