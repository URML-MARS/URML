# proposed action and actuation); for deployed/trained models, RFC-0383 (the
# artifact/policy declares its envelope). Outreach = request-for-comment.
#
# Targets / framing:
#   - embodied-agents (0610, anchor, GB/EU, fold emos): ROS2 local LLM/VLM/VLA
#     -> ros2_control/MoveIt Servo -> URML the validated gate between proposed
#     action and actuation; a VLA could emit URML. STRONGEST fit. MIT.
#   - yolo_ros (0611, ES): maintained ROS2 YOLO -> consume detections (Move #25);
#     classes toward object vocabulary. GPL-3.0 cross-cite.
#   - kenning (0612, PL/Antmicro): edge-AI deploy/optimize w/ ROS2 CV nodes ->
#     gate the action; deployed artifact carries an envelope (RFC-0383). Apache.
#   - hailo_tappas_ros2 (0613, US/indiv): Hailo NPU on-edge inference -> consume
#     the estimate; clean separation matters on a fixed accelerator pipeline.
#     Apache.
#   - opencv_zoo (0614, US/intl): edge OpenCV-DNN model zoo -> consume a zoo
#     model's estimate (Move #25); robotics SUBSET only, not the whole project.
#     Apache. Completes the wave + the third candidate slate.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post posts-move58.md under idoco2003 (all
# GitHub Issues), set sent_at / posted_url / last_touch, add a posted comment,
# flip claude_directives to done, refresh outreach.db. No license-ask anywhere
