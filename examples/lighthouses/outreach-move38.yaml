      text: "sepnasiriany (RoboCasa CONTRIBUTOR; Soroush Nasiriany) replied constructively on the closed #200, promoting to engaged. Two gifts: (1) reframed honestly - a sim benchmark learns policies end-to-end and has no actuation gate, so validate-before-actuate is a deployment concern, BUT an explicit capability/safety envelope is 'a useful eval lens (e.g. flagging out-of-distribution or out-of-capability instructions)'; (2) handed the manifest spec - Franka Panda 7-DOF arm on an Omron mobile base, parallel-jaw gripper, EEF(pos+rot)+base-motion+gripper action space, workspace = kitchen-scene reachability, vocab = atomic/composite task set + graspable object categories, with 'most of this is in the env/robot configs if you want exact numbers'. Built examples/robocasa/ (PR #531): the eval lens he named, no new primitives - a manifest from his spec + a worked example validating instructions (in-capability PASS; out-of-distribution object/place and out-of-capability force/modality FLAGGED before any policy runs). Replied under idoco2003 (#200 comment 4785926985) pointing at it and taking up his offer of exact config numbers."
    - date: "2026-06-24"
      text: "Third comment from sepnasiriany (continued engagement): a forward-looking heads-up that RoboCasa will soon release SUBTASK ANNOTATIONS for composite tasks, offered as something that 'might make your job easier'. It does: a composite instruction is exactly a sequence of atomic URML primitives, so the annotations let the eval lens walk a composite and flag WHICH subtask is out-of-capability / out-of-distribution (not just whole-instruction pass/flag), and give the manifest's task vocabulary a real source to align to (their atomic+composite set) instead of a hand-picked list. Replied under idoco2003 (#200 comment 4787387942): asked him to ping the thread when they land, and committed to wire examples/robocasa/ to consume them."
