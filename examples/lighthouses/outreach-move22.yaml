# Move #22 outreach ledger. One row per target.
#
# Move #22 (this file): **the communication-layer wave.** Targets the
# communication surfaces URML had not yet engaged, after a coverage check
# ruled out what is already done: the DDS/transport spine (Move #16:
# Fast DDS, Cyclone DDS, Zenoh, iceoryx, MAVLink, DroneCAN, ROS 2 core),
# fleet interop (Move #21: VDA5050, InOrbit/MassRobotics, openTCS; Move #2
# Open-RMF), agent comms (RFC-0048 MCP), and most speech/dialogue
# (Move #12). Vosk + Silero stay excluded (Russia-domiciled, US-alignment
# posture) and are NOT revisited.
#
# Four slices, RFCs 0306-0318. The pitch is constant: URML composes
# ABOVE each communication surface as the plain-language intent layer;
# it never embeds, forks, or vendors the transport. License frictions
# (EMQX BSL, UA-.NETStandard RCL, LCM/opcua-asyncio LGPL, milo/mosquitto
# EPL) are stated in-RFC and resolved by client/IPC-boundary integration.
#
#   Slice 1 - web/teleop/viz bridges: rosbridge_suite, webrtc_ros
#   Slice 2 - alt transports/messaging: micro-ROS, eCAL, LCM, Mosquitto, EMQX
#   Slice 3 - industrial/OPC UA: open62541, UA-.NETStandard, Eclipse Milo, opcua-asyncio
#   Slice 4 - human-robot dialogue (net-new only): openWakeWord, Rasa
#
# Surfaces verified 2026-06-01 via the GitHub API (license, stars,
# has_issues, isArchived, last push). Research note:
# examples/lighthouses/move22-research-2026-06-01.md.
#
# Like Moves #2-#21, this file is NOT under the Move #1 parity test
# (conformance/tests/test_outreach_ledger.py guards Move #1 only). It is
# under the schema-v2 conformance test (RFC-0275).
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is
# the truthful default. All 13 rows posted live on 2026-06-02 under
# idoco2003 (response: none pending replies). Per-row state changes are
# founder-authorized.

