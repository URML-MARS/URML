#
# Move #33: **the agriculture / farm-robotics wave.** Civilian / research scope.
# Surfaces verified 2026-06-06 (stars / Issues+Discussions / license / not
# archived / activity). The open ag-robotics surface is MODERATELY THIN: most
# ag-robot vendors (Naio, Carbon, FarmWise, Ecorobotix, Bonirob/Bosch) are
# proprietary with no public repos (excluded). ~8 quality engageable targets,
# anchored by FarmBot (mature open CNC farming) and the L-CAS / Agri-OpenCore
# academic cluster.
#
# Shapes, mapped to existing URML surfaces (no new spec):
#   - Open farm platforms: FarmBot (0404, non-ROS — bind sequences via
#     call_program; anchor, folds Web-App), farm-ng Amiga (0405, gRPC+ROS),
#     PRBonn AgriBot (0410), smart_diffbot (0411, Nav2 GNSS, Tier B).
#   - ROS 2 ag control stack: FarmBot-ROS2 (0409, org-anchor on interfaces).
#   - Ag sims URML drives via the ROS 2 bridge (ties RFC-0381): CropCraft
#     (0406), Agri-OpenCore tomato glasshouse digital twin (0408, L-CAS anchor).
#   - Perception+actuation device (detect-then-spray): OpenWeedLocator (0407).
#
# Anchor-plus-fold: FarmBot (farmbot_os anchor, ref Web-App); L-CAS
# (aoc_tomato_farm anchor, ref Qualicrop/hunter_with_arm); farmbot-ros
# (interfaces anchor, ref the module repos).
#
# EXCLUDED: closed vendors (Naio/Carbon/FarmWise/Ecorobotix/Bosch); ros-agriculture
# org (stale, flagship archived); OpenAg (defunct); student one-offs.
# DEFERRED: FieldRobotEvent/virtual_maize_field (GPL-3.0 + FieldRobotEvent
# already touched a prior wave).
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post the posts-move33.md body under idoco2003
# (Discussion or Issue per channel), set sent_at / posted_url / last_touch, add
# a posted comment, refresh outreach.db. No license-ask anywhere (state license;
# all permissive except none here non-permissive). VIBE.md disclosure up front.

