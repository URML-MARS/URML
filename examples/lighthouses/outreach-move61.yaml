# Move #61 outreach ledger. One row per target.
#
# Move #61: **net-new VLA / robot-foundation models + university robotics labs.**
# Sourced 2026-06-25 (two research passes), deduped against the full ledger.
# The fit filter for the model lane: NOT general chat LLMs (the URML bridge is
# already provider-agnostic) but Vision-Language-Action / robot-foundation /
# embodied-policy models that EMIT physical robot action, where validate-before-
# actuate has a surface. Per the volume-vs-depth caution, this is a small
# high-fit wave: US/allied-origin models only (PRC-origin VLA models deferred per
# the RFC-0003 vendor-deferral pattern). All six targets posted under idoco2003 as
# GitHub issues (founder's call: reach the labs via GitHub so the maintainers get
# a notification, rather than cold email; Gmail drafts were prepared then superseded).
#
# VLA / robot-foundation models (RFCs 0632-0634):
#   - magma (0632, anchor, US MSR): multimodal agentic foundation model -> action.
#   - navila (0633, US UCSD/NVIDIA): legged-nav VLA -> locomotion-policy seam (RFC-0384).
#   - emma-x (0634, SG SUTD): grounded-CoT action model -> validate the sequence.
#
# University research labs (RFCs 0635-0637):
#   - bremen-cram (0635, DE Beetz): cognitive architecture -> action-designator seam.
#   - brown-lang2ltl (0636, US Tellex): NL -> LTL spec -> validate dispatched action.
#   - stanford-voxposer (0637, US Huang): zero-shot NL -> trajectory -> check before move.
#
# PRC tranche added 2026-08-18 (RFCs 0673-0676): the founder authorized a small
# batch of the strongest, most-active PRC open-weight VLA repos, deferred above.
# Open-weight research models, cross-citation only, no vendor coupling (outreach
# is not a spec/policy change; the default US-federal policy is untouched). Each
# RFC is grounded in that model's specific action output:
#   - dexbotic (0673, Dexmal): VLA deployment toolbox -> per-robot gate in the deploy path.
#   - robobrain-2-5 (0674, BAAI): 3D keypoint-trace prediction -> validate the trace vs workspace/envelope.
#   - univla (0675, Shanghai AI Lab): embodiment-agnostic action -> per-embodiment admissibility at decode.
#   - rynnvla-002 (0676, Alibaba DAMO): continuous action for LeRobot arms -> gate the emitted action.

