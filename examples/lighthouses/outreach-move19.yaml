# Move #19 outreach ledger. One row per target.
#
# Move #19 (this file): **the education-community wave.** Moves 1-16
# asked "which vendor could write an adapter"; Move #17 engaged
# governance bodies; Move #18 broke the robot-vendor frame. Move #19
# asks: "where do the next students meet a robot, and who teaches
# them?" The answer is not a device vendor. It is the classroom
# programming-environment and curriculum layer.
#
# This is deliberately distinct from the device-toolchain threads on
# Move #18 that declined: PROS/VEX (RFC-0236) and Pybricks/LEGO
# (RFC-0235) are device SDKs. Move #19 targets the *environment /
# curriculum* layer above them, a different audience and a different
# ask (URML as a plain-language, validated-intent front door and a
# teaching bridge, not "ship our adapter into your SDK").
#
# Tier A (this file, RFCs 0287-0289) — GitHub-routable classroom
# programming environments:
#   - Open Roberta Lab (Fraunhofer IAIS, Apache-2.0): NEPO blocks over
#     LEGO / micro:bit / Thymio — the exact platforms URML's edu-runtime
#     already drives.
#   - Microsoft MakeCode (microsoft/pxt, MIT): the highest-reach
#     micro:bit authoring environment; complements the micro:bit
#     Foundation thread (RFC-0172) at the IDE layer.
#   - Snap! (jmoenig/Snap, AGPL-3.0): UC Berkeley BJC high-school CS
#     curriculum; cross-citation + lesson bridge (AGPL boundary).
#
# Tier B — partnership / email / forum education orgs (FIRST, REC
# Foundation, RoboCup Junior, Raspberry Pi Foundation / CoderDojo) are
# NOT GitHub-routable and are drafted in founder-actions-move19.md for
# founder posting, mirroring the Move #17 sub-wave-B precedent. They are
# not ledgered here until shaped and sent.
#
# Surfaces verified 2026-05-31 via GitHub API (license, stars,
# has_issues, isArchived, last push). All three: Issues enabled,
# Discussions disabled, not archived, active.
#
# Like Moves #2-#18, this file is NOT under the Move #1 parity test
# (conformance/tests/test_outreach_ledger.py guards Move #1 only). It is
# under the schema-v2 conformance test (RFC-0275).
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is
# the truthful default. All three rows are DRAFTED, not yet posted;
# posting and per-row state changes are founder-authorized.

