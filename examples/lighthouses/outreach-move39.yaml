# Move #39 outreach ledger. One row per target.
#
# Move #39: **the robot-description / interop-formats wave.** Civilian / research scope.
# Robot-description formats (URDF, SDFormat) + the kinematics/parsing libraries that
# consume them. Fresh on-thesis angle: URML's CAPABILITY MANIFEST sits ALONGSIDE a
# robot's DESCRIPTION and could derive/cross-check fields from it (reach, DOF, joint
# limits) while declaring what description omits (payload, graspable classes, safety
# envelope). The ask: where should the description/capability boundary sit.
# Surfaces verified 2026-06-07.
#
# Shapes, mapped to existing URML surfaces (no new spec):
#   - Description formats (conceptual peers to the manifest): SDFormat (0456),
#     URDF tooling/urdfdom (0457, anchor-folds urdfdom_headers/xacro/robot_state_publisher).
#   - Description aggregators / parsers / kinematics libs (derive/cross-check manifest):
#     robot_descriptions.py (0455, anchor), iDynTree (0458), urdf-loaders (0459),
#     yourdfpy (0460, B), Orocos KDL (0461, B), urchin (0462, B).
#
# Anchor-plus-fold: URDF tooling (urdfdom anchor; refs urdfdom_headers/xacro/
# robot_state_publisher). urchin refs sibling yourdfpy.
#
# ALREADY ENGAGED / FLAG (excluded, cross-checked vs ledgers): RobotLocomotion/drake
# (Move #2), google-deepmind/mujoco (Move #2) + mujoco_menagerie (DeepMind),
# stack-of-tasks/pinocchio (Move #26 wontfix nim65s), petercorke/robotics-toolbox-python
# (Move #6), Rhoban/placo (Move #27 ENGAGED), gazebosim/gz-sim (OSRF/Gazebo prior),
# kscalelabs/* (Move #29).
#
# EXCLUDED: bulletphysics/bullet3 (Issues disabled), mmatl/urdfpy (unmaintained;
# successor urchin engaged), PixarAnimationStudios/OpenUSD (CLA + graphics-first;
# robotics-USD better via Alliance-for-OpenUSD / ASF usd-wg), trimesh (off-altitude
# geometry infra). DEFER-PRC: none this wave.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the
# founder authorizes posting. Then post the posts-move39.md body under idoco2003
# (Discussion or Issue per channel), set sent_at / posted_url / last_touch, add a
# posted comment, refresh outreach.db. No license-ask anywhere (KDL is LGPL-2.1 —
# state, no change ask). VIBE.md disclosure up front.

