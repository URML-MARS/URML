# Move #18 outreach ledger. One row per target.
#
# Move #18 (this file): **the frame-break wave** — adoption surfaces
# outside the conventional robot-vendor mental model that every prior
# move assumed. Moves 1-16 asked "which vendor could write an adapter";
# Move #17 engaged governance bodies for a foundation home. Move #18
# asks a different question: "what is a robot, and where does intent
# come from, if we stop assuming a robot-OEM lens?"
#
# Numbering note: Move #17 (the government foundation-home wave) reserves
# RFCs 0212-0226. This frame-break wave therefore starts at 0227.
#
# Batch 1 (0227-0230) — four reframes, one target each:
#   - things that are robots but nobody files under "robot"
#       (Klipper: a 3D printer / CNC gantry is a motion platform; G-code
#       is a motion substrate)
#   - where the *next* roboticists are, not where vendors are
#       (WPILib: the FIRST Robotics education on-ramp)
#   - research micro-platforms with clean demos
#       (Crazyflie: open nano-drone; multirotor already fits)
#   - alternative intent inputs beside Layer-4 natural language
#       (OpenBCI / BrainFlow: a BCI intent signal as an input-bridge)
#
# Batch 2 (0231-0234) — motion-control + sim cluster: Marlin (3D-printer /
# CNC firmware, GPL-3.0); OctoPrint (3D-printer host, AGPL-3.0);
# LinuxCNC (CNC controller, GPL-2.0); Webots (open-source sim
# substrate, Apache-2.0).
#
# Batch 3 (0235-0240) — education + humanoid platforms: PyBricks
# (LEGO MicroPython, Other license, Issues-off on main repo);
# PROS-VEX (Purdue VEX V5 toolchain, Other license); naoqi_driver
# (NAO / SoftBank, Apache-2.0, stale ~1.5 yr); pepper_dcm_robot
# (Pepper / SoftBank, license=none, stale ~3 yr — TIER C noted);
# Poppy Humanoid (open-hardware research, license=none, stale ~4.5 yr);
# Reachy 2 SDK (Pollen Robotics, Apache-2.0).
#
# Batch 4 (0241-0242) — conceptual peers: Open Interpreter (NL-to-
# computer-control, AGPL-3.0, 63.7k stars); Viam RDK (modular
# robotics framework, AGPL-3.0, Issues-off — Discord-first).
#
# Verified 2026-05-29 via GitHub API (license, stars, has_issues,
# isArchived, last push) per target. License-friction shapes recorded
# per row. Stale-substrate friction noted where last push exceeds 12
# months.
#
# Like Moves #2-#17, this file is NOT under the Move #1 parity test
# (conformance/tests/test_outreach_ledger.py guards Move #1 only).
#
# Schema mirrors outreach-move16.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action,
# notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is
# the truthful default.
#
# Reconciliation 2026-05-31: eight batch 2-4 rows were posted live under
# idoco2003 on 2026-05-29 and now carry their real posted_url / response
# (marlin wontfix; linuxcnc engaged; pros-vex + pybricks declined;
# openbci-brainflow acked via welcome-bot; naoqi-driver / reachy /
# open-interpreter none-pending). Rows still `channel: deferred` /
# `sent_at: ""` are NOT yet posted (webots posting hit a FORBIDDEN, held
# for the founder; octoprint / poppy-humanoid / viam-rdk held; batch-1
# klipper / wpilib / crazyflie tracked in the founder's parallel pass).
# Posting and per-row state changes are founder-authorized.

