# Move #11 outreach ledger. One row per target.
#
# Move #11 (this file): **net-new VLA / robot foundation-model targets**
# (post Move #2). After Move #10 (perception wave, 28 posts live 2026-05-28),
# the gap-analysis surfaced six themes; founder picked Theme F (VLA /
# foundation models) for Move #11. Move #2 (2026-05-23) already posted to
# 21 AI/ML-layer targets with response: none across the board (one engaged,
# one declined); Move #11 is the **net-new** layer — VLAs / robot foundation
# models that have emerged since Move-2 or that Move-2 didn't reach.
#
# Verified 2026-05-28 via two parallel research agents covering 11
# category-groups (generalist VLAs, diffusion-policy lineage,
# dexterous-manipulation VLAs, NVIDIA newer lines, HuggingFace robotics
# broader, Allen AI broader, Boston Dynamics AI Institute / RAI,
# Google DeepMind robotics, Toyota Research broader, Microsoft / Apple
# corporate, Singapore / allied research + OpenMind OS + 2026-Q2 newer).
#
# Engageable set: 15 rows in this ledger (9 Tier A vendor-style /
# research-lab-direct + 6 Tier B research-collab / cross-citation with
# caveats). RFC numbers reserved 0138-0152 for these 15; each draft is a
# future session.
#
# Excluded set: 7 candidates were Tier C (excluded with cause: PRC-
# domiciled per NDAA Section 889 — Psi-Robot/DexGraspVLA, InternRobotics,
# HorizonRobotics; HK-origin gray area — SageCao1125/Mamba-Policy;
# already engaged in Move-2 RFC-0050 — NVIDIA/Isaac-GR00T,
# isaac-sim/IsaacLab; superseded — OpenMind/OM1-OTA replaced by
# OpenMind/OM1 flagship). Full audit trail in
# `examples/lighthouses/vla-net-new-research-2026-05-28.md`.
#
# Like Moves #2-#10, this file is NOT under the Move #1 parity test.
# Move #11 RFCs are VLA / foundation-model outreach proposals; the wave
# is research+ledger-stage only in this PR. RFC drafting (15 RFCs ×
# ~1 session each) and Issue/Discussion posting are future work.
#
# Schema mirrors outreach-move10.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action,
# notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All 15 rows below carry
# `sent_at: ""` and `channel: deferred` until per-target RFCs
# are drafted and engagement is posted on the upstream surface.

