# Move #59 outreach ledger. One row per target.
#
# Move #59: **physical-actuation consumers at the safety-envelope seam** -- a
# fresh, disciplined cold wave after the three candidate slates were exhausted
# (Moves #44-58). Sourced 2026-06-21 by three parallel research agents across
# construction/mining, field/outdoor, and rehab/exo lanes. Construction/mining
# came back genuinely closed for cold outreach (every viable target is a closed
# vendor or collides with already-engaged Autoware) and was dropped, confirming
# Move #15. The clean yield was 6 high-fit, net-new, non-PRC, licensed,
# actuation-altitude targets across two sub-lanes. No padding.
#
# Two sub-lanes, one shared URML fit: a manifest declares the device's actuation
# limits (joint torque/position for the wearables, drive envelope for the mobile
# platforms) and URML validates the intent BEFORE the device moves.
#
#   Wearable-and-assistive (the safety envelope is load-bearing on a
#   person-coupled device):
#   - CORC (0618, anchor, AU U.Melbourne, Apache-2.0): CANopen exo/rehab control
#     -> declare subtask goal + joint torque/position envelope, validate before
#     actuation. Best fit; the envelope is the whole point.
#   - opensourceleg (0619, US U.Michigan, LGPL-2.1): powered-prosthesis SDK ->
#     lift the leg's declared joint/torque limits into a checked envelope.
#     Layering only (LGPL).
#   - epically-powerful (0620, US Georgia Tech, AGPL-3.0): QDD-over-CAN exo
#     actuator framework w/ runtime safety monitoring -> static pre-dispatch
#     envelope COMPLEMENTS the runtime monitor (Move #28 framing). Cross-cite.
#
#   Outdoor-mobile (drive envelope on an outdoor machine near people):
#   - open_mower_ros (0621, anchor, DE, GPL-3.0): RTK-GPS autonomous mower ->
#     declare the job (area + drive type + boundary/keep-out/speed/blade
#     envelope), validate before it moves or cuts. Cross-cite. Strongest outdoor
#     target (700 stars, active daily).
#   - roverrobotics_ros2 (0622, US, Apache-2.0): vendor skid-steer rover driver
#     -> clean vendor-platform manifest, validate motion vs the drive envelope.
#   - leo_robot-ros2 (0623, PL, MIT): all-terrain research/education rover ->
#     teachable manifest + validated motion + the NL-to-validated-action loop.
#     Completes the wave.
#
# No license-ask anywhere (every target has a LICENSE; permissive stated plainly,
# the three copyleft ones GPL/AGPL/LGPL framed as cross-citation/layering only,
# no shared code). VIBE.md disclosure up front; per-target body variation;
# em-dash-free titles. DRAFTED 2026-06-21, NOT YET POSTED (sent_at / posted_url
# empty, all rows response: none). Funnel 604 -> 610 when posted.
#
# DROPPED for cause during sourcing (do not re-source): construction/mining lane
# entirely (closed vendors / academic "coming soon" / collides with engaged
# Autoware); JoeyByrnes/OpenLeg (license type unconfirmed at draft time);
# husarion/rosbot_ros (same org as already-engaged husarion/husarion_ugv_ros,
# Move #45); AgileX/Waveshare (PRC); CGoodin/nature-stack + linorobot2 +
# Robotnik + Clearpath + husarion UGV (already touched); perception-only and
# sim-only repos (wrong altitude).

