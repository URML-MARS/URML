# Move #70 outreach ledger. One row per target.
#
# Move #70: **nuclear / hazmat remote-handling + haptic teleoperation.** Drawn
# from slate 4 (the banked, previously-unposted net-new targets); the two lanes
# that survived a 9-lane widened sweep. Non-PRC (GB/US/NL/IT), all with a real
# validate-before-actuate seam. Nuclear/hazmat ties URML's safety-envelope
# identity most directly (you cannot try-and-see in a radiation cell). Posted
# 2026-08-18 under idoco2003 as GitHub issues, RFCs 0677-0681, VIBE disclosure up
# front, no license-ask (cross-citation only; SofaHaply GPL cross-cite dropped for
# weak robot-intent fit before posting).
#
# Nuclear / hazmat (RFCs 0677-0679):
#   - crcopen-ros2 (0677, GB UKAEA, anchor): ros2_control driver to real Comau arms
#     in nuclear cells -> validate a motion/grasp before the driver dispatches it.
#   - safe-ros (0678, GB Manchester): formal safety architecture (FRET/MCAPL/Dafny)
#     that stops the robot before an unsafe move -> URML is the lightweight portable sibling.
#   - cca-ros (0679, US UT Austin): CCA planner emits joint trajectories to real arms
#     -> URML consumes the trajectory + validates admissibility (NOT a constraint source).
#
# Haptic teleoperation (RFCs 0680-0681):
#   - senseglove-ros (0680, NL SenseGlove, sub-lane anchor): force-feedback glove via
#     ros2_control -> validate the teleoperated robot command + the render envelope.
#   - weart (0681, IT WEART): TouchDIVER haptic-glove SDK (force/texture/thermal) ->
#     validate the teleoperated grasp + a force/thermal render envelope.

