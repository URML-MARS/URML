# Move #15 outreach ledger. One row per target.
#
# Move #15 (this file): **niche verticals — surgical / medical, construction,
# delivery, warehouse AMR** (Theme D from the Move-11 backlog gap analysis).
# After Move #14 Theme B (mobile manipulators + humanoids).
#
# **The smallest wave URML has run.** Reflects the closed-vertical market
# reality: across four sub-categories that look substantial in industry
# coverage, only 5 engageable GitHub surfaces exist. The Tier C audit
# (18 excluded with cause) documents the closed-sector pattern:
#   - Surgical OEMs (Intuitive Surgical, Auris/J&J, CMR Surgical, Stryker
#     Mako): all closed. Only research surface (JHU dVRK, IIT iCub)
#     engageable.
#   - Construction OEMs (Built Robotics, Dusty, Canvas, Civ Robotics,
#     Hilti): ZERO engageable.
#   - Delivery OEMs (Nuro, Kiwibot, Cartken): no public GitHub. Only
#     Starship (ROS-bag infrastructure) + Serve Robotics (fork-heavy)
#     engageable.
#   - Warehouse AMR (MiR, Locus, Vecna, Symbotic, OTTO, 6 River): all
#     closed. Already-engaged duplicates (Fetch RFC-0188, Clearpath
#     RFC-0072, Open-RMF RFC-0053) excluded.
#
# Verified 2026-05-28 via two parallel research agents covering surgical/
# construction (Agent 1) and delivery/warehouse (Agent 2), cross-checked
# against all prior ledgers (Moves 1-14).
#
# Engageable set: 5 rows in this ledger (3 Tier A + 2 Tier B). RFC numbers
# reserved 0191-0195 for these 5; each draft is a future session.
#
# Excluded set: 18 candidates were Tier C — full audit trail in
# `examples/lighthouses/move15-research-2026-05-28.md`.
#
# Like Moves #2-#14, this file is NOT under the Move #1 parity test.
# Move #15 RFCs are niche-vertical outreach proposals; the wave is
# research+ledger-stage only in this PR. RFC drafting (5 RFCs likely in
# one batch given the smaller wave) and Issue posting are future work.
#
# Schema mirrors outreach-move14.yaml. Fields: slug, rfc, sent_at,
# posted_url, channel, contact, last_touch, response, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`.
# `none` is the truthful default. All 5 rows below carry
# `sent_at: ""` and `channel: deferred` until per-target RFCs
# are drafted and engagement is posted on the upstream surface.

