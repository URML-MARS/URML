#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #2 (outreach-move2.yaml): AI/ML-layer targets (21 RFCs).
#
# Move #3 (outreach-move3.yaml): affordable / desktop / educational
# tier (4 RFCs).
#
# Move #4 (outreach-move4.yaml): adjacent niches Moves #1-#3 did not
# touch (6 RFCs, Tier 1 from the post-Move-3 adjacent-niches research
# pass).
#
# Move #5 promotes the parked Tier 2 from the Move #4 research pass
# plus DEEP Robotics (Lynx S10 launched 2026-05-22). Nine RFCs total.
# Split:
#   Tier A vendor-style (4): Robotnik, Clearpath, Robotical Marty,
#     DEEP Robotics.
#   Tier B research-collab (5): Stanford Pupper, Open Dynamic Robot
#     Initiative (Solo), MIT CHAMP, Orca4 + ros-maritime, Open Bionics.
#
# Avular was dropped after surface verification (the dutch drone
# vendor has no public GitHub presence; github.com/avular is an
# unrelated personal account). The Move #4 research had named Avular
# with an overstated "ROS 2 + C++ SDK" claim that did not hold up.
#
# Open Bionics was reframed from Tier A vendor to Tier B research-collab
# because the academic OpenBionics GitHub org is dormant (last commits
# 2018-2020) and the commercial Open Bionics Ltd has no GitHub Issue
# surface. RFC-0079 engages the academic org substantively and the
# commercial entity via courtesy outreach.
#
# Like Moves #2, #3, #4, this file is NOT under the Move #1 parity
# test. Adapters referenced in the corresponding RFCs are proposal-only
# until upstream maintainers weigh in.
#
# Schema mirrors outreach-move2.yaml / outreach-move3.yaml /
# outreach-move4.yaml. Fields: slug, rfc, sent_at, posted_url, channel,
# contact, last_touch, response, next_action, notes.
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none`
# is the truthful default.

