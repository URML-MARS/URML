# Move #27 outreach ledger. One row per target.
#
# Move #1 (outreach.yaml): 16 Tier-1 OEMs and component vendors, with
# parity test in conformance/tests/test_outreach_ledger.py.
#
# Move #27 (this file): **manipulation and grasping**. The IK / grasp /
# dexterous-hand / manipulation-planning layer that realizes URML's grasp,
# release, and move_to-a-pose primitives, complementing the planning layer
# (Move #26), the control layer (Move #23), and SLAM (Move #25).
#
# Shared framing: URML's manipulation primitives declare INTENT plus a
# target and the arm/gripper capability (manipulation.grippers {kind,
# force_min_n, force_max_n, accepted_classes}, reachable_workspace_m). A
# manipulation substrate (an IK solver, a grasp detector, a dexterous-hand
# driver, a manipulation planner) computes the joint configuration / grasp
# pose / trajectory. URML does NOT solve IK or detect grasps: it declares
# the target + capability, statically validates the request is admissible
# (target in reachable workspace; grasp within the gripper's force range
# and accepted object classes) BEFORE the substrate runs, then consumes the
# result. Cross-link RFC-0202 (MoveIt), RFC-0342 (OMPL, Move #26), RFC-0010
# (whole-body manip), RFC-0345 (Pinocchio), RFC-0060 (MuJoCo).
#
# Honesty notes: (1) manipulation skews stale, so the live Tier-A favors
# active / major repos and the dormant grasp-detection + IK siblings are
# DEFERRED in grouped rows with cause. (2) NVIDIA manipulation (cuRobo,
# Contact-GraspNet, STORM) is DEFERRED to avoid over-touch (NVIDIA already
# engaged via Isaac Lab RFC-0050 + Isaac Sim RFC-0323). (3) Per the
# 2026-06-03 anti-AI-tell guidance, NO post or RFC carries a
# license-clarification ask.
#
# Already covered, NOT duplicated: MoveIt 2 (RFC-0202), MoveIt Task
# Constructor (RFC-0162), OMPL + the Move #26 planning wave, Pinocchio
# (RFC-0345), MuJoCo (RFC-0060), robosuite (Move #24 Tier B).
#
# Like Moves #2-#26, this file is NOT under the Move #1 parity test. It is
# covered by the schema-v2 validator
# (conformance/tests/test_outreach_ledger_schema_v2.py).
#
# Phase 1 posture: do not massage `response` / `last_touch`. `none` is the
# truthful default. Tier-A rows are DRAFTED (sent_at / posted_url empty)
# until RFCs 0352-0361 land on main; then posted under idoco2003 and
# reconciled. Deferred rows are never posted (channel: deferred).

# ============================================================
# Tier A — live posts (drafted; post after RFCs land on main)
# ============================================================

