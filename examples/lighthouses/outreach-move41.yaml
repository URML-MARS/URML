# Move #41 outreach ledger. One row per target.
#
# Move #41: **the behavior-tree / FSM / task-orchestration wave.** Civilian / research
# scope. URML's Layer-3 behavior composition (sequence/parallel/branch/retry over
# typed, validated primitives) is conceptually peer to BT/FSM/task-orchestration
# engines. INTEROP altitude (not a substrate claim): either (a) a validated URML
# program lowers to a BT/FSM the engine executes, or (b) a BT/FSM leaf/state/skill
# dispatches a single validated URML primitive (validate-before-actuate per node).
# The acid test: the engine is control flow; URML is the typed, capability-checked
# intent the flow carries. Surfaces verified 2026-06-12. (Numbered 0470-0476:
# 0469 was taken by a parallel-session RFC, so the wave shifted +1.)
#
# Shapes (no new spec):
#   - Behavior-tree libraries: BehaviorTree.CPP (0470, anchor; folds BehaviorTree.ROS2),
#     py_trees (0471; folds py_trees_ros).
#   - State-machine engines: SMACC2 (0472, event-driven ROS 2 FSM), transitions
#     (0473, B, general-purpose Python FSM), FlexBE (0474, B, operator-in-the-loop FSM).
#   - Skill / task-planning orchestration: SkiROS2 (0475, B, closest peer to URML's
#     typed-primitive posture), ROSPlan (0476, B, PDDL planner — plan -> validate -> dispatch).
#
# Anchor-plus-fold: BehaviorTree org (BehaviorTree.CPP anchor, ref BehaviorTree.ROS2);
# splintered-reality (py_trees anchor, ref py_trees_ros).
#
# DEFERRED: uleroboticsgroup/yasmin (GPL-3.0 strong copyleft complicates an interop
# pitch; active Spain FSM — revisit if a permissive path matters).
#
# FLAG/EXCLUDED: PlanSys2 / IntelligentRoboticsLabs/ros2_planning_system (already
# engaged Move #26, task-planner peer); Nav2 / nav2_behavior_tree (Macenski, AVOID —
# 2x hostile closes); BehaviorTree/Groot2 (closed/commercial); BehaviorTree/Groot
# (GPL, maintenance-frozen, already-considered); ros/executive_smach (dormant, SMACC2/
# transitions are the live FSMs); JS BT libs (mistreevous/behavior3js/BehaviorTree.js
# — non-robotics, games/web, out of altitude). DEFER-PRC: none.
#
# DRAFTED, NOT POSTED: empty sent_at / posted_url, response: none, until the founder
# authorizes posting. Then post the posts-move41.md body under idoco2003 (Discussion
# or Issue per channel), set sent_at / posted_url / last_touch, add a posted comment,
