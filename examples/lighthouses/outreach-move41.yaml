    - date: "2026-06-12"
      text: "gerardcanal (Gerard Canal, KCL maintainer) replied same-day, engaged and constructive: 'sounds interesting, happy to look into URML.' Three questions: (1) how the capability part relates to a PDDL domain (the domain already encodes what the robot can do); (2) is URML a different dispatcher checking action validity (conditions still hold); (3) what happens on validation failure -- feeding it back to the planner would be nice, otherwise the same plan comes back. Looped in @m312z. Replied: PDDL domain is the symbolic model, URML manifest+envelope is the physical-limits + safety admissibility layer; yes URML is a validating dispatcher (halts on first inadmissible action); the rejection is structured (action + failing pass + codes + violated constraint) and is exactly the replan-feedback to feed back. SHIPPED examples/planning/ (PR #393): dispatch a symbolically-valid plan that routes through a people-occupancy zone -> URML halts (envelope.occupancy_zone_intrusion) -> structured replan-feedback -> re-plan dispatches in full. Asked gerardcanal/m312z whether the feedback should be PDDL (a predicate / action removal) vs the structured shape."
  claude_directives:
    - date: "2026-06-12"
      text: "When authorized, post the posts-move41.md ROSPlan body as a GitHub Issue on KCL-Planning/ROSPlan under idoco2003; set sent_at / posted_url / last_touch; add a posted comment; refresh outreach.db."
