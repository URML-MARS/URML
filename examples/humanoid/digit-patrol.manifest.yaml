# Fixture: Agility Robotics Digit — RFC-0009 follow-up manifest.
# drive_type: biped (RFC-0009). US origin (Agility, Oregon), compliant
# under the bundled US-federal default policy. Companion to the
# humanoid runtime's DigitAdapter (locomotion subset); the conformance
# fixture is navigation-only and runs hermetically.

manifest_version: "0.1"
robot_id: digit_logistics_1
description: Bipedal logistics humanoid (locomotion subset, v0.1).

frames:
  - name: site
    parent: null
  - name: body
    parent: site

declared_locations:
  - name: staging_a
    pose: { x: 6.0, y: 0.0, z: 0.0 }
    frame: site
  - name: staging_b
    pose: { x: 6.0, y: 4.0, z: 0.0 }
    frame: site
  - name: dock
    pose: { x: 0.0, y: 0.0, z: 0.0 }
    frame: site

declared_events:
  - estop_engaged
  - aisle_clear

mobility:
  drive_type: biped
  max_velocity: 1.5
  station_keeping: true

perception:
  cameras:
    - name: head_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: battery
      measurement_type: voltage
      range_min: 0.0
      range_max: 100.0
      units: percent
  object_vocabulary:
    - tote

docking_stations: []

outputs:
  named_endpoints:
    - wms_log

provenance:
  manifest_attestation: self_declared
  components:
    - id: digit_compute
      role: critical
      vendor: agility
      country_of_origin: US
      country_of_final_assembly: US
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/digit_compute.cdx.json
        sha256: "7777777777777777777777777777777777777777777777777777777777777777"
