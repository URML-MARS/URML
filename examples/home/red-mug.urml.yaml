# URML v0.1 — generated from natural language
#
# Scenario: home/red-mug
# Source NL: "Bring me the red mug from the kitchen." (see red-mug.en.txt)
#
# The canonical home-profile example, reproduced from MANIFESTO.md
# §A Concrete Example. Validatable end-to-end via the companion
# manifest `red-mug.manifest.yaml`:
#
#   urml validate red-mug.urml.yaml -m red-mug.manifest.yaml --profile home
#
# The companion manifest declares fully US-compliant hardware
# provenance, so the bundled default policy (RFC-0004) accepts it.
# Pass `--no-policy` to skip Pass 5 if you're exercising the program
# against a manifest without a provenance block.

profile: home
behavior:
  type: sequence
  on_error: abort_and_report
  steps:
    - move_to:
        location: kitchen
    - detect:
        object: mug
        attributes:
          color: red
        store_as: target_mug
    - grasp:
        target: $target_mug
        force: gentle
    - move_to:
        location: user
        carrying: $target_mug
    - release:
        mode: hand_to_user
