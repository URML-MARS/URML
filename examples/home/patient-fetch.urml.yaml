# URML v0.1 — generated from natural language
#
# Scenario: home/patient-fetch
# Source NL: "Keep looking for my blue notebook; if you find the blue one
#             bring it to me, otherwise just tell me." (see *.en.txt)
#
# A Layer-3 composition example: `retry` (look again until a confident
# detection), `branch` (act on the detected attribute via a condition
# expression), nested `sequence`, and variable bindings ($notebook).
# Validatable end-to-end via the companion manifest:
#
#   urml validate patient-fetch.urml.yaml \
#     -m patient-fetch.manifest.yaml --profile home
#
# The companion manifest declares US-compliant provenance, so the bundled
# default policy (RFC-0004) accepts it. Pass `--no-policy` to skip Pass 5.

profile: home
behavior:
  type: sequence
  on_error: abort_and_report
  steps:
    - speak:
        utterance: "Looking for your notebook."
    - type: retry
      max_attempts: 5
      until: "$notebook.confidence > 0.9"
      behavior:
        detect:
          object: notebook
          attributes:
            color: blue
          store_as: notebook
    - type: branch
      condition: '$notebook.attributes.color == "blue"'
      if_true:
        type: sequence
        steps:
          - grasp:
              target: $notebook
              force: gentle
          - move_to:
              location: user
              carrying: $notebook
          - release:
              mode: hand_to_user
      if_false:
        speak:
          utterance: "I found a notebook, but it isn't the blue one."
