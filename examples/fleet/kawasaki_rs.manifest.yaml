# Fleet demo — member manifest: the arm (a stationary industrial arm).
#
# The other half of the courier-to-arm handoff (RFC-0286). A Kawasaki-class
# manipulator that picks a widget from the shared handoff dock and places it on
# an outbound conveyor. `drive_type: manipulator_base` (max_velocity 0) is how a
# stationary arm satisfies the pick_from / place_at mobility requirement without
# being mobile. It declares `peer_link` for the barrier rendezvous.

manifest_version: "0.1"
robot_id: kawasaki_rs
description: Stationary industrial arm for the fleet handoff demo.

frames:
  - name: cell
    parent: null
  - name: site         # RFC-0287: the shared site frame both members reference at the dock
    parent: null

declared_locations:
  - name: handoff_dock
    pose: { x: 4.0, y: 2.0, z: 0.4 }
    frame: site
    description: Shared exchange point — the same named dock the courier drives to.
  - name: conveyor_a
    pose: { x: 0.4, y: 0.5, z: 0.4 }
    frame: cell
    description: Outbound conveyor station.

mobility:
  drive_type: manipulator_base
  max_velocity: 0.0

manipulation:
  arm_count: 1
  grippers:
    - name: rs_gripper
      kind: servo_electric
      force_min_n: 1.0
      force_max_n: 50.0
      accepted_classes: [widget]
      movable: true
  reachable_workspace_m: 0.9

perception:
  cameras:
    - name: wrist_cam
      movable: true
      supports_photo: true
  object_vocabulary:
    - widget

connectivity:
  links:
    - role: peer_link
      description: Robot-to-robot link used to rendezvous with the courier at a barrier.
