# Manifest for the industrial/declared-intent-cycle example (RFC-0616). A cell
# whose commissioned, opaque program carries a best-effort declared_intent. The
# opaque AS-language program `pick_place_cycle` opts in to a best-effort,
# asserted declaration of the primitives it exercises (move_to, grasp,
# place_at), validated as a claim against the manifest. mobility + manipulation
# are present, so the claim is supported; attestation `asserted` raises the
# best-effort advisory (capability.declared_intent_asserted, a warning).

manifest_version: "0.1"
robot_id: declared_intent_cell_1
description: Single-arm cell with a commissioned program that declares its intent (RFC-0616).

frames:
  - name: cell
    parent: null
  - name: base_link
    parent: cell

declared_locations:
  - name: pick_bin
    pose: { x: 0.4, y: -0.3, z: 0.10 }
    frame: cell
  - name: kitting_tray_red
    pose: { x: -0.4, y: 0.2, z: 0.10 }
    frame: cell
  - name: home_pose
    pose: { x: 0.0, y: 0.0, z: 0.30 }
    frame: cell

declared_events:
  - safety_door_closed
  - emergency_stop

mobility:
  drive_type: manipulator_base
  max_velocity: 0.50
  station_keeping: true

manipulation:
  arm_count: 1
  grippers:
    - name: pneumatic_2_finger
      kind: pneumatic
      force_min_n: 1.0
      force_max_n: 25.0
      accepted_classes: [widget, widget_red, widget_blue, small_part]
      movable: true
  reachable_workspace_m: 0.85

perception:
  cameras:
    - name: wrist_rgb
      movable: true
      supports_photo: true
      supports_video: false
      supports_stream: false
      max_resolution: "1080p"
  sensors:
    - name: tcp_force
      measurement_type: pressure
      range_min: 0.0
      range_max: 50.0
      units: N
  object_vocabulary:
    - widget
    - widget_red
    - widget_blue
    - small_part

programs:
  - name: pick_place_cycle
    description: Commissioned AS-language pick-and-place cycle.
    declared_intent:
      primitives: [move_to, grasp, place_at]
      attestation: asserted
      max_force_n: 20.0
      note: Best-effort declaration of the commissioned routine, made correct by hand.
  - name: home_all
    description: AS-language routine that sends all axes to the home pose.

docking_stations: []

outputs:
  named_endpoints:
    - line_controller

provenance:
  manifest_attestation: self_declared
  components:
    - id: arm_controller
      role: critical
      vendor: kawasaki
      country_of_origin: JP
      country_of_final_assembly: JP
      hbom_ref:
        format: cyclonedx-1.7
        uri: ./hbom/controller.cdx.json
        sha256: "1616161616161616161616161616161616161616161616161616161616161616"
