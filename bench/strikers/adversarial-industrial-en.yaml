    {"pick_from": {"source": "pick_bin", "object": "widget_red", "force": 10.0, "store_as": "red"}},
    {"place_at": {"target": "kitting_tray_red", "held": "$red"}}]}}

"camera sweep across the left side":
  {"profile": "industrial", "behavior": {"type": "sequence", "on_error": "abort_and_report", "steps": [
    {"scan": {"area": {"bounding_box": {"min_x": -0.58, "max_x": -0.2, "min_y": 0.0, "max_y": 0.4}},
              "pattern": "serpentine", "media": "photo", "sensor": "wrist_rgb", "store_as": "sweep"}}]}}

