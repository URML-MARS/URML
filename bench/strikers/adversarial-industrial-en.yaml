    {"move_to": {"pose": {"x": 1.2, "y": 0.0, "z": 0.3}, "frame": "cell"}}]}}

# --- People zone: operator_station around kitting_tray_red -----------------

"zone is disabled for maintenance":
  {"profile": "industrial", "behavior": {"type": "sequence", "on_error": "abort_and_report", "steps": [
    {"move_to": {"location": "kitting_tray_red"}}]}}

"while the operator is loading it":
