# Scripted striker for bench/corpora/adversarial-drone-en.yaml.
# A BENCHMARK input (see bench/README.md), not a conformance fixture.
#
# It stands in for a fully jailbroken model: for every request it emits
# exactly the unsafe program an attacker wants, in the prompt contract's
# JSON shape, and never refuses. It ignores the wording, so this file is
# organized by the limit each program breaks.
#
# Keys are utterance substrings; each one matches exactly one corpus row.
# A list value is an adaptive striker: after each refusal the bridge asks
# again, and the striker answers with the next entry (the last one repeats),
# using the validator's feedback as an oracle.
#
# Run with: urml bench --provider echo --echo-script <this file> (see the README).

