# URML registry entry. The fields are explained in registry/README.md and
# described by registry/entry.schema.json. Check with:
#   python -m urml_conformance.registry check
registry_version: "1"
id: gopigo3-example-adapter
title: GoPiGo3 educational robot, through the URML GoPiGo3 example adapter
status: listed
listed: "2026-09-27"
last_verified: "2026-09-27"
submitted_by: URML maintainers

robot:
  name: GoPiGo3
  class: two-wheel educational ground robot on a Raspberry Pi
  maker: Dexter Industries
  manifest: examples/gopigo3/gopigo3.manifest.yaml

runtime:
  package: examples/gopigo3
  version: "0.4.0"
  adapter: gopigo3_adapter:GoPiGo3Adapter
  substrate: Dexter Industries' easygopigo3 library on the robot's Raspberry Pi, no ROS

profiles: [educational]

field_evidence:
  - kind: hardware_run
    date: "2026-06-25"
    by: "@slowrunner, an independent user, on his own GoPiGo3"
    summary: >-
      On his GoPiGo3 (Lyrical-Dave, with a Raspberry Pi), the example's two
      built-in programs ran through the real easygopigo3 library: the robot
      turned 90 degrees and drove under a chair. He had typed -h, and the
      example as it then stood drove the robot; the same day the maintainers
      made a bare run a dry run, with --execute to drive. Later that day he
      ran the whole loop from a sentence: "Announce 'Driving forward 10
      centimeters' and then execute the action", translated by qwen3.5:9b
      served through Ollama (a first request timed out; the retry was accepted
      after 0 revisions). The validated program ran with --execute, 2 steps,
      success, and the robot moved 10 cm. Speech was not heard in either run.
    sources:
      - https://github.com/URML-MARS/URML/discussions/542
      - https://github.com/URML-MARS/URML/discussions/523
      - https://urml.dev/blog/field-notes-first-robot-runs-urml
      - https://github.com/URML-MARS/URML/commit/58ac44cdfb79ee64496e8790fa294a6fe176f806
  - kind: hardware_run
    date: "2026-07-07"
    by: "@slowrunner"
    summary: >-
      On the same robot, turns and arcs ran clockwise where URML specifies
      counterclockwise as positive (Issues #591 and #598, opened 2026-07-04
      and 2026-07-06). His fix negates the angle and the arc at the
      easygopigo3 call; with --execute the robot then turned and orbited
      counterclockwise. It was merged on 2026-08-05, URML's first merged
      external code contribution.
    sources:
      - https://github.com/URML-MARS/URML/issues/591
      - https://github.com/URML-MARS/URML/issues/598
      - https://github.com/URML-MARS/URML/pull/602
      - https://github.com/URML-MARS/URML/commit/a93fe58d906adc147660bc2101b22f0ec2ceb434
      - CHANGELOG.md

validation_records:
  path: registry/evidence/gopigo3-example-adapter/validation-records.jsonl
  sha256: 6588a862bd9621b643455932c1b87ecaf26f759a47c4396dbb8e56c737c9661c
  summary: >-
    Produced for this listing on 2026-09-27 with the urml_validator.evidence
    API, by validating against the listed manifest the example's two built-in
    programs (announce then drive 1 m, and the short patrol; both accepted)
    and four refusal cases (a 3 m drive in one move, picking up a cup, a
    take-off, a trip to an undeclared kitchen), with the compliance policy
    pass off. The two accepted programs carry a warning that the manifest
    declares no text-to-speech engine. The records show the gate's verdicts on
    this manifest; they are not logs from the robot.
  inputs:
    manifest: examples/gopigo3/gopigo3.manifest.yaml
    policy: none

limits:
  - The hardware runs are @slowrunner's, on his robot, as he reported them in public threads. The maintainers have not reproduced them on a GoPiGo3.
  - The URML maintainers compiled this entry from those public reports; @slowrunner did not submit it.
  - The committed examples/gopigo3/gopigo3-report.txt is a dry run against a fake backend. It moves nothing and shows no hardware behavior.
  - The adapter is an example in examples/gopigo3, not a packaged runtime. It carries the version of the URML packages it runs on (0.4.0 today); the June runs used the example as it stood on 2026-06-25, on URML 0.2.0.
  - The example has changed since the last recorded hardware run (2026-07-07). The frame fix was reworked on 2026-07-23, and since 2026-09-07 a wait step holds the robot on the real clock under --execute. Those versions have no recorded hardware run.
  - No conformance self-report. The adapter drives the wheels through easygopigo3 on the robot, so the suite cannot run it anywhere else without a fake backend, and a fake backend would show nothing about the robot. The suite also has no fixture for the drive and turn primitives this robot moves with.
  - The gate does not compare a drive speed with the manifest's 0.3 m/s max_velocity; docs/safety/envelope-coverage.md leaves base velocity limits to the consuming node (RFC-0518). The example adapter passes no speed to easygopigo3, so the robot moves at the library's default speed.
  - The validation records were judged with the compliance policy pass off. The manifest declares no provenance, and this listing makes no compliance statement.
